name: V17 Access Permission Diagnostic V2
on:
  push:
    branches: [agent/v17-vendor-admin-mvp-customer-ready]
    paths: ['.github/workflows/v17-access-permission-diagnostic-v2.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: "fulfilling-communication / production"
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v17-vendor-admin-mvp-customer-ready }
      - name: Probe Cloudflare permission boundaries
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          probe(){
            local name="$1" url="$2"
            local code
            code="$(curl -sS -o "/tmp/${name}.json" -w '%{http_code}' "${auth[@]}" "$url" || true)"
            printf '%s_http=%s\n' "$name" "$code" >> /tmp/result
            python3 - "$name" <<'PY'
import json,sys
p='/tmp/'+sys.argv[1]+'.json'
try:
 x=json.load(open(p)); errs=x.get('errors') or []
 code=errs[0].get('code') if errs else ''
 print(f'{sys.argv[1]}_api_error_code={code}')
except Exception:
 print(f'{sys.argv[1]}_api_error_code=unparseable')
PY
          }
          : > /tmp/result
          probe token_verify "${API}/user/tokens/verify"
          probe workers_scripts "${API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"
          probe access_org "${API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/organizations"
          probe access_apps "${API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps?per_page=1"
          mkdir -p v17-vendor-admin-mvp/evidence
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "source_sha=${GITHUB_SHA}"
            cat /tmp/result
          } > v17-vendor-admin-mvp/evidence/access-permission-v2-latest.txt
      - name: Persist diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v17-vendor-admin-mvp/evidence/access-permission-v2-latest.txt
          git commit -m 'ci(v17): record Access permission diagnostic v2' || exit 0
          git fetch origin agent/v17-vendor-admin-mvp-customer-ready
          git rebase origin/agent/v17-vendor-admin-mvp-customer-ready
          git push origin HEAD:agent/v17-vendor-admin-mvp-customer-ready
