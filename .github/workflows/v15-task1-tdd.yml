name: V15 Task 1 TDD Gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v15-task1-white-label-contract
    paths:
      - 'v15-patches/**'
      - '.github/workflows/v15-task1-tdd.yml'

permissions:
  contents: read
  actions: read

jobs:
  task1-task2-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V15 gate branch
        uses: actions/checkout@v4

      - name: Download immutable V14 candidate
        uses: actions/download-artifact@v5
        with:
          name: v14-task12-candidate-pending-d1-smoke
          path: candidate
          github-token: ${{ github.token }}
          repository: winza125-sitticun/dorm-management-system
          run-id: 31980850645

      - name: Extract exact V14 R3-CI source
        shell: bash
        run: |
          set -euo pipefail
          MASTER_ZIP="$(find candidate -type f -name 'dorm-management-system-master-v14-REVIEW-R3-CI.zip' -print -quit)"
          test -n "$MASTER_ZIP"
          echo 'f130f9df0b9cff927b34b8281542b755b85084b4f68fec6d383033969cec53ab  '"$MASTER_ZIP" | sha256sum --check --strict
          mkdir source
          unzip -q "$MASTER_ZIP" -d source
          test -f source/package.json

      - name: Apply Task 1 RED test only
        working-directory: source
        run: patch -p1 < ../v15-patches/001-task1-test.patch

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install exact dependencies
        working-directory: source
        run: npm ci

      - name: Verify Task 1 RED
        working-directory: source
        shell: bash
        run: |
          set +e
          npx tsx --test tests/plan-entitlements.test.ts > ../task1-red.log 2>&1
          rc=$?
          set -e
          cat ../task1-red.log
          if [ "$rc" -eq 0 ]; then
            echo '::error::Task 1 RED test unexpectedly passed before implementation'
            exit 1
          fi
          echo 'Task 1 RED confirmed.'

      - name: Apply Task 1 implementation
        working-directory: source
        run: patch -p1 < ../v15-patches/002-task1-impl.patch

      - name: Verify Task 1 GREEN
        working-directory: source
        run: npx tsx --test tests/plan-entitlements.test.ts

      - name: Static Task 1 review assertions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "| 'whiteLabel'" src/constants/planEntitlements.ts
          grep -q "backupRestore', 'whiteLabel'" src/constants/planEntitlements.ts
          grep -q "hasPlanFeature('demo', 'promptPay'), true" tests/plan-entitlements.test.ts
          grep -q "hasPlanFeature('basic', 'promptPay'), false" tests/plan-entitlements.test.ts

      - name: Apply Task 2 RED tests only
        working-directory: source
        run: patch -p1 < ../v15-patches/003-task2-test.patch

      - name: Verify Task 2 RED
        working-directory: source
        shell: bash
        run: |
          set +e
          npx tsx --test tests/settings-white-label.test.ts > ../task2-red.log 2>&1
          rc=$?
          set -e
          cat ../task2-red.log
          if [ "$rc" -eq 0 ]; then
            echo '::error::Task 2 RED test unexpectedly passed before implementation'
            exit 1
          fi
          echo 'Task 2 RED confirmed.'

      - name: Apply Task 2 implementation
        working-directory: source
        run: patch -p1 < ../v15-patches/004-task2-impl.patch

      - name: Verify Task 2 GREEN
        working-directory: source
        run: npx tsx --test tests/settings-white-label.test.ts

      - name: Static Task 2 review assertions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'ALTER TABLE settings ADD COLUMN brand_logo_key TEXT' d1-migrations/0006_add_white_label_settings.sql
          grep -qi 'ALTER TABLE settings ADD COLUMN brand_color TEXT' d1-migrations/0006_add_white_label_settings.sql
          ! grep -Eqi 'DROP[[:space:]]+COLUMN|RENAME[[:space:]]+COLUMN|NOT[[:space:]]+NULL' d1-migrations/0006_add_white_label_settings.sql
          grep -q 'whiteLabelEnabled?: boolean' src/types.ts
          ! grep -q 'brandLogoKey' src/types.ts
