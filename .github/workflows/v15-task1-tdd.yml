name: V15 Task 1 TDD Gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v15-task1-white-label-contract
    paths:
      - 'v15-patches/**'
      - '.github/workflows/v15-task1-tdd.yml'

permissions:
  contents: read
  actions: read

jobs:
  task1-through-task6-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout V15 gate branch
        uses: actions/checkout@v4

      - name: Download immutable V14 candidate
        uses: actions/download-artifact@v5
        with:
          name: v14-task12-candidate-pending-d1-smoke
          path: candidate
          github-token: ${{ github.token }}
          repository: winza125-sitticun/dorm-management-system
          run-id: 31980850645

      - name: Extract exact V14 R3-CI source
        shell: bash
        run: |
          set -euo pipefail
          MASTER_ZIP="$(find candidate -type f -name 'dorm-management-system-master-v14-REVIEW-R3-CI.zip' -print -quit)"
          test -n "$MASTER_ZIP"
          echo 'f130f9df0b9cff927b34b8281542b755b85084b4f68fec6d383033969cec53ab  '"$MASTER_ZIP" | sha256sum --check --strict
          mkdir source
          unzip -q "$MASTER_ZIP" -d source
          test -f source/package.json

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install exact dependencies
        working-directory: source
        run: npm ci

      - name: Task 1 RED then GREEN
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < ../v15-patches/001-task1-test.patch
          set +e
          npx tsx --test tests/plan-entitlements.test.ts > ../task1-red.log 2>&1
          rc=$?
          set -e
          cat ../task1-red.log
          test "$rc" -ne 0
          patch -p1 < ../v15-patches/002-task1-impl.patch
          npx tsx --test tests/plan-entitlements.test.ts

      - name: Task 2 RED then GREEN
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < ../v15-patches/003-task2-test.patch
          set +e
          npx tsx --test tests/settings-white-label.test.ts > ../task2-red.log 2>&1
          rc=$?
          set -e
          cat ../task2-red.log
          test "$rc" -ne 0
          patch -p1 < ../v15-patches/004-task2-impl.patch
          npx tsx --test tests/settings-white-label.test.ts
          ! grep -Eqi 'DROP[[:space:]]+COLUMN|RENAME[[:space:]]+COLUMN|NOT[[:space:]]+NULL' d1-migrations/0006_add_white_label_settings.sql

      - name: Task 3 RED then GREEN
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < ../v15-patches/005-task3-test.patch
          set +e
          npx tsx --test tests/settings-white-label.test.ts > ../task3-red.log 2>&1
          rc=$?
          set -e
          cat ../task3-red.log
          test "$rc" -ne 0
          patch -p1 < ../v15-patches/006-task3-impl.patch
          npx tsx --test tests/settings-white-label.test.ts

      - name: Task 4 RED then GREEN
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < ../v15-patches/007-task4-test.patch
          set +e
          npx tsx --test tests/settings-white-label.test.ts tests/plan-api-guards.test.ts > ../task4-red.log 2>&1
          rc=$?
          set -e
          cat ../task4-red.log
          test "$rc" -ne 0
          patch -p1 < ../v15-patches/008-task4-impl.patch
          npx tsx --test tests/settings-white-label.test.ts tests/plan-api-guards.test.ts
          npm run lint

      - name: Task 4 static contract review
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "hasPlanFeature(subscriptionPlan, 'whiteLabel')" 'functions/api/[[path]].ts'
          grep -q 'changedWhiteLabelFields(existing' 'functions/api/[[path]].ts'
          grep -q 'legacySettingsChanged' 'functions/api/[[path]].ts'
          grep -q 'brand_color = ?' 'functions/api/[[path]].ts'
          grep -q 'contact_phone = ?' 'functions/api/[[path]].ts'
          grep -q 'bill_footer = ?' 'functions/api/[[path]].ts'
          ! grep -q 'brand_logo_key = ?' 'functions/api/[[path]].ts'
          grep -q "whiteLabel') return 'basic'" src/server/services/planAccess.service.ts

      - name: Task 5 RED then focused GREEN
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < ../v15-patches/010-task5-test.patch
          set +e
          npx tsx --test tests/backup-validation.test.ts > ../task5-red.log 2>&1
          rc=$?
          set -e
          cat ../task5-red.log
          test "$rc" -ne 0
          patch -p1 < ../v15-patches/011-task5-impl.patch
          npx tsx --test tests/backup-validation.test.ts

      - name: Task 5 static backup contract review
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BACKUP_FORMAT_VERSION = 1 as const' src/utils/backupFormat.ts
          grep -q 'BACKUP_LEGACY_SCHEMA_VERSION = 6 as const' src/utils/backupFormat.ts
          grep -q 'BACKUP_SCHEMA_VERSION = 7 as const' src/utils/backupFormat.ts
          grep -q 'BackupManifestSchemaV6' src/server/validators/backup.ts
          grep -q 'BackupDataSchemaV6' src/server/validators/backup.ts
          grep -q 'BackupRestoreRequestSchema = z.union' src/server/validators/backup.ts
          grep -q 'brandColor: string | null' src/utils/backupFormat.ts
          grep -q 'contactPhone: string | null' src/utils/backupFormat.ts
          grep -q 'billFooter: string | null' src/utils/backupFormat.ts
          ! grep -q 'brandLogoKey' src/utils/backupFormat.ts
          ! grep -q 'brandLogoKey' src/server/validators/backup.ts

      - name: Task 6 RED then GREEN
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < ../v15-patches/012-task6-test.patch
          set +e
          npx tsx --test tests/backup-export.test.ts tests/backup-restore.test.ts tests/backup-restore-api.test.ts > ../task6-red.log 2>&1
          rc=$?
          set -e
          cat ../task6-red.log
          if [ "$rc" -eq 0 ]; then
            echo '::error::Task 6 RED tests unexpectedly passed before implementation'
            exit 1
          fi
          patch -p1 < ../v15-patches/013-task6-impl.patch
          npx tsx --test tests/backup-export.test.ts tests/backup-validation.test.ts tests/backup-restore.test.ts tests/backup-restore-api.test.ts
          npm run lint

      - name: Task 6 static preservation review
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'brand_color, contact_phone, bill_footer' src/server/services/backup.service.ts
          grep -q 'brand_logo_key' src/server/services/backup.service.ts
          grep -q 'BACKUP_LEGACY_SCHEMA_VERSION' src/server/services/restore.service.ts
          grep -q 'manifest.schemaVersion' 'functions/api/[[path]].ts'
          grep -q 'brand_color=?,contact_phone=?,bill_footer=?' src/server/services/restore.service.ts
          ! grep -q 'brand_logo_key=?' src/server/services/restore.service.ts
          ! grep -q 'brandLogoKey:' src/utils/backupFormat.ts
