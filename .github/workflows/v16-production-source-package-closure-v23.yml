name: V16 Production Source Package Closure V23
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-source-package-closure-v23.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-source-package-closure-v23, cancel-in-progress: true }
env:
  V13_ARTIFACT_ID: '9391068149'
  V13_ARTIFACT_SHA256: '14e094a00c75bf0b538df4b0d396264c3af28f53b96a95d379e01390005e72ff'
  FIX8_SHA256: '3af6fd8af60efebf9423cc672d5910cae660d6f2ad195e6e3fe2619c9e01359b'
  SIGNING_PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  SIGNING_PUBLIC_KEY_FINGERPRINT: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  CONTROL_PLANE_URL: 'https://dorm-control-plane.winza125.workers.dev'
  MIGRATION_CEILING: '0007_add_license_state.sql'
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Reconstruct exact V13 and apply Fix 8
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/v16-v23-*.ok
          echo "$FIX8_SHA256  v16-production-input/V16_PRODUCTION_FIX_8_EXPLICIT_REFRESH_FAIL_CLOSED.patch" | sha256sum -c -
          rm -rf /tmp/v13 /tmp/work /tmp/control-plane; mkdir -p /tmp/v13 /tmp/work /tmp/control-plane
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V13_ARTIFACT_ID}/zip" -o /tmp/v13.zip
          echo "$V13_ARTIFACT_SHA256  /tmp/v13.zip" | sha256sum -c -
          unzip -q /tmp/v13.zip -d /tmp/v13
          (cd /tmp/v13 && sha256sum -c SHA256SUMS.txt)
          unzip -q /tmp/v13/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED-V13.zip -d /tmp/work
          unzip -q /tmp/v13/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip -d /tmp/control-plane
          (cd /tmp/work && patch --dry-run -p1 < "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_8_EXPLICIT_REFRESH_FAIL_CLOSED.patch" && patch -p1 < "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_8_EXPLICIT_REFRESH_FAIL_CLOSED.patch")
          test "$(find /tmp/work/d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
          test ! -e /tmp/work/control-plane
          grep -Fq "UPDATE license_state SET status = ?, effective_plan = NULL" /tmp/work/src/server/services/license.service.ts
          grep -Fq "['INVALID_TOKEN', 'LICENSE_INVALID', 'LICENSE_INACTIVE', 'LICENSE_EXPIRED', 'ACTIVATION_REVOKED']" /tmp/work/src/server/services/license.service.ts
          touch /tmp/v16-v23-reconstruct.ok
      - name: Customer audit tests types builds
        working-directory: /tmp/work
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --json > /tmp/v23-audit.json 2>/tmp/v23-audit.err || true
          node - <<'NODE'
          const a=require('/tmp/v23-audit.json'),v=a.metadata?.vulnerabilities||{}; console.log(v); if((v.high||0)!==0||(v.critical||0)!==0) process.exit(1);
          NODE
          touch /tmp/v16-v23-audit.ok
          npm test
          npm run lint
          npm run check:cloudflare-types:master
          npm run build:pages
          npm run build:vps
          touch /tmp/v16-v23-customer.ok
      - name: Generate and verify four customer packages
        working-directory: /tmp/work
        env:
          V16_LICENSE_SIGNING_PUBLIC_KEY: '${{ env.SIGNING_PUBLIC_KEY_B64 }}'
          V16_LICENSE_CONTROL_PLANE_URL: '${{ env.CONTROL_PLANE_URL }}'
        shell: bash
        run: |
          set -euo pipefail
          npm run packages:generate
          for p in demo basic standard pro; do
            z="preview-v14/dorm-management-system-${p}-v14-PREVIEW.zip"; test -f "$z"; unzip -t "$z" >/dev/null
            t="$(mktemp -d)"; unzip -q "$z" -d "$t"
            test "$(find "$t/d1-migrations" -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
            test ! -e "$t/control-plane"
            ! grep -RIl --exclude='*.zip' 'LICENSE_SIGNING_PRIVATE_KEY' "$t" | grep -q .
            grep -Fq "UPDATE license_state SET status = ?, effective_plan = NULL" "$t/src/server/services/license.service.ts"
            grep -Fq "$SIGNING_PUBLIC_KEY_B64" "$t/src/generated/licenseConfig.ts"
            grep -Fq "$CONTROL_PLANE_URL" "$t/src/generated/licenseConfig.ts"
            rm -rf "$t"
          done
          touch /tmp/v16-v23-packages.ok
      - name: Control Plane tests and typecheck
        working-directory: /tmp/control-plane
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run typecheck
          touch /tmp/v16-v23-control-plane.ok
      - name: Private material scan and freeze
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist-server 'LICENSE_SIGNING_PRIVATE_KEY' /tmp/work | grep -q .
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist-server 'BEGIN PRIVATE KEY' /tmp/work | grep -q .
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules 'BEGIN PRIVATE KEY' /tmp/control-plane | grep -q .
          touch /tmp/v16-v23-private.ok
          for m in reconstruct audit customer packages control-plane private; do test -f "/tmp/v16-v23-${m}.ok"; done
          rm -rf v16-production-source-package-v23; mkdir -p v16-production-source-package-v23/customer-previews
          (cd /tmp/work && zip -qr "$GITHUB_WORKSPACE/v16-production-source-package-v23/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED-V23.zip" . -x 'node_modules/*' 'dist/*' 'dist-server/*' 'preview-v14/*' 'release-v14/*')
          (cd /tmp/control-plane && zip -qr "$GITHUB_WORKSPACE/v16-production-source-package-v23/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" . -x 'node_modules/*')
          for p in demo basic standard pro; do cp "/tmp/work/preview-v14/dorm-management-system-${p}-v14-PREVIEW.zip" "v16-production-source-package-v23/customer-previews/dorm-management-system-${p}-v16-SOURCE-GATE-V23.zip"; done
          cp v16-production-input/V16_PRODUCTION_FIX_8_EXPLICIT_REFRESH_FAIL_CLOSED.patch v16-production-source-package-v23/
          find /tmp/work -type f ! -path '/tmp/work/node_modules/*' ! -path '/tmp/work/dist/*' ! -path '/tmp/work/dist-server/*' ! -path '/tmp/work/preview-v14/*' ! -path '/tmp/work/release-v14/*' -print0 | sort -z | xargs -0 sha256sum > v16-production-source-package-v23/V16_FINAL_CUSTOMER_SOURCE_TREE_SHA256.txt
          (cd v16-production-source-package-v23 && sha256sum *.zip customer-previews/*.zip > SHA256SUMS.txt)
          touch /tmp/v16-v23-freeze.ok
      - uses: actions/upload-artifact@v4
        with: { name: v16-production-source-package-v23, path: 'v16-production-source-package-v23/**', if-no-files-found: error, retention-days: 14 }
      - name: Persist fail-safe evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          val(){ [ -f "/tmp/v16-v23-$1.ok" ] && printf success || printf failure; }
          audit=unavailable; [ -s /tmp/v23-audit.json ] && audit="$(node -e "const a=require('/tmp/v23-audit.json'),v=a.metadata?.vulnerabilities||{};process.stdout.write('low='+(v.low||0)+' moderate='+(v.moderate||0)+' high='+(v.high||0)+' critical='+(v.critical||0)+' total='+(v.total||0))")"
          cat > v16-production-evidence/source-package-v23-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          reconstruct=$(val reconstruct)
          dependency_audit=$(val audit)
          audit_counts=${audit}
          customer_tests_types_builds=$(val customer)
          four_packages=$(val packages)
          control_plane_tests_typecheck=$(val control-plane)
          private_material_scan=$(val private)
          artifact_freeze=$(val freeze)
          source_v13_artifact_id=${V13_ARTIFACT_ID}
          source_v13_artifact_sha256=${V13_ARTIFACT_SHA256}
          fix8_sha256=${FIX8_SHA256}
          signing_public_key_fingerprint=${SIGNING_PUBLIC_KEY_FINGERPRINT}
          control_plane_url=${CONTROL_PLANE_URL}
          migration_ceiling=${MIGRATION_CEILING}
          cloudflare_touched=false
          existing_d1_touched=false
          customer_ready=false
          deployed=false
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/source-package-v23-latest.txt
          git commit -m 'ci(v16): record source package closure v23' || exit 0
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate
