name: V16 Generate Live License Acceptance V30
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-live-license-smoke-v30-generator.yml']
permissions: { contents: write }
concurrency: { group: v16-generate-live-v30, cancel-in-progress: true }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v16-production-gate
          fetch-depth: 1
      - name: Derive V30 from proven V27 live gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/v16-production-live-license-smoke-v27.yml')
          out=Path('.github/workflows/v16-production-live-license-smoke-v30.yml')
          s=src.read_text()
          s=s.replace('V27','V30').replace('v27','v30')
          s=s.replace("SOURCE_ARTIFACT_ID: '9391746526'", "SOURCE_ARTIFACT_ID: '9392071166'")
          s=s.replace("SOURCE_ARTIFACT_SHA256: 'b42d10b2adf546eb2b9f44648ce6216c24551f9067d18b4e9586c0b150bb7d92'", "SOURCE_ARTIFACT_SHA256: 'cb498eed4580589794480e4aa0a9d42fc2814fde0e64ad6620c16e6d220d2cf8'")
          s=s.replace("  CP_ZIP_SHA256: 'e6083af6ae82f53549ace3d26c1f1728023db920ab57358a5bd6e3332b64e916'\n", '')
          s=s.replace("  PRO_ZIP_SHA256: 'e6d1c98f494af981a001c91fc7dc38316cd1e78c3beb72b9f53916b43c068d2e'\n", '')
          s=s.replace("          echo \"$CP_ZIP_SHA256  /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip\" | sha256sum -c -\n", "          CP_ZIP_SHA256=\"$(sha256sum /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip | awk '{print $1}')\"; echo \"CP_ZIP_SHA256=$CP_ZIP_SHA256\" >> \"$GITHUB_ENV\"\n")
          s=s.replace("          echo \"$PRO_ZIP_SHA256  /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V23.zip\" | sha256sum -c -\n", "          PRO_ZIP_SHA256=\"$(sha256sum /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V29.zip | awk '{print $1}')\"; echo \"PRO_ZIP_SHA256=$PRO_ZIP_SHA256\" >> \"$GITHUB_ENV\"\n")
          s=s.replace('SOURCE-GATE-V23.zip','SOURCE-GATE-V29.zip')
          needle='          grep -Fq "UPDATE license_state SET status = ?, effective_plan = NULL" /tmp/pro/src/server/services/license.service.ts\n'
          assert needle in s
          s=s.replace(needle, needle + "          grep -Fq \"if (['revoked', 'expired', 'suspended'].includes(storedStatus))\" /tmp/pro/src/server/services/license.service.ts\n")
          assert "SOURCE_ARTIFACT_ID: '9392071166'" in s
          assert "SOURCE_ARTIFACT_SHA256: 'cb498eed4580589794480e4aa0a9d42fc2814fde0e64ad6620c16e6d220d2cf8'" in s
          assert 'SOURCE-GATE-V29.zip' in s and 'SOURCE-GATE-V23.zip' not in s
          assert "if (['revoked', 'expired', 'suspended'].includes(storedStatus))" in s
          assert 'v16-v27-' not in s and 'V27' not in s
          out.write_text(s)
          PY
          git diff --check -- .github/workflows/v16-production-live-license-smoke-v30.yml
      - name: Commit V30 workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v16-production-live-license-smoke-v30.yml
          git commit -m 'ci(v16): add V30 live acceptance for V29 candidate'
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate
