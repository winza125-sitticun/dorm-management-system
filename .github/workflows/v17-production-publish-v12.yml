name: V17 Auto Update Production Publish V12
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v17-production-publish-v12.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v17-production-publish-v12, cancel-in-progress: false }
env:
  V17_ARTIFACT_ID: '9394092671'
  V17_ARTIFACT_SHA256: '0503ec400e7e52e7e9a23723155aa2eebbc3e64f8ead898cc49b9a9968f63ad3'
  V17_VERSION: '1.2.0'
  V16_MIN_VERSION: '1.1.0'
  V17_MIGRATION_CEILING: '0008_add_update_state.sql'
  PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  PUBLIC_KEY_SHA256: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  CANONICAL_CP_URL: 'https://dorm-control-plane.winza125.workers.dev'
  STABLE_CP_D1: 'dorm-license-control-plane-v16-db'
  STABLE_CP_D1_UUID: '68695864-48de-4d8a-932b-9d11cd4d6b4d'
  UPDATE_PAGES: 'dorm-management-updates'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.V16_LICENSE_SIGNING_PRIVATE_KEY }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Verify exact frozen V17 candidate
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'job_status=success' v17-production-evidence/source-gate-v11-latest.txt
          grep -Fxq 'artifact_freeze=success' v17-production-evidence/source-gate-v11-latest.txt
          grep -Fxq 'v16_rebuilt=false' v17-production-evidence/source-gate-v11-latest.txt
          grep -Fxq 'v16_modified=false' v17-production-evidence/source-gate-v11-latest.txt
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${LICENSE_SIGNING_PRIVATE_KEY:-}"
          rm -rf /tmp/v17-artifact /tmp/v17-cp /tmp/v17-dist
          mkdir -p /tmp/v17-artifact /tmp/v17-cp /tmp/v17-dist
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V17_ARTIFACT_ID}/zip" \
            -o /tmp/v17-artifact.zip
          echo "$V17_ARTIFACT_SHA256  /tmp/v17-artifact.zip" | sha256sum -c -
          unzip -q /tmp/v17-artifact.zip -d /tmp/v17-artifact
          ROOT=/tmp/v17-artifact
          [ -f "$ROOT/SHA256SUMS.txt" ] || ROOT="$(dirname "$(find /tmp/v17-artifact -name SHA256SUMS.txt -print -quit)")"
          test -f "$ROOT/SHA256SUMS.txt"
          (cd "$ROOT" && sha256sum -c SHA256SUMS.txt)
          test -f "$ROOT/dorm-control-plane-v17-SOURCE-GATE-V11.zip"
          for p in demo basic standard pro; do test -f "$ROOT/customer-packages/dorm-management-system-${p}-v17-CUSTOMER-READY-CANDIDATE.zip"; done
          printf '%s' "$ROOT" >/tmp/v17-root
          node - <<'NODE'
          const crypto=require('node:crypto');
          let s=(process.env.LICENSE_SIGNING_PRIVATE_KEY||'').trim();
          if((s.startsWith('"')&&s.endsWith('"'))||(s.startsWith("'")&&s.endsWith("'")))s=s.slice(1,-1).trim();
          if(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=/.test(s))s=s.replace(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=\s*/,'').trim();
          const pk=s.includes('BEGIN PRIVATE KEY')?crypto.createPrivateKey(s):crypto.createPrivateKey({key:Buffer.from(s.replace(/\s+/g,''),'base64'),format:'der',type:'pkcs8'});
          const j=crypto.createPublicKey(pk).export({format:'jwk'});
          const raw=Buffer.from(j.x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-j.x.length%4)%4),'base64');
          if(raw.toString('base64')!==process.env.PUBLIC_KEY_B64) throw new Error('signing public key mismatch');
          if(crypto.createHash('sha256').update(raw).digest('hex')!==process.env.PUBLIC_KEY_SHA256) throw new Error('signing fingerprint mismatch');
          NODE
          touch /tmp/v17-v12-exact.ok

      - name: Publish exact plan packages to durable HTTPS Pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/v17-root)"
          mkdir -p /tmp/v17-dist/v17/1.2.0
          for p in demo basic standard pro; do
            src="$ROOT/customer-packages/dorm-management-system-${p}-v17-CUSTOMER-READY-CANDIDATE.zip"
            dst="/tmp/v17-dist/v17/1.2.0/dorm-management-system-${p}-v17.zip"
            cp "$src" "$dst"
            sha256sum "$dst" | awk '{print $1}' > "/tmp/${p}.sha"
            stat -c '%s' "$dst" > "/tmp/${p}.size"
          done
          (cd /tmp/v17-dist/v17/1.2.0 && sha256sum *.zip > SHA256SUMS.txt)
          printf 'V17 Auto Update release 1.2.0\n' >/tmp/v17-dist/v17/1.2.0/README.txt
          npm install --no-save wrangler@4.124.0
          npx wrangler pages project list --json >/tmp/pages-list.json
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/pages-list.json')); rows=x if isinstance(x,list) else x.get('result',x.get('projects',[]))
          found=[r for r in rows if r.get('name')==os.environ['UPDATE_PAGES']]
          open('/tmp/update-pages-existed','w').write('true' if found else 'false')
          PY
          if [ "$(cat /tmp/update-pages-existed)" != true ]; then
            timeout 120s npx wrangler pages project create "$UPDATE_PAGES" --production-branch main
          fi
          timeout 300s npx wrangler pages deploy /tmp/v17-dist --project-name "$UPDATE_PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false | tee /tmp/update-pages-deploy.log
          BASE="https://${UPDATE_PAGES}.pages.dev"
          ok=0
          for i in $(seq 1 45); do
            code="$(curl -sS -o /tmp/remote-basic.zip -w '%{http_code}' --max-time 20 "$BASE/v17/1.2.0/dorm-management-system-basic-v17.zip" || true)"
            if [ "$code" = 200 ] && [ "$(sha256sum /tmp/remote-basic.zip | awk '{print $1}')" = "$(cat /tmp/basic.sha)" ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          for p in demo standard pro; do
            curl --fail --silent --show-error --max-time 60 "$BASE/v17/1.2.0/dorm-management-system-${p}-v17.zip" -o "/tmp/remote-${p}.zip"
            test "$(sha256sum "/tmp/remote-${p}.zip" | awk '{print $1}')" = "$(cat "/tmp/${p}.sha")"
          done
          echo "UPDATE_BASE_URL=$BASE" >> "$GITHUB_ENV"
          touch /tmp/v17-v12-distribution.ok

      - name: Prepare exact Control Plane and stable D1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/v17-root)"
          unzip -q "$ROOT/dorm-control-plane-v17-SOURCE-GATE-V11.zip" -d /tmp/v17-cp
          cd /tmp/v17-cp
          npm ci
          npm test
          npm run typecheck
          npx wrangler d1 list --json >/tmp/d1-list.json
          GATE_WORKER="dorm-control-plane-v17-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 - "$GATE_WORKER" <<'PY'
          import json,os,sys
          x=json.load(open('/tmp/d1-list.json')); rows=x if isinstance(x,list) else x.get('result',x.get('databases',[]))
          m=[r for r in rows if r.get('name')==os.environ['STABLE_CP_D1']]; assert len(m)==1,m
          uid=m[0].get('uuid') or m[0].get('id'); assert uid==os.environ['STABLE_CP_D1_UUID'],uid
          common={'main':'src/index.ts','compatibility_date':'2026-08-05','d1_databases':[{'binding':'DB','database_name':os.environ['STABLE_CP_D1'],'database_id':uid,'migrations_dir':'migrations'}]}
          json.dump(dict(common,name=sys.argv[1]),open('wrangler.gate.jsonc','w'))
          json.dump(dict(common,name='dorm-control-plane'),open('wrangler.production.jsonc','w'))
          PY
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" >/tmp/cp-tables-pre.txt
          ! grep -Eiq '(^|[^a-z])(rooms|tenants|settings|bills|payments|users)([^a-z]|$)' /tmp/cp-tables-pre.txt
          timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='update_releases';" >/tmp/cp-update-schema.txt
          grep -q update_releases /tmp/cp-update-schema.txt
          echo "GATE_WORKER=$GATE_WORKER" >> "$GITHUB_ENV"
          touch /tmp/v17-v12-cp-schema.ok

      - name: Seed exact stable release metadata
        working-directory: /tmp/v17-cp
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SQL="BEGIN;"
          for p in demo basic standard pro; do
            SHA="$(cat "/tmp/${p}.sha")"; SIZE="$(cat "/tmp/${p}.size")"; URL="${UPDATE_BASE_URL}/v17/1.2.0/dorm-management-system-${p}-v17.zip"; ID="v17-stable-${p}-1.2.0"
            SQL+="UPDATE update_releases SET active=0 WHERE channel='stable' AND plan='${p}' AND id<>'${ID}';"
            SQL+="INSERT INTO update_releases(id,channel,plan,version,package_url,package_sha256,package_size,migration_ceiling,minimum_supported_version,release_notes,published_at,active) VALUES('${ID}','stable','${p}','${V17_VERSION}','${URL}','${SHA}',${SIZE},'${V17_MIGRATION_CEILING}','${V16_MIN_VERSION}','V17 Auto Update — signed plan-aware staged update with backup and rollback','${NOW}',1) ON CONFLICT(id) DO UPDATE SET package_url=excluded.package_url,package_sha256=excluded.package_sha256,package_size=excluded.package_size,migration_ceiling=excluded.migration_ceiling,minimum_supported_version=excluded.minimum_supported_version,release_notes=excluded.release_notes,published_at=excluded.published_at,active=1;"
          done
          SQL+="COMMIT;"
          timeout 120s npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "$SQL"
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "SELECT plan,version,package_sha256,package_size,migration_ceiling,minimum_supported_version,active FROM update_releases WHERE channel='stable' AND version='1.2.0' ORDER BY plan;" >/tmp/release-rows.txt
          for p in demo basic standard pro; do grep -q "$(cat "/tmp/${p}.sha")" /tmp/release-rows.txt; done
          touch /tmp/v17-v12-seed.ok

      - name: Deploy isolated exact V17 Control Plane gate
        working-directory: /tmp/v17-cp
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s npx wrangler deploy --config wrangler.gate.jsonc | tee /tmp/gate-deploy.log
          printf '%s\n' "$LICENSE_SIGNING_PRIVATE_KEY" | timeout 90s npx wrangler secret put LICENSE_SIGNING_PRIVATE_KEY --config wrangler.gate.jsonc
          GATE_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/gate-deploy.log | tail -n1)"
          test -n "$GATE_URL"
          echo "GATE_URL=$GATE_URL" >> "$GITHUB_ENV"
          ok=0; for i in $(seq 1 45); do c="$(curl -s -o /tmp/gate-root -w '%{http_code}' --max-time 10 "$GATE_URL/" || true)"; [ "$c" = 405 ] && { ok=1; break; }; sleep 2; done; test "$ok" = 1
          touch /tmp/v17-v12-gate-deploy.ok

      - name: Live signed manifest plan isolation and tamper proof
        working-directory: /tmp/v17-cp
        shell: bash
        run: |
          set -euo pipefail
          MARK="v12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "TEST_MARK=$MARK" >> "$GITHUB_ENV"
          curl --fail --silent --show-error -H 'content-type: application/json' \
            --data '{"demo":true,"currentVersion":"1.1.0","channel":"stable"}' \
            "$GATE_URL/v1/updates/check" >/tmp/demo-update.json
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/demo-update.json')); m=x['manifest']
          assert x['updateAvailable'] is True and x['licensePlan']=='demo'
          assert m['plan']=='demo' and m['version']=='1.2.0' and m['migrationCeiling']=='0008_add_update_state.sql'
          assert m['packageSha256']==open('/tmp/demo.sha').read().strip()
          assert m['packageSize']==int(open('/tmp/demo.size').read())
          assert m['downloadUrl'].startswith(os.environ['UPDATE_BASE_URL']+'/')
          PY
          for p in basic standard pro; do
            KEY="V17-$(node -e "process.stdout.write(require('node:crypto').randomBytes(18).toString('hex').toUpperCase())")"
            HASH="$(printf '%s' "$KEY" | sha256sum | awk '{print $1}')"
            LIC="lic-${MARK}-${p}"; INST="install-${MARK}-${p}"; NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            timeout 90s npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "INSERT INTO licenses(id,key_hash,customer_label,plan,status,max_activations,expires_at,created_at,updated_at) VALUES('${LIC}','${HASH}','V17 V12 ${p}','${p}','active',1,NULL,'${NOW}','${NOW}');"
            python3 - "$KEY" "$INST" <<'PY'
          import json,sys
          json.dump({'licenseKey':sys.argv[1],'installationId':sys.argv[2],'projectName':'v17-v12','hostname':'v12.invalid'},open('/tmp/activate-body.json','w'))
          PY
            curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/activate-body.json "$GATE_URL/v1/licenses/activate" >"/tmp/${p}-activate.json"
            python3 - "$INST" "$p" <<'PY'
          import json,sys
          x=json.load(open('/tmp/'+sys.argv[2]+'-activate.json'))
          json.dump({'token':x['token'],'installationId':sys.argv[1],'currentVersion':'1.1.0','channel':'stable'},open('/tmp/update-body.json','w'))
          PY
            curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/update-body.json "$GATE_URL/v1/updates/check" >"/tmp/${p}-update.json"
            PLAN="$p" node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          (async()=>{const p=process.env.PLAN,x=JSON.parse(fs.readFileSync(`/tmp/${p}-update.json`,'utf8')),m=x.manifest;
            if(x.licensePlan!==p||m.plan!==p||m.version!==process.env.V17_VERSION||!x.updateAvailable)throw new Error('plan/version mismatch');
            if(m.packageSha256!==fs.readFileSync(`/tmp/${p}.sha`,'utf8').trim())throw new Error('sha mismatch');
            if(m.packageSize!==Number(fs.readFileSync(`/tmp/${p}.size`,'utf8').trim()))throw new Error('size mismatch');
            const fields=['schemaVersion','product','version','channel','plan','packageSha256','packageSize','migrationCeiling','minimumSupportedVersion','releaseNotes','downloadUrl','publishedAt'];
            const canonical=JSON.stringify(Object.fromEntries(fields.map(k=>[k,m[k]])));
            const key=await crypto.webcrypto.subtle.importKey('raw',Buffer.from(process.env.PUBLIC_KEY_B64,'base64'),{name:'Ed25519'},false,['verify']);
            const sig=Buffer.from(x.signature,'base64url'); const msg=new TextEncoder().encode('dorm-update-manifest-v1\n'+canonical);
            if(!await crypto.webcrypto.subtle.verify('Ed25519',key,sig,msg))throw new Error('signature invalid');
            const bad={...m,plan:p==='pro'?'basic':'pro'}; const badCanonical=JSON.stringify(Object.fromEntries(fields.map(k=>[k,bad[k]])));
            if(await crypto.webcrypto.subtle.verify('Ed25519',key,sig,new TextEncoder().encode('dorm-update-manifest-v1\n'+badCanonical)))throw new Error('tampered manifest verified');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          done
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "UPDATE licenses SET status='suspended',updated_at='${NOW}' WHERE id='lic-${MARK}-basic';"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/basic-activate.json')); json.dump({'token':x['token'],'installationId':'install-'+__import__('os').environ['TEST_MARK']+'-basic','currentVersion':'1.1.0','channel':'stable'},open('/tmp/suspended-update.json','w'))
          PY
          code="$(curl --silent --output /tmp/suspended-update-out.json --write-out '%{http_code}' -H 'content-type: application/json' --data @/tmp/suspended-update.json "$GATE_URL/v1/updates/check")"
          test "$code" = 403
          touch /tmp/v17-v12-live.ok

      - name: Deploy exact V17 Control Plane to canonical worker
        working-directory: /tmp/v17-cp
        shell: bash
        run: |
          set -euo pipefail
          for x in exact distribution cp-schema seed gate-deploy live; do test -f "/tmp/v17-v12-${x}.ok"; done
          timeout 240s npx wrangler deploy --config wrangler.production.jsonc | tee /tmp/canonical-deploy.log
          printf '%s\n' "$LICENSE_SIGNING_PRIVATE_KEY" | timeout 90s npx wrangler secret put LICENSE_SIGNING_PRIVATE_KEY --config wrangler.production.jsonc
          grep -Fq "$CANONICAL_CP_URL" /tmp/canonical-deploy.log
          ok=0; for i in $(seq 1 45); do c="$(curl -s -o /tmp/canonical-root -w '%{http_code}' --max-time 10 "$CANONICAL_CP_URL/" || true)"; [ "$c" = 405 ] && { ok=1; break; }; sleep 2; done; test "$ok" = 1
          curl --fail --silent --show-error -H 'content-type: application/json' --data '{"demo":true,"currentVersion":"1.1.0","channel":"stable"}' "$CANONICAL_CP_URL/v1/updates/check" >/tmp/canonical-demo.json
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          (async()=>{const x=JSON.parse(fs.readFileSync('/tmp/canonical-demo.json','utf8')),m=x.manifest;if(m.plan!=='demo'||m.version!=='1.2.0'||m.packageSha256!==fs.readFileSync('/tmp/demo.sha','utf8').trim())throw new Error('canonical manifest mismatch');const f=['schemaVersion','product','version','channel','plan','packageSha256','packageSize','migrationCeiling','minimumSupportedVersion','releaseNotes','downloadUrl','publishedAt'];const c=JSON.stringify(Object.fromEntries(f.map(k=>[k,m[k]])));const k=await crypto.webcrypto.subtle.importKey('raw',Buffer.from(process.env.PUBLIC_KEY_B64,'base64'),{name:'Ed25519'},false,['verify']);if(!await crypto.webcrypto.subtle.verify('Ed25519',k,Buffer.from(x.signature,'base64url'),new TextEncoder().encode('dorm-update-manifest-v1\n'+c)))throw new Error('canonical signature invalid')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          touch /tmp/v17-v12-canonical.ok

      - name: Guarded cleanup of smoke rows and gate worker only
        if: always()
        working-directory: /tmp/v17-cp
        shell: bash
        run: |
          set +e
          rm -f /tmp/v17-v12-cleanup.ok
          MARK="${TEST_MARK:-v12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          if [[ "$MARK" == "v12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]] && [ -f wrangler.production.jsonc ]; then
            timeout 90s npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "DELETE FROM license_events WHERE license_id LIKE 'lic-${MARK}-%' OR installation_id LIKE 'install-${MARK}-%'; DELETE FROM activations WHERE license_id LIKE 'lic-${MARK}-%'; DELETE FROM licenses WHERE id LIKE 'lic-${MARK}-%';"
          fi
          if [ -n "${GATE_WORKER:-}" ] && [[ "$GATE_WORKER" == "dorm-control-plane-v17-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]] && [ -f wrangler.gate.jsonc ]; then
            timeout 120s npx wrangler delete --config wrangler.gate.jsonc --force
          fi
          touch /tmp/v17-v12-cleanup.ok
          exit 0

      - name: Persist V12 production publish evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v17-production-evidence
          val(){ [ -f "/tmp/v17-v12-$1.ok" ] && printf success || printf failure; }
          cat > v17-production-evidence/production-publish-v12-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          v17_artifact_id=${V17_ARTIFACT_ID}
          v17_artifact_sha256=${V17_ARTIFACT_SHA256}
          exact_artifact=$(val exact)
          durable_distribution=$(val distribution)
          update_distribution_url=${UPDATE_BASE_URL:-unavailable}
          update_pages_project=${UPDATE_PAGES}
          update_pages_preexisted=$(cat /tmp/update-pages-existed 2>/dev/null || printf unknown)
          demo_zip_sha256=$(cat /tmp/demo.sha 2>/dev/null || printf unavailable)
          demo_zip_size=$(cat /tmp/demo.size 2>/dev/null || printf unavailable)
          basic_zip_sha256=$(cat /tmp/basic.sha 2>/dev/null || printf unavailable)
          basic_zip_size=$(cat /tmp/basic.size 2>/dev/null || printf unavailable)
          standard_zip_sha256=$(cat /tmp/standard.sha 2>/dev/null || printf unavailable)
          standard_zip_size=$(cat /tmp/standard.size 2>/dev/null || printf unavailable)
          pro_zip_sha256=$(cat /tmp/pro.sha 2>/dev/null || printf unavailable)
          pro_zip_size=$(cat /tmp/pro.size 2>/dev/null || printf unavailable)
          control_plane_schema_migration=$(val cp-schema)
          stable_manifest_seed=$(val seed)
          isolated_control_plane_deploy=$(val gate-deploy)
          plan_isolation_signature_tamper_terminal=$(val live)
          canonical_control_plane_deploy=$(val canonical)
          smoke_cleanup=$(val cleanup)
          canonical_control_plane_url=${CANONICAL_CP_URL}
          stable_d1_uuid=${STABLE_CP_D1_UUID}
          migration_ceiling=${V17_MIGRATION_CEILING}
          minimum_supported_version=${V16_MIN_VERSION}
          v16_rebuilt=false
          v16_modified=false
          existing_customer_d1_touched=false
          stable_resources_preserved=true
          v17_customer_ready=false
          deployed=$(val canonical)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v17-production-evidence/production-publish-v12-latest.txt
          git commit -m 'ci(v17): record production publish v12 evidence' || exit 0
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate