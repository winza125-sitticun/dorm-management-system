name: V16 Production Live License Acceptance V27
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-live-license-smoke-v27.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-live-license-smoke-v27, cancel-in-progress: true }
env:
  SOURCE_ARTIFACT_ID: '9391746526'
  SOURCE_ARTIFACT_SHA256: 'b42d10b2adf546eb2b9f44648ce6216c24551f9067d18b4e9586c0b150bb7d92'
  CP_ZIP_SHA256: 'e6083af6ae82f53549ace3d26c1f1728023db920ab57358a5bd6e3332b64e916'
  PRO_ZIP_SHA256: 'e6d1c98f494af981a001c91fc7dc38316cd1e78c3beb72b9f53916b43c068d2e'
  EXPECTED_PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  EXPECTED_PUBLIC_KEY_SHA256: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.V16_LICENSE_SIGNING_PRIVATE_KEY }}
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Verify prerequisites and exact V23 artifact
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"; test -n "${CLOUDFLARE_ACCOUNT_ID:-}"; test -n "${LICENSE_SIGNING_PRIVATE_KEY:-}"
          node - <<'NODE'
          const crypto=require('node:crypto'); let input=(process.env.LICENSE_SIGNING_PRIVATE_KEY||'').trim();
          if((input.startsWith('"')&&input.endsWith('"'))||(input.startsWith("'")&&input.endsWith("'"))) input=input.slice(1,-1).trim();
          if(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=/.test(input)) input=input.replace(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=\s*/,'').trim();
          const pk=input.includes('BEGIN PRIVATE KEY')?crypto.createPrivateKey(input):crypto.createPrivateKey({key:Buffer.from(input.replace(/\s+/g,''),'base64'),format:'der',type:'pkcs8'});
          const jwk=crypto.createPublicKey(pk).export({format:'jwk'}); const raw=Buffer.from(jwk.x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-jwk.x.length%4)%4),'base64');
          if(crypto.createHash('sha256').update(raw).digest('hex')!==process.env.EXPECTED_PUBLIC_KEY_SHA256) throw new Error('signing fingerprint mismatch');
          if(raw.toString('base64')!==process.env.EXPECTED_PUBLIC_KEY_B64) throw new Error('signing public key mismatch');
          NODE
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o /tmp/source.zip
          echo "$SOURCE_ARTIFACT_SHA256  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/source /tmp/cp /tmp/pro; mkdir -p /tmp/source /tmp/cp /tmp/pro
          unzip -q /tmp/source.zip -d /tmp/source
          (cd /tmp/source && sha256sum -c SHA256SUMS.txt)
          echo "$CP_ZIP_SHA256  /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" | sha256sum -c -
          echo "$PRO_ZIP_SHA256  /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V23.zip" | sha256sum -c -
          unzip -q /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip -d /tmp/cp
          unzip -q /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V23.zip -d /tmp/pro
          test "$(find /tmp/pro/d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = '0007_add_license_state.sql'
          grep -Fq "$EXPECTED_PUBLIC_KEY_B64" /tmp/pro/src/generated/licenseConfig.ts
          grep -Fq "UPDATE license_state SET status = ?, effective_plan = NULL" /tmp/pro/src/server/services/license.service.ts
          touch /tmp/v16-v27-artifact.ok

      - name: Install exact candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && npm install --no-audit --no-fund)
          (cd /tmp/pro && npm ci)

      - name: Allocate isolated resource names
        shell: bash
        run: |
          set -euo pipefail
          M="$(printf '%s' "$GITHUB_RUN_ID"|tr -cd '0-9'|tail -c 9)-${GITHUB_RUN_ATTEMPT}-$(python3 -c 'import secrets;print(secrets.token_hex(3))')"
          echo "RUN_MARKER=$M" >> "$GITHUB_ENV"; echo "CP_WORKER=v16-v27-cp-${M}" >> "$GITHUB_ENV"; echo "CP_D1=v16-v27-cp-${M}-db" >> "$GITHUB_ENV"; echo "PRO_PAGES=v16-v27-pro-${M}" >> "$GITHUB_ENV"; echo "PRO_D1=v16-v27-pro-${M}-db" >> "$GITHUB_ENV"

      - name: Create only fresh D1 and record exact ownership
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && timeout 120s npx wrangler d1 create "$CP_D1" --location apac && timeout 60s npx wrangler d1 info "$CP_D1" --json > /tmp/cp-d1.json)
          (cd /tmp/pro && timeout 120s npx wrangler d1 create "$PRO_D1" --location apac && timeout 60s npx wrangler d1 info "$PRO_D1" --json > /tmp/pro-d1.json)
          python3 - <<'PY'
          import json,os,re
          def uuid(path):
            x=json.load(open(path)); s=json.dumps(x); m=re.search(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}',s); assert m,x; return m.group(0)
          base={'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']}
          cp=uuid('/tmp/cp-d1.json'); pro=uuid('/tmp/pro-d1.json')
          json.dump({**base,'name':os.environ['CP_D1'],'uuid':cp},open('/tmp/owned-cp-d1.json','w'))
          json.dump({**base,'name':os.environ['PRO_D1'],'uuid':pro},open('/tmp/owned-pro-d1.json','w'))
          json.dump({'name':os.environ['CP_WORKER'],'main':'src/index.ts','compatibility_date':'2026-08-05','d1_databases':[{'binding':'DB','database_name':os.environ['CP_D1'],'database_id':cp,'migrations_dir':'migrations'}]},open('/tmp/cp/wrangler.jsonc','w'))
          json.dump({'name':os.environ['PRO_PAGES'],'compatibility_date':'2026-08-05','compatibility_flags':['nodejs_compat'],'pages_build_output_dir':'./dist','upload_source_maps':True,'d1_databases':[{'binding':'DB','database_name':os.environ['PRO_D1'],'database_id':pro,'migrations_dir':'./d1-migrations'}]},open('/tmp/pro/wrangler.jsonc','w'))
          PY
          touch /tmp/v16-v27-resources.ok

      - name: Deploy isolated Control Plane only after ownership proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/owned-cp-d1.json')); assert x['run_id']==os.environ['GITHUB_RUN_ID'] and x['attempt']==os.environ['GITHUB_RUN_ATTEMPT'] and x['name']==os.environ['CP_D1']
          PY
          (cd /tmp/cp && timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd /tmp/cp && timeout 240s npx wrangler deploy --config wrangler.jsonc) | tee /tmp/cp-deploy.log
          printf '%s\n' "$LICENSE_SIGNING_PRIVATE_KEY" | (cd /tmp/cp && timeout 90s npx wrangler secret put LICENSE_SIGNING_PRIVATE_KEY --config wrangler.jsonc)
          CP_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/cp-deploy.log|tail -n1)"; test -n "$CP_URL"; echo "CP_URL=$CP_URL" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os
          json.dump({'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'name':os.environ['CP_WORKER']},open('/tmp/owned-worker.json','w'))
          PY
          touch /tmp/v16-v27-cp.ok

      - name: Seed one-seat Basic license in fresh CP D1
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'); const key='V16-'+crypto.randomBytes(18).toString('hex').toUpperCase(); fs.writeFileSync('/tmp/license-key',key); fs.writeFileSync('/tmp/license-hash',crypto.createHash('sha256').update(key).digest('hex'));
          NODE
          H="$(cat /tmp/license-hash)"; NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd /tmp/cp && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "INSERT INTO licenses(id,key_hash,customer_label,plan,status,max_activations,expires_at,created_at,updated_at) VALUES('v27-live','${H}','V27 isolated','basic','active',1,NULL,'${NOW}','${NOW}');")
          touch /tmp/v16-v27-seed.ok

      - name: Deploy fresh Pro Pages only after ownership proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/owned-pro-d1.json')); assert x['run_id']==os.environ['GITHUB_RUN_ID'] and x['attempt']==os.environ['GITHUB_RUN_ATTEMPT'] and x['name']==os.environ['PRO_D1']
          PY
          (cd /tmp/pro && timeout 120s npx wrangler pages project create "$PRO_PAGES" --production-branch main)
          python3 - <<'PY'
          import json,os
          json.dump({'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'name':os.environ['PRO_PAGES']},open('/tmp/owned-pages.json','w'))
          PY
          JWT="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"; printf '%s\n' "$JWT" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put JWT_SECRET --project-name "$PRO_PAGES"); unset JWT
          printf '%s\n' "$CP_URL" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put LICENSE_CONTROL_PLANE_URL --project-name "$PRO_PAGES")
          printf '%s\n' "$EXPECTED_PUBLIC_KEY_B64" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put LICENSE_SIGNING_PUBLIC_KEY --project-name "$PRO_PAGES")
          (cd /tmp/pro && timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd /tmp/pro && npm run build:pages)
          (cd /tmp/pro && timeout 240s npx wrangler pages deploy dist --project-name "$PRO_PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false) | tee /tmp/pro-deploy.log
          PRO_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/pro-deploy.log|tail -n1)"; test -n "$PRO_URL"; echo "PRO_URL=$PRO_URL" >> "$GITHUB_ENV"
          ready=0; for i in $(seq 1 90); do if curl --fail --silent --show-error --max-time 10 "$PRO_URL/" -o /dev/null; then ready=1; break; fi; sleep 2; done; test "$ready" = 1
          touch /tmp/v16-v27-pages.ok

      - name: Bootstrap and prove preactivation fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,secrets
          e=f"v27-{os.environ['RUN_MARKER']}@example.invalid"; p='V16!Aa'+secrets.token_hex(10); json.dump({'email':e,'password':p,'displayName':'V27','dormName':'V27'},open('/tmp/setup.json','w')); json.dump({'username':e,'password':p},open('/tmp/login.json','w'))
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors -H 'content-type: application/json' --data @/tmp/setup.json "$PRO_URL/api/setup/init" >/tmp/setup-response.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors -H 'content-type: application/json' --data @/tmp/login.json "$PRO_URL/api/auth/login" >/tmp/login-response.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/login-response.json')); d=x.get('data',x); assert d.get('token') and d.get('user'); open('/tmp/auth-token','w').write(d['token']); open('/tmp/owner-id','w').write(str(d['user']['id']))
          PY
          T="$(cat /tmp/auth-token)"; code="$(curl --silent --output /tmp/pre.json --write-out '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data '{}' "$PRO_URL/api/rooms")"
          python3 - "$code" <<'PY'
          import json,sys
          x=json.load(open('/tmp/pre.json')); assert int(sys.argv[1])==403 and x.get('error',{}).get('code')=='LICENSE_READ_ONLY',(sys.argv[1],x)
          PY
          touch /tmp/v16-v27-pre.ok

      - name: Activate Basic one-seat and local-tamper proof
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat /tmp/auth-token)"; python3 - <<'PY'
          import json
          json.dump({'licenseKey':open('/tmp/license-key').read()},open('/tmp/activate.json','w')); json.dump({'licenseKey':open('/tmp/license-key').read(),'installationId':'v27-secondary','projectName':'secondary','hostname':'secondary.invalid','appVersion':'v16'},open('/tmp/seat2.json','w'))
          PY
          curl --fail --silent --show-error -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate.json "$PRO_URL/api/license/activate" >/tmp/activated.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" >/tmp/basic.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/basic.json')).get('data',{}); assert d.get('effectivePlan')=='basic' and d.get('status') in ('active','offline') and 'token' not in d,d
          PY
          code="$(curl --silent --output /tmp/seat2fail.json --write-out '%{http_code}' -H 'content-type: application/json' --data @/tmp/seat2.json "$CP_URL/v1/licenses/activate")"
          python3 - "$code" <<'PY'
          import json,sys
          x=json.load(open('/tmp/seat2fail.json')); assert int(sys.argv[1])==409 and x.get('error',{}).get('code')=='ACTIVATION_LIMIT_REACHED',(sys.argv[1],x)
          PY
          O="$(cat /tmp/owner-id)"; (cd /tmp/pro && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE settings SET subscription_plan='pro' WHERE user_id=${O};")
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" >/tmp/tamper.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/tamper.json')).get('data',{}).get('effectivePlan')=='basic'
          PY
          touch /tmp/v16-v27-basic.ok

      - name: Deactivate frees seat then restore primary
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat /tmp/auth-token)"; curl --fail --silent --show-error -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/deactivate" >/tmp/deact.json
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/seat2.json "$CP_URL/v1/licenses/activate" >/tmp/seat2active.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/seat2active.json')); token=x.get('token') or x.get('data',{}).get('token'); assert token; json.dump({'token':token,'installationId':'v27-secondary'},open('/tmp/seat2deact.json','w'))
          PY
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/seat2deact.json "$CP_URL/v1/licenses/deactivate" >/tmp/seat2deactivated.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate.json "$PRO_URL/api/license/activate" >/tmp/reactivated.json
          touch /tmp/v16-v27-reuse.ok

      - name: Central upgrade then suspension must fail closed
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; (cd /tmp/cp && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE licenses SET plan='pro',updated_at='${NOW}' WHERE id='v27-live';")
          T="$(cat /tmp/auth-token)"; curl --fail --silent --show-error -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/refresh" >/tmp/refpro.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" >/tmp/prostatus.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/prostatus.json')).get('data',{}).get('effectivePlan')=='pro'
          PY
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; (cd /tmp/cp && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE licenses SET status='suspended',updated_at='${NOW}' WHERE id='v27-live';")
          code="$(curl --silent --output /tmp/susrefresh.json --write-out '%{http_code}' -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/refresh")"; test "$code" = 403
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" >/tmp/susstatus.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/susstatus.json')).get('data',{}); assert d.get('effectivePlan') is None,d
          PY
          code2="$(curl --silent --output /tmp/susroom.json --write-out '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data '{}' "$PRO_URL/api/rooms")"
          python3 - "$code2" <<'PY'
          import json,sys
          x=json.load(open('/tmp/susroom.json')); assert int(sys.argv[1])==403 and x.get('error',{}).get('code')=='LICENSE_READ_ONLY',(sys.argv[1],x)
          PY
          touch /tmp/v16-v27-central.ok

      - name: Cleanup only exact current-run owned resources
        if: always()
        shell: bash
        run: |
          set +e
          rm -f /tmp/v16-v27-cleanup.ok
          verify(){ python3 - "$1" "$2" "$3" <<'PY'
          import json,os,sys,re
          x=json.load(open(sys.argv[1])); assert x['run_id']==os.environ['GITHUB_RUN_ID'] and x['attempt']==os.environ['GITHUB_RUN_ATTEMPT'] and x['name']==sys.argv[2]; assert sys.argv[2].startswith('v16-v27-');
          if sys.argv[3]=='d1': assert re.fullmatch(r'[0-9a-fA-F-]{36}',x['uuid'])
          PY
          }
          ok=1
          if [ -f /tmp/owned-pages.json ] && verify /tmp/owned-pages.json "$PRO_PAGES" pages; then timeout 120s bash -lc 'cd /tmp/pro && npx wrangler pages project delete "$PRO_PAGES" --yes' || ok=0; fi
          if [ -f /tmp/owned-worker.json ] && verify /tmp/owned-worker.json "$CP_WORKER" worker; then timeout 120s bash -lc 'cd /tmp/cp && npx wrangler delete --name "$CP_WORKER" --config wrangler.jsonc' || ok=0; fi
          for kind in pro cp; do
            if [ "$kind" = pro ]; then m=/tmp/owned-pro-d1.json; n="$PRO_D1"; dir=/tmp/pro; else m=/tmp/owned-cp-d1.json; n="$CP_D1"; dir=/tmp/cp; fi
            if [ -f "$m" ] && verify "$m" "$n" d1; then
              timeout 60s bash -lc "cd '$dir' && npx wrangler d1 info '$n' --json > /tmp/${kind}-current.json" || { ok=0; continue; }
              M="$m" C="/tmp/${kind}-current.json" python3 - <<'PY' || { ok=0; continue; }
          import json,os
          old=json.load(open(os.environ['M'])); cur=json.load(open(os.environ['C'])); assert old['uuid'] in json.dumps(cur)
          PY
              timeout 120s bash -lc "cd '$dir' && npx wrangler d1 delete '$n' --skip-confirmation" || ok=0
            fi
          done
          [ "$ok" = 1 ] && touch /tmp/v16-v27-cleanup.ok
          exit 0

      - name: Persist final live evidence after cleanup
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          val(){ [ -f "/tmp/v16-v27-$1.ok" ] && printf success || printf failure; }
          cat > v16-production-evidence/live-license-smoke-v27-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          source_artifact_id=${SOURCE_ARTIFACT_ID}
          source_artifact_sha256=${SOURCE_ARTIFACT_SHA256}
          cp_zip_sha256=${CP_ZIP_SHA256}
          pro_zip_sha256=${PRO_ZIP_SHA256}
          exact_artifact=$(val artifact)
          fresh_resources=$(val resources)
          control_plane=$(val cp)
          license_seed=$(val seed)
          pro_pages=$(val pages)
          preactivation_readonly=$(val pre)
          activation_one_seat_local_tamper=$(val basic)
          deactivate_seat_reuse=$(val reuse)
          central_upgrade_suspension_fail_closed=$(val central)
          cleanup=$(val cleanup)
          existing_d1_touched=false
          customer_ready=false
          deployed=false
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/live-license-smoke-v27-latest.txt
          git commit -m 'ci(v16): record V23 full live acceptance v27' || exit 0
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate
