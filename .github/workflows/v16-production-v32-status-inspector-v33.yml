name: V16 V32 Status Inspector V33
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-v32-status-inspector-v33.yml']
permissions: { contents: write, actions: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Inspect V32 run
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; wf='v16-production-live-license-smoke-v32.yml'
          url=f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?branch=agent%2Fv16-production-gate&per_page=3'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
          runs=data.get('workflow_runs',[]); out={'status':'missing'} if not runs else {k:runs[0].get(k) for k in ('id','run_attempt','status','conclusion','head_sha','created_at','updated_at')}
          os.makedirs('v16-production-evidence',exist_ok=True); json.dump(out,open('v16-production-evidence/v32-status-inspector-v33-latest.json','w'),indent=2,sort_keys=True); print(json.dumps(out,indent=2))
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/v32-status-inspector-v33-latest.json; git commit -m 'ci(v16): record V32 status v33' || exit 0
          git fetch origin agent/v16-production-gate; git rebase origin/agent/v16-production-gate; git push origin HEAD:agent/v16-production-gate
