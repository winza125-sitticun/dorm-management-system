name: V16 Production Dependency Fix Diagnostic
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-dependency-fix-diagnostic.yml']
permissions: { contents: write, actions: read }
env:
  V15_ARTIFACT_ID: '9330679827'
  V15_ARTIFACT_SHA256: '5f6e65ae856c1196fcd3a2e3dd7bcffb4da863ab212d3595839e921f0a96e1cf'
  V15_MASTER_SHA256: 'd05ee110815a29b74498e17adac1b8355dec40d5a705dd016f5ad5f849caa9e9'
  INPUT_ARCHIVE_SHA256: '43b2d44d508a02a431f2a405b5e95f8fbf850cca17b522446d1d6e0630d4d0f7'
  TASK8_TREE_SHA256: '1b7c4e8179be6f397061d7999ade081f1bb0791f5ac10a2b5490dbec1d3d7b6c'
  FIX1_SHA256: '0bd14b991e38e86b0b8a742a17d56a6dde837f32f248663335fc8e59e3e4eb30'
  FIX2_SHA256: 'e86a42d82a8b9c5ce7c78015e91d94b63f7ef35848316a27e645f9a6fca8828d'
  FIX3_SHA256: 'bb2c8fee9301fadb15427020ecbe838cc1111d4deecd16c8b8f9aeb368118753'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Reconstruct candidate
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          cat v16-production-inputs/input-00a.b64 v16-production-inputs/input-00b.b64 v16-production-inputs/input-01.b64 v16-production-inputs/input-02.b64 v16-production-inputs/input-03.b64 v16-production-inputs/input-04.b64 v16-production-inputs/input-05.b64 | base64 -d > /tmp/inputs.tar.xz
          echo "$INPUT_ARCHIVE_SHA256  /tmp/inputs.tar.xz" | sha256sum -c -
          rm -rf /tmp/v16-inputs /tmp/v15 /tmp/v16-work /tmp/before
          tar -xJf /tmp/inputs.tar.xz -C /tmp
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V15_ARTIFACT_ID}/zip" -o /tmp/v15.zip
          echo "$V15_ARTIFACT_SHA256  /tmp/v15.zip" | sha256sum -c -
          mkdir -p /tmp/v15 /tmp/v16-work /tmp/before
          unzip -q /tmp/v15.zip -d /tmp/v15
          echo "$V15_MASTER_SHA256  /tmp/v15/dorm-management-system-master-v15-CUSTOMER-READY.zip" | sha256sum -c -
          unzip -q /tmp/v15/dorm-management-system-master-v15-CUSTOMER-READY.zip -d /tmp/v16-work
          cd /tmp/v16-work
          for p in /tmp/v16-inputs/V16_TASK6_EXACT_V15.patch /tmp/v16-inputs/V16_TASK7.patch /tmp/v16-inputs/V16_TASK8_PRODUCTION.patch; do patch -p1 < "$p"; done
          find . -type f ! -path './node_modules/*' ! -path './dist/*' ! -path './dist-server/*' ! -path './preview-v14/*' ! -path './release-v14/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/task8-tree.sha256
          echo "$TASK8_TREE_SHA256  /tmp/task8-tree.sha256" | sha256sum -c -
          for p in "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX.patch" "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_2.patch" "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_3.patch"; do patch -p1 < "$p"; done
          cp package.json /tmp/before/package.json
          cp package-lock.json /tmp/before/package-lock.json
      - name: Apply non-breaking lockfile audit fix and verify
        working-directory: /tmp/v16-work
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit fix --package-lock-only
          npm ci
          npm audit --omit=dev --audit-level=high
          cmp package.json /tmp/before/package.json
          {
            diff -u --label a/package-lock.json --label b/package-lock.json /tmp/before/package-lock.json package-lock.json || true
          } > "$GITHUB_WORKSPACE/V16_PRODUCTION_FIX_4_DEPENDENCIES.patch"
          test -s "$GITHUB_WORKSPACE/V16_PRODUCTION_FIX_4_DEPENDENCIES.patch"
          ! grep -q '^--- a/package.json' "$GITHUB_WORKSPACE/V16_PRODUCTION_FIX_4_DEPENDENCIES.patch"
          sha256sum "$GITHUB_WORKSPACE/V16_PRODUCTION_FIX_4_DEPENDENCIES.patch" > "$GITHUB_WORKSPACE/V16_PRODUCTION_FIX_4_DEPENDENCIES.sha256"
      - name: Smoke full tests and types after lock repair
        working-directory: /tmp/v16-work
        run: |
          npm test
          npm run lint
          npm run check:cloudflare-types:master
          npm run build:pages
          npm run build:vps
      - name: Persist validated Fix 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-input v16-production-evidence
          cp V16_PRODUCTION_FIX_4_DEPENDENCIES.patch v16-production-input/
          cp V16_PRODUCTION_FIX_4_DEPENDENCIES.sha256 v16-production-evidence/dependency-fix4-sha256.txt
          cat > v16-production-evidence/dependency-fix4-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          status=success
          fix4_sha256=$(cut -d' ' -f1 V16_PRODUCTION_FIX_4_DEPENDENCIES.sha256)
          package_json_changed=false
          production_audit_high=0
          full_tests_types_builds=success
          customer_ready=false
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-input/V16_PRODUCTION_FIX_4_DEPENDENCIES.patch v16-production-evidence/dependency-fix4-sha256.txt v16-production-evidence/dependency-fix4-latest.txt
          git commit -m 'fix(v16): lock non-breaking audited dependency updates'
          git push origin HEAD:agent/v16-production-gate
