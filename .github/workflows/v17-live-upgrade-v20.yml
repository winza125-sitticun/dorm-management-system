name: V17 Exact V16 to V17 Live Upgrade Gate V20
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v17-live-upgrade-v20.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v17-live-upgrade-v20, cancel-in-progress: false }
env:
  V16_FINAL_ARTIFACT_ID: '9393238249'
  V16_FINAL_ARTIFACT_SHA256: 'fe17d6426d66722068fd2d003590ca3d0ef188d19dca33c58ed6200ed2de85f1'
  V16_PRO_SHA256: 'c2f46f8e6ca251b7476a8e1bc510e9fedd1f17e516c9ad5a17338f8504933e04'
  V17_ARTIFACT_ID: '9394092671'
  V17_ARTIFACT_SHA256: '0503ec400e7e52e7e9a23723155aa2eebbc3e64f8ead898cc49b9a9968f63ad3'
  CANONICAL_CP_URL: 'https://dorm-control-plane.winza125.workers.dev'
  STABLE_CP_D1: 'dorm-license-control-plane-v16-db'
  STABLE_CP_D1_UUID: '68695864-48de-4d8a-932b-9d11cd4d6b4d'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify exact immutable V16 final and V17 frozen candidate
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'job_status=success' v17-production-evidence/v16-final-baseline-v18-latest.txt
          grep -Fxq 'job_status=success' v17-production-evidence/production-publish-v19-latest.txt
          rm -rf /tmp/v16a /tmp/v17a /tmp/v16 /tmp/cp;mkdir -p /tmp/v16a /tmp/v17a /tmp/v16 /tmp/cp
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V16_FINAL_ARTIFACT_ID}/zip" -o /tmp/v16a.zip
          echo "$V16_FINAL_ARTIFACT_SHA256  /tmp/v16a.zip"|sha256sum -c -;unzip -q /tmp/v16a.zip -d /tmp/v16a
          R16=/tmp/v16a;[ -f "$R16/CUSTOMER-READY-SHA256SUMS.txt" ]||R16="$(dirname "$(find /tmp/v16a -name CUSTOMER-READY-SHA256SUMS.txt -print -quit)")";(cd "$R16"&&sha256sum -c CUSTOMER-READY-SHA256SUMS.txt)
          P16="$R16/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V29.zip";echo "$V16_PRO_SHA256  $P16"|sha256sum -c -;unzip -q "$P16" -d /tmp/v16
          test "$(node -p "require('/tmp/v16/package.json').version")" = 1.1.0;test "$(find /tmp/v16/d1-migrations -maxdepth 1 -type f -printf '%f\n'|sort|tail -n1)" = 0007_add_license_state.sql
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V17_ARTIFACT_ID}/zip" -o /tmp/v17a.zip
          echo "$V17_ARTIFACT_SHA256  /tmp/v17a.zip"|sha256sum -c -;unzip -q /tmp/v17a.zip -d /tmp/v17a
          R17=/tmp/v17a;[ -f "$R17/SHA256SUMS.txt" ]||R17="$(dirname "$(find /tmp/v17a -name SHA256SUMS.txt -print -quit)")";(cd "$R17"&&sha256sum -c SHA256SUMS.txt)
          cp "$R17/BOOTSTRAP-V16-TO-V17.mjs" /tmp/v16/;cp "$R17/BOOTSTRAP-V16-TO-V17-WINDOWS.cmd" /tmp/v16/
          unzip -q "$R17/dorm-control-plane-v17-SOURCE-GATE-V11.zip" -d /tmp/cp
          touch /tmp/v20-exact.ok
      - name: Create run-scoped Pro license in canonical Control Plane
        working-directory: /tmp/cp
        shell: bash
        run: |
          set -euo pipefail;npm ci
          npx wrangler d1 list --json >/tmp/d1.json
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/d1.json'));r=x if isinstance(x,list) else x.get('result',x.get('databases',[]));m=[q for q in r if q.get('name')==os.environ['STABLE_CP_D1']];assert len(m)==1;u=m[0].get('uuid') or m[0].get('id');assert u==os.environ['STABLE_CP_D1_UUID'];json.dump({'name':'dorm-control-plane','main':'src/index.ts','compatibility_date':'2026-08-05','d1_databases':[{'binding':'DB','database_name':os.environ['STABLE_CP_D1'],'database_id':u,'migrations_dir':'migrations'}]},open('wrangler.v20.jsonc','w'))
          PY
          LIC="lic-v20-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}";KEY="V20-$(node -e "process.stdout.write(require('node:crypto').randomBytes(18).toString('hex').toUpperCase())")";HASH="$(printf '%s' "$KEY"|sha256sum|awk '{print $1}')";NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)";printf '%s' "$LIC">/tmp/lic;printf '%s' "$KEY">/tmp/key
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.v20.jsonc --command "INSERT INTO licenses(id,key_hash,customer_label,plan,status,max_activations,expires_at,created_at,updated_at) VALUES('${LIC}','${HASH}','V20 live upgrade','pro','active',1,NULL,'${NOW}','${NOW}');" >/dev/null
          touch /tmp/v20-license.ok
      - name: Deploy disposable exact V16 Pro Pages and D1
        working-directory: /tmp/v16
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          M="$(printf '%s' "$GITHUB_RUN_ID"|tail -c 9)-${GITHUB_RUN_ATTEMPT}-$(python3 -c 'import secrets;print(secrets.token_hex(3))')";D1="v17-v20-${M}-db";PAGES="v17-v20-${M}";printf 'D1=%q\nPAGES=%q\n' "$D1" "$PAGES">/tmp/v20.env
          timeout 120s npx wrangler d1 create "$D1" --location apac;timeout 60s npx wrangler d1 info "$D1" --json >/tmp/d1info
          python3 - "$D1" "$PAGES" <<'PY'
          import json,re,sys
          s=json.dumps(json.load(open('/tmp/d1info')));m=re.search(r'[0-9a-fA-F-]{36}',s);assert m
          json.dump({'name':sys.argv[2],'compatibility_date':'2026-08-05','compatibility_flags':['nodejs_compat'],'pages_build_output_dir':'./dist','upload_source_maps':True,'d1_databases':[{'binding':'DB','database_name':sys.argv[1],'database_id':m.group(0),'migrations_dir':'./d1-migrations'}]},open('wrangler.jsonc','w'))
          PY
          timeout 120s npx wrangler pages project create "$PAGES" --production-branch main
          JWT="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')";printf '%s\n' "$JWT"|timeout 90s npx wrangler pages secret put JWT_SECRET --project-name "$PAGES";unset JWT
          timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          npm run build:pages;timeout 240s npx wrangler pages deploy dist --project-name "$PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false|tee /tmp/pages
          URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/pages|tail -n1)";test -n "$URL";printf 'URL=%q\n' "$URL">>/tmp/v20.env
          for i in $(seq 1 60);do curl --fail -s --max-time 10 "$URL/" -o /dev/null&&break;sleep 2;done;curl --fail -s "$URL/" -o /dev/null
          touch /tmp/v20-deploy.ok
      - name: Setup owner activate license and capture business-data hash
        shell: bash
        run: |
          set -euo pipefail;set -a;. /tmp/v20.env;set +a
          EMAIL="v20-${GITHUB_RUN_ID}@example.invalid";PASS="V20!ReadyAa$(python3 -c 'import secrets;print(secrets.token_hex(10))')";printf '%s' "$EMAIL">/tmp/email;printf '%s' "$PASS">/tmp/pass
          python3 - <<'PY'
          import json,os
          e=open('/tmp/email').read();p=open('/tmp/pass').read();json.dump({'email':e,'password':p,'displayName':'V20 Owner','dormName':'V20 Upgrade Dorm'},open('/tmp/setup','w'));json.dump({'username':e,'password':p},open('/tmp/login','w'));json.dump({'licenseKey':open('/tmp/key').read()},open('/tmp/activate','w'))
          PY
          curl --fail -s -H 'content-type: application/json' --data @/tmp/setup "$URL/api/setup/init">/tmp/setupout;curl --fail -s -H 'content-type: application/json' --data @/tmp/login "$URL/api/auth/login">/tmp/loginout
          node -e "const fs=require('node:fs'),x=JSON.parse(fs.readFileSync('/tmp/loginout','utf8')),d=x.data||x;if(!d.token)process.exit(1);fs.writeFileSync('/tmp/auth',d.token)"
          T="$(cat /tmp/auth)";ok=0;for i in $(seq 1 20);do c="$(curl -s -o /tmp/actout -w '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate "$URL/api/license/activate")";[ "$c" = 200 ]&&{ ok=1;break;};sleep 2;done;test "$ok" = 1
          curl --fail -s -H "authorization: Bearer $T" "$URL/api/license/status">/tmp/status;node -e "const fs=require('node:fs'),x=JSON.parse(fs.readFileSync('/tmp/status','utf8')),d=x.data||x;if(d.effectivePlan!=='pro')throw Error(JSON.stringify(d))"
          curl --fail -s -H "authorization: Bearer $T" "$URL/api/admin/backup/export">/tmp/before-backup
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),x=JSON.parse(fs.readFileSync('/tmp/before-backup')),p=x.data||x;if(!p.manifest||!p.data)throw Error('backup export');const canon=v=>Array.isArray(v)?v.map(canon):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canon(v[k])])):v;fs.writeFileSync('/tmp/before.sha',crypto.createHash('sha256').update(JSON.stringify(canon(p.data))).digest('hex'));fs.writeFileSync('/tmp/before.json',JSON.stringify(canon(p.data)));
          NODE
          touch /tmp/v20-activated.ok
      - name: Run exact standalone V16 to V17 bootstrap end-to-end
        working-directory: /tmp/v16
        shell: bash
        run: |
          set -euo pipefail;set -a;. /tmp/v20.env;set +a
          export DORM_UPDATE_ADMIN_USERNAME="$(cat /tmp/email)";export DORM_UPDATE_ADMIN_PASSWORD="$(cat /tmp/pass)"
          timeout 1200s node BOOTSTRAP-V16-TO-V17.mjs | tee /tmp/bootstrap.log
          grep -q 'Update สำเร็จ' /tmp/bootstrap.log
          test -f .dorm-update-state.json;node -e "const x=require('./.dorm-update-state.json');if(x.currentVersion!=='1.2.0')throw Error(JSON.stringify(x))"
          test "$(node -p "require('./package.json').version")" = 1.2.0
          test "$(find d1-migrations -maxdepth 1 -type f -printf '%f\n'|sort|tail -n1)" = 0008_add_update_state.sql
          test -f UPDATE-PACKAGE.mjs;test -f BOOTSTRAP-V16-TO-V17.mjs
          find backups -maxdepth 1 -type f -name 'pre-update-*.dormbackup' -print -quit | grep -q .
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT last_success_version FROM update_state WHERE id=1;" >/tmp/update-state;grep -q 1.2.0 /tmp/update-state
          touch /tmp/v20-bootstrap.ok
      - name: Verify post-update runtime data parity and idempotent no-downgrade policy
        shell: bash
        run: |
          set -euo pipefail;set -a;. /tmp/v20.env;set +a
          for i in $(seq 1 60);do curl --fail -s --max-time 10 "$URL/" -o /dev/null&&break;sleep 2;done;curl --fail -s "$URL/" -o /dev/null
          curl --fail -s -H 'content-type: application/json' --data @/tmp/login "$URL/api/auth/login">/tmp/login2;node -e "const fs=require('node:fs'),x=JSON.parse(fs.readFileSync('/tmp/login2','utf8')),d=x.data||x;if(!d.token)process.exit(1);fs.writeFileSync('/tmp/auth2',d.token)"
          T="$(cat /tmp/auth2)";curl --fail -s -H "authorization: Bearer $T" "$URL/api/admin/backup/export">/tmp/after-backup
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),x=JSON.parse(fs.readFileSync('/tmp/after-backup')),p=x.data||x,canon=v=>Array.isArray(v)?v.map(canon):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canon(v[k])])):v;const h=crypto.createHash('sha256').update(JSON.stringify(canon(p.data))).digest('hex');if(h!==fs.readFileSync('/tmp/before.sha','utf8').trim())throw Error(`business data changed ${h}`);fs.writeFileSync('/tmp/after.sha',h);
          NODE
          cd /tmp/v16;npm run test:update
          node - <<'NODE'
          (async()=>{const c=await import('./scripts/update-contract.mjs'),r=await fetch(process.env.CANONICAL_CP_URL+'/v1/updates/check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({demo:true,currentVersion:'1.1.0',channel:'stable'})}),x=await r.json();await c.verifyUpdateManifestSignature(x.manifest,x.signature,(await import('./src/generated/licenseConfig.ts')).LICENSE_PUBLIC_CONFIG?.publicKeyBase64||'');let ok=0;try{c.assertUpdatePolicy({manifest:x.manifest,currentVersion:'1.2.0',licensePlan:'demo'})}catch(e){if(String(e.message).includes('UPDATE_DOWNGRADE_OR_REPLAY'))ok=1}if(!ok)throw Error('replay accepted');let bad={...x.manifest,packageSha256:'0'.repeat(64)},t=0;try{await c.verifyUpdateManifestSignature(bad,x.signature,(await import('./src/generated/licenseConfig.ts')).LICENSE_PUBLIC_CONFIG?.publicKeyBase64||'')}catch{t=1}if(!t)throw Error('signature tamper accepted')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          touch /tmp/v20-verify.ok
      - name: Guarded cleanup disposable customer and license
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/lic ]&&[ -f /tmp/cp/wrangler.v20.jsonc ];then LIC="$(cat /tmp/lic)";[[ "$LIC" == "lic-v20-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]&&cd /tmp/cp&&timeout 90s npx wrangler d1 execute DB --remote --config wrangler.v20.jsonc --command "DELETE FROM license_events WHERE license_id='${LIC}';DELETE FROM activations WHERE license_id='${LIC}';DELETE FROM licenses WHERE id='${LIC}';" >/dev/null;fi
          if [ -f /tmp/v20.env ];then set -a;. /tmp/v20.env;set +a;[[ "$PAGES" == v17-v20-* ]]&&[[ "$D1" == v17-v20-*-db ]]&&cd /tmp/v16&&timeout 120s npx wrangler pages project delete "$PAGES" --yes&&timeout 120s npx wrangler d1 delete "$D1" --skip-confirmation;fi
          touch /tmp/v20-cleanup.ok;exit 0
      - name: Persist live upgrade evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail;mkdir -p v17-production-evidence;v(){ [ -f "/tmp/v20-$1.ok" ]&&printf success||printf failure;};cat >v17-production-evidence/live-upgrade-v20-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          exact_v16_v17_artifacts=$(v exact)
          run_scoped_license=$(v license)
          fresh_cloudflare_v16_deploy=$(v deploy)
          setup_activation_business_snapshot=$(v activated)
          automatic_backup_update_migration_deploy=$(v bootstrap)
          data_parity_pages_runtime_signature_replay=$(v verify)
          cleanup=$(v cleanup)
          before_business_sha256=$(cat /tmp/before.sha 2>/dev/null||printf unavailable)
          after_business_sha256=$(cat /tmp/after.sha 2>/dev/null||printf unavailable)
          from_version=1.1.0
          to_version=1.2.0
          migration_ceiling=0008_add_update_state.sql
          canonical_control_plane_url=${CANONICAL_CP_URL}
          v16_rebuilt=false
          v16_modified=false
          existing_customer_d1_touched=false
          v17_customer_ready=false
          EOF
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add v17-production-evidence/live-upgrade-v20-latest.txt;git commit -m 'ci(v17): record exact live upgrade v20 evidence' || exit 0;git fetch origin agent/v16-production-gate;git rebase origin/agent/v16-production-gate;git push origin HEAD:agent/v16-production-gate