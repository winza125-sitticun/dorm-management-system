name: V17 Pages Deployment Snapshot Parser Recovery V31
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v17-pages-deployment-snapshot-parser-recovery-v31.yml']
permissions: { contents: write }
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Replace schema-dependent deployment parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
            Path('.github/workflows/v17-pro-failed-migration-rollback-v29.yml'),
            Path('.github/workflows/v17-pro-network-retry-v30.yml'),
          ]
          old = """          python3 - <<'PY'\n          import json\n          def ids(p):\n            x=json.load(open(p));r=x if isinstance(x,list) else x.get('result',x.get('deployments',[]));return [q.get('id') for q in r if q.get('id')]\n          a=ids('/tmp/deploy-before');b=ids('/tmp/deploy-after');assert a and b and a[0]==b[0],(a[:2],b[:2])\n          PY\n"""
          new = """          python3 - <<'PY'\n          import json\n          def canonical(p):\n            return json.dumps(json.load(open(p)),sort_keys=True,separators=(',',':'))\n          a=canonical('/tmp/deploy-before');b=canonical('/tmp/deploy-after');assert a==b,(a,b)\n          PY\n"""
          for path in paths:
            text = path.read_text()
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one parser block in {path}, found {count}')
            path.write_text(text.replace(old,new,1))
          PY
          git diff --check
          grep -Fq "a=canonical('/tmp/deploy-before');b=canonical('/tmp/deploy-after');assert a==b" .github/workflows/v17-pro-failed-migration-rollback-v29.yml
          grep -Fq "a=canonical('/tmp/deploy-before');b=canonical('/tmp/deploy-after');assert a==b" .github/workflows/v17-pro-network-retry-v30.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v17-pro-failed-migration-rollback-v29.yml .github/workflows/v17-pro-network-retry-v30.yml
          git commit -m 'ci(v17): compare canonical Pages deployment snapshots'
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate