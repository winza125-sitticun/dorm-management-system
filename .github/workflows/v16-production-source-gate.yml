name: V16 Production Source Gate
on:
  workflow_dispatch:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-source-gate.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-source-gate, cancel-in-progress: true }
env:
  V15_ARTIFACT_ID: '9330679827'
  V15_ARTIFACT_SHA256: '5f6e65ae856c1196fcd3a2e3dd7bcffb4da863ab212d3595839e921f0a96e1cf'
  V15_MASTER_SHA256: 'd05ee110815a29b74498e17adac1b8355dec40d5a705dd016f5ad5f849caa9e9'
  INPUT_ARCHIVE_SHA256: '43b2d44d508a02a431f2a405b5e95f8fbf850cca17b522446d1d6e0630d4d0f7'
  TASK8_TREE_SHA256: '1b7c4e8179be6f397061d7999ade081f1bb0791f5ac10a2b5490dbec1d3d7b6c'
  MIGRATION_CEILING: '0007_add_license_state.sql'
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Reconstruct frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          cat v16-production-inputs/input-00a.b64 v16-production-inputs/input-00b.b64 v16-production-inputs/input-01.b64 v16-production-inputs/input-02.b64 v16-production-inputs/input-03.b64 v16-production-inputs/input-04.b64 v16-production-inputs/input-05.b64 | base64 -d > /tmp/inputs.tar.xz
          echo "$INPUT_ARCHIVE_SHA256  /tmp/inputs.tar.xz" | sha256sum --check --strict
          rm -rf /tmp/v16-inputs && tar -xJf /tmp/inputs.tar.xz -C /tmp
          (cd /tmp/v16-inputs && sha256sum --check --strict SHA256SUMS.txt)
      - name: Reconstruct exact Task 8 from immutable V15
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V15_ARTIFACT_ID}/zip" -o /tmp/v15.zip
          echo "$V15_ARTIFACT_SHA256  /tmp/v15.zip" | sha256sum --check --strict
          rm -rf /tmp/v15 /tmp/v16-work; mkdir -p /tmp/v15 /tmp/v16-work
          unzip -q /tmp/v15.zip -d /tmp/v15
          echo "$V15_MASTER_SHA256  /tmp/v15/dorm-management-system-master-v15-CUSTOMER-READY.zip" | sha256sum --check --strict
          unzip -q /tmp/v15/dorm-management-system-master-v15-CUSTOMER-READY.zip -d /tmp/v16-work
          cd /tmp/v16-work
          for p in /tmp/v16-inputs/V16_TASK6_EXACT_V15.patch /tmp/v16-inputs/V16_TASK7.patch /tmp/v16-inputs/V16_TASK8_PRODUCTION.patch; do patch --dry-run -p1 < "$p"; patch -p1 < "$p"; done
          test "$(find d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
          test ! -e control-plane
          find . -type f ! -path './node_modules/*' ! -path './dist/*' ! -path './dist-server/*' ! -path './preview-v14/*' ! -path './release-v14/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/tree.sha256
          test "$(wc -l < /tmp/tree.sha256 | tr -d ' ')" = '231'
          echo "$TASK8_TREE_SHA256  /tmp/tree.sha256" | sha256sum --check --strict
      - name: Extract isolated Control Plane
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cp-review /tmp/control-plane; mkdir -p /tmp/cp-review
          unzip -q /tmp/v16-inputs/V16_TASK5_CONTROL_PLANE_REVIEW.zip -d /tmp/cp-review
          cp -a /tmp/cp-review/V16_TASK5_CONTROL_PLANE /tmp/control-plane
          test -f /tmp/control-plane/migrations/0001_license_schema.sql
          test ! -e /tmp/v16-work/control-plane
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Fresh customer npm ci
        working-directory: /tmp/v16-work
        run: npm ci
      - name: Customer full regression
        working-directory: /tmp/v16-work
        run: npm test
      - name: Customer TypeScript and Cloudflare gate
        working-directory: /tmp/v16-work
        run: |
          npm run lint
          npm run check:cloudflare-types:master
      - name: Customer production builds
        working-directory: /tmp/v16-work
        run: |
          npm run build:pages
          npm run build:vps
      - name: Four-plan preview package gate
        working-directory: /tmp/v16-work
        shell: bash
        run: |
          set -euo pipefail
          npm run packages:generate
          for plan in demo basic standard pro; do
            z="preview-v14/dorm-management-system-${plan}-v14-PREVIEW.zip"; test -f "$z"; unzip -t "$z" >/dev/null
            tmp="$(mktemp -d)"; unzip -q "$z" -d "$tmp"
            test "$(find "$tmp/d1-migrations" -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
            test ! -e "$tmp/control-plane"
            ! grep -RIl --exclude='*.zip' 'LICENSE_SIGNING_PRIVATE_KEY' "$tmp" | grep -q .
            rm -rf "$tmp"
          done
      - name: Fresh Control Plane install, tests and typecheck
        working-directory: /tmp/control-plane
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run typecheck
      - name: Freeze source-gated artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v16-production-source-gate; mkdir -p v16-production-source-gate/customer-previews
          (cd /tmp/v16-work && zip -qr "$GITHUB_WORKSPACE/v16-production-source-gate/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED.zip" . -x 'node_modules/*' 'dist/*' 'dist-server/*' 'preview-v14/*' 'release-v14/*')
          (cd /tmp/control-plane && zip -qr "$GITHUB_WORKSPACE/v16-production-source-gate/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" . -x 'node_modules/*')
          for p in demo basic standard pro; do cp "/tmp/v16-work/preview-v14/dorm-management-system-${p}-v14-PREVIEW.zip" "v16-production-source-gate/customer-previews/dorm-management-system-${p}-v16-SOURCE-GATE-PREVIEW.zip"; done
          sha256sum v16-production-source-gate/*.zip v16-production-source-gate/customer-previews/*.zip > v16-production-source-gate/SHA256SUMS.txt
          cp /tmp/tree.sha256 v16-production-source-gate/V16_TASK8_TREE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with: { name: v16-production-source-gated, path: 'v16-production-source-gate/**', if-no-files-found: error, retention-days: 14 }
      - name: Persist evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          cat > v16-production-evidence/source-gate-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          v15_artifact_id=${V15_ARTIFACT_ID}
          v15_artifact_sha256=${V15_ARTIFACT_SHA256}
          v15_master_sha256=${V15_MASTER_SHA256}
          input_archive_sha256=${INPUT_ARCHIVE_SHA256}
          task8_tree_manifest_sha256=${TASK8_TREE_SHA256}
          migration_ceiling=${MIGRATION_CEILING}
          customer_ready=false
          deployed=false
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/source-gate-latest.txt
          git commit -m 'ci(v16): record production source gate' || exit 0
          git push origin HEAD:agent/v16-production-gate
