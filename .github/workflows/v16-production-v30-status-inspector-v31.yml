name: V16 V30 Status Inspector V31
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-v30-status-inspector-v31.yml']
permissions: { contents: write, actions: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Inspect generator and live V30
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          out={}
          for key,wf in [('generator','v16-production-live-license-smoke-v30-generator.yml'),('live','v16-production-live-license-smoke-v30.yml')]:
            url=f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?branch=agent%2Fv16-production-gate&per_page=3'
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              runs=data.get('workflow_runs',[])
              out[key]=({k:runs[0].get(k) for k in ('id','run_attempt','status','conclusion','head_sha','created_at','updated_at')} if runs else {'status':'missing'})
            except Exception as e: out[key]={'status':'inspect_error','error':str(e)}
          os.makedirs('v16-production-evidence',exist_ok=True)
          with open('v16-production-evidence/v30-status-inspector-v31-latest.json','w') as f: json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist inspector evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/v30-status-inspector-v31-latest.json
          git commit -m 'ci(v16): record V30 generator/live status v31' || exit 0
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate
