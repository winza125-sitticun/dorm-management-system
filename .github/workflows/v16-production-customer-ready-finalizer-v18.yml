name: V16 Production Customer Ready Finalizer V18
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['v16-production-evidence/live-license-smoke-v15-latest.txt']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-customer-ready-finalizer-v18, cancel-in-progress: false }
env:
  SOURCE_ARTIFACT_ID: '9391068149'
  SOURCE_ARTIFACT_SHA256: '14e094a00c75bf0b538df4b0d396264c3af28f53b96a95d379e01390005e72ff'
  CP_ZIP_SHA256: 'c4d510dad09ccc9d237319236bba9e54a0ac1d9091a906dc3d9fe81475fa7abc'
  PRO_ZIP_SHA256: '75945096ec0346dc31ab0b3c20ca25ee0828e2c0f4efd1fe0150ab6dd91a5182'
  EXPECTED_PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  EXPECTED_PUBLIC_KEY_SHA256: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  STABLE_WORKER: 'dorm-control-plane'
  EXPECTED_CONTROL_PLANE_URL: 'https://dorm-control-plane.winza125.workers.dev'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.V16_LICENSE_SIGNING_PRIVATE_KEY }}
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Require all prior gates GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def kv(path):
            d={}
            for line in Path(path).read_text().splitlines():
              if '=' in line:
                k,v=line.split('=',1); d[k.strip()]=v.strip()
            return d
          live=kv('v16-production-evidence/live-license-smoke-v15-latest.txt')
          off=kv('v16-production-evidence/offline-grace-v17-latest.txt')
          assert live.get('job_status')=='success',live
          for k in ('prerequisites','exact_artifact','resources_created','control_plane_deployed','license_seed','pro_pages_deployed','preactivation_readonly','activation_one_seat_local_tamper','deactivate_seat_reuse','central_upgrade_refresh','central_suspension_fail_closed'):
            assert live.get(k)=='success',(k,live.get(k))
          assert live.get('existing_d1_touched')=='false'
          assert off.get('job_status')=='success' and off.get('offline_grace_runtime')=='success',off
          assert off.get('source_artifact_id')=='9391068149'
          assert off.get('existing_d1_touched')=='false'
          PY
          test -n "${CLOUDFLARE_API_TOKEN:-}"; test -n "${CLOUDFLARE_ACCOUNT_ID:-}"; test -n "${LICENSE_SIGNING_PRIVATE_KEY:-}"
          touch /tmp/v16-v18-prior.ok
      - name: Download and verify exact V13 candidate
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o /tmp/source.zip
          echo "$SOURCE_ARTIFACT_SHA256  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/source /tmp/cp /tmp/pro; mkdir -p /tmp/source /tmp/cp /tmp/pro
          unzip -q /tmp/source.zip -d /tmp/source
          sed 's#v16-production-source-package-v13/##g' /tmp/source/SHA256SUMS.txt > /tmp/source/SHA256SUMS.normalized.txt
          (cd /tmp/source && sha256sum -c SHA256SUMS.normalized.txt)
          echo "$CP_ZIP_SHA256  /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" | sha256sum -c -
          echo "$PRO_ZIP_SHA256  /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V13.zip" | sha256sum -c -
          unzip -q /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip -d /tmp/cp
          unzip -q /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V13.zip -d /tmp/pro
          grep -Fq "$EXPECTED_CONTROL_PLANE_URL" /tmp/pro/src/generated/licenseConfig.ts
          grep -Fq "$EXPECTED_PUBLIC_KEY_B64" /tmp/pro/src/generated/licenseConfig.ts
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules 'BEGIN PRIVATE KEY' /tmp/source | grep -q .
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules 'LICENSE_SIGNING_PRIVATE_KEY' /tmp/pro | grep -q .
          touch /tmp/v16-v18-artifact.ok
      - name: Validate signing key and ensure stable Worker is absent
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto=require('node:crypto'); let input=(process.env.LICENSE_SIGNING_PRIVATE_KEY||'').trim();
          if((input.startsWith('"')&&input.endsWith('"'))||(input.startsWith("'")&&input.endsWith("'")))input=input.slice(1,-1).trim();
          if(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=/.test(input))input=input.replace(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=\s*/,'').trim();
          const pk=input.includes('BEGIN PRIVATE KEY')?crypto.createPrivateKey(input):crypto.createPrivateKey({key:Buffer.from(input.replace(/\s+/g,''),'base64'),format:'der',type:'pkcs8'});
          const jwk=crypto.createPublicKey(pk).export({format:'jwk'}); const raw=Buffer.from(jwk.x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-jwk.x.length%4)%4),'base64');
          if(crypto.createHash('sha256').update(raw).digest('hex')!==process.env.EXPECTED_PUBLIC_KEY_SHA256) throw new Error('signing key mismatch');
          NODE
          code="$(curl --silent --output /tmp/stable-worker-check --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$STABLE_WORKER")"
          test "$code" = 404
          touch /tmp/v16-v18-stable-absent.ok
      - name: Install candidate dependencies and allocate names
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && npm install --no-audit --no-fund)
          (cd /tmp/pro && npm ci)
          M="$(printf '%s' "$GITHUB_RUN_ID" | tr -cd '0-9' | tail -c 9)-${GITHUB_RUN_ATTEMPT}-$(python3 -c 'import secrets; print(secrets.token_hex(3))')"
          echo "RUN_MARKER=$M" >> "$GITHUB_ENV"
          echo "STABLE_D1=v16-license-prod-${M}-db" >> "$GITHUB_ENV"
          echo "PRO_PAGES=v16-final-pro-${M}" >> "$GITHUB_ENV"
          echo "PRO_D1=v16-final-pro-${M}-db" >> "$GITHUB_ENV"
      - name: Create fresh stable License D1 and deploy stable Control Plane
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && timeout 120s npx wrangler d1 create "$STABLE_D1" --location apac && timeout 60s npx wrangler d1 info "$STABLE_D1" --json > /tmp/stable-d1.json)
          python3 - <<'PY'
          import json,os,re
          x=json.load(open('/tmp/stable-d1.json'))
          def walk(v):
            if isinstance(v,dict):
              for k,val in v.items():
                if k in ('uuid','id','database_id') and isinstance(val,str) and re.fullmatch(r'[0-9a-fA-F-]{36}',val): return val
                r=walk(val)
                if r:return r
            if isinstance(v,list):
              for val in v:
                r=walk(val)
                if r:return r
          uid=walk(x); assert uid
          marker={'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'name':os.environ['STABLE_D1'],'uuid':uid}
          json.dump(marker,open('/tmp/owned-stable-d1.json','w'))
          json.dump({'name':os.environ['STABLE_WORKER'],'main':'src/index.ts','compatibility_date':'2026-08-05','d1_databases':[{'binding':'DB','database_name':os.environ['STABLE_D1'],'database_id':uid,'migrations_dir':'migrations'}]},open('/tmp/cp/wrangler.jsonc','w'),indent=2)
          PY
          (cd /tmp/cp && timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd /tmp/cp && timeout 240s npx wrangler deploy --config wrangler.jsonc) | tee /tmp/stable-deploy.log
          printf '%s\n' "$LICENSE_SIGNING_PRIVATE_KEY" | (cd /tmp/cp && timeout 90s npx wrangler secret put LICENSE_SIGNING_PRIVATE_KEY --config wrangler.jsonc)
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/stable-deploy.log | tail -n1)"; test "$URL" = "$EXPECTED_CONTROL_PLANE_URL"
          python3 - <<'PY'
          import json,os
          json.dump({'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'name':os.environ['STABLE_WORKER']},open('/tmp/owned-stable-worker.json','w'))
          PY
          touch /tmp/v16-v18-stable-deployed.ok
      - name: Seed disposable Pro license in new stable D1
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'); const key='V16-'+crypto.randomBytes(18).toString('hex').toUpperCase(); const hash=crypto.createHash('sha256').update(key.trim().toUpperCase()).digest('hex'); fs.writeFileSync('/tmp/final-license-key',key); fs.writeFileSync('/tmp/final-license-hash',hash);
          NODE
          H="$(cat /tmp/final-license-hash)"; NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd /tmp/cp && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "INSERT INTO licenses(id,key_hash,customer_label,plan,status,max_activations,expires_at,created_at,updated_at) VALUES('final-smoke-license','${H}','V16 final smoke','pro','active',1,NULL,'${NOW}','${NOW}');")
          touch /tmp/v16-v18-seed.ok
      - name: Create fresh final customer D1 and Pages
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/pro && timeout 120s npx wrangler d1 create "$PRO_D1" --location apac && timeout 60s npx wrangler d1 info "$PRO_D1" --json > /tmp/pro-d1.json)
          python3 - <<'PY'
          import json,os,re
          x=json.load(open('/tmp/pro-d1.json'))
          def walk(v):
            if isinstance(v,dict):
              for k,val in v.items():
                if k in ('uuid','id','database_id') and isinstance(val,str) and re.fullmatch(r'[0-9a-fA-F-]{36}',val): return val
                r=walk(val)
                if r:return r
            if isinstance(v,list):
              for val in v:
                r=walk(val)
                if r:return r
          uid=walk(x); assert uid
          marker={'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'name':os.environ['PRO_D1'],'uuid':uid}; json.dump(marker,open('/tmp/owned-pro-d1.json','w'))
          json.dump({'name':os.environ['PRO_PAGES'],'compatibility_date':'2026-08-05','compatibility_flags':['nodejs_compat'],'pages_build_output_dir':'./dist','upload_source_maps':True,'d1_databases':[{'binding':'DB','database_name':os.environ['PRO_D1'],'database_id':uid,'migrations_dir':'./d1-migrations'}]},open('/tmp/pro/wrangler.jsonc','w'),indent=2)
          PY
          (cd /tmp/pro && timeout 120s npx wrangler pages project create "$PRO_PAGES" --production-branch main)
          python3 - <<'PY'
          import json,os
          json.dump({'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'name':os.environ['PRO_PAGES']},open('/tmp/owned-pages.json','w'))
          PY
          JWT="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '%s\n' "$JWT" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put JWT_SECRET --project-name "$PRO_PAGES")
          printf '%s\n' "$EXPECTED_CONTROL_PLANE_URL" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put LICENSE_CONTROL_PLANE_URL --project-name "$PRO_PAGES")
          printf '%s\n' "$EXPECTED_PUBLIC_KEY_B64" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put LICENSE_SIGNING_PUBLIC_KEY --project-name "$PRO_PAGES")
          unset JWT
          (cd /tmp/pro && timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd /tmp/pro && npm run build:pages)
          (cd /tmp/pro && timeout 240s npx wrangler pages deploy dist --project-name "$PRO_PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false) | tee /tmp/pro-deploy.log
          PRO_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/pro-deploy.log | tail -n1)"; test -n "$PRO_URL"; echo "PRO_URL=$PRO_URL" >> "$GITHUB_ENV"
          ready=0; for i in $(seq 1 90); do if curl --fail --silent --show-error --max-time 10 "$PRO_URL/" -o /dev/null; then ready=1; break; fi; sleep 2; done; test "$ready" = 1
          touch /tmp/v16-v18-customer-deployed.ok
      - name: Final live customer activation smoke against stable Control Plane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,secrets
          email=f"v16-final-{os.environ['RUN_MARKER']}@example.invalid"; pwd='V16!FinalAa'+secrets.token_hex(8)
          json.dump({'email':email,'password':pwd,'displayName':'V16 Final Smoke','dormName':'V16 Final Dorm'},open('/tmp/setup.json','w')); json.dump({'username':email,'password':pwd},open('/tmp/login.json','w'))
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors -H 'content-type: application/json' --data @/tmp/setup.json "$PRO_URL/api/setup/init" >/tmp/setup-response.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors -H 'content-type: application/json' --data @/tmp/login.json "$PRO_URL/api/auth/login" >/tmp/login-response.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/login-response.json')).get('data',{}); assert d.get('token') and d.get('user'); open('/tmp/auth-token','w').write(d['token'])
          PY
          T="$(cat /tmp/auth-token)"
          code="$(curl --silent --output /tmp/pre.json --write-out '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data '{}' "$PRO_URL/api/rooms")"; test "$code" = 403
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pre.json')); assert x.get('error',{}).get('code')=='LICENSE_READ_ONLY',x
          json.dump({'licenseKey':open('/tmp/final-license-key').read()},open('/tmp/activate.json','w'))
          PY
          curl --fail --silent --show-error -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate.json "$PRO_URL/api/license/activate" >/tmp/activated.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" >/tmp/status.json
          python3 - <<'PY'
          import json
          for f in ('/tmp/activated.json','/tmp/status.json'):
            d=json.load(open(f)).get('data',{}); assert d.get('effectivePlan')=='pro',d; assert d.get('status') in ('active','offline'),d; assert 'token' not in d,d
          PY
          touch /tmp/v16-v18-final-smoke.ok
      - name: Remove disposable stable-D1 smoke license and freeze final customer artifacts
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "DELETE FROM activations WHERE license_id='final-smoke-license'; DELETE FROM licenses WHERE id='final-smoke-license';")
          rm -rf v16-customer-ready-final; mkdir -p v16-customer-ready-final/vendor
          cp /tmp/source/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED-V13.zip v16-customer-ready-final/dorm-management-system-master-v16-CUSTOMER-READY.zip
          for p in demo basic standard pro; do cp "/tmp/source/customer-previews/dorm-management-system-${p}-v16-SOURCE-GATE-V13.zip" "v16-customer-ready-final/dorm-management-system-${p}-v16-CUSTOMER-READY.zip"; done
          cp /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip v16-customer-ready-final/vendor/dorm-control-plane-v16-PRODUCTION-SOURCE.zip
          for z in v16-customer-ready-final/*.zip v16-customer-ready-final/vendor/*.zip; do unzip -t "$z" >/dev/null; done
          ! grep -RIl --exclude='*.zip' 'BEGIN PRIVATE KEY' v16-customer-ready-final | grep -q .
          sha256sum v16-customer-ready-final/*.zip v16-customer-ready-final/vendor/*.zip > v16-customer-ready-final/SHA256SUMS.txt
          cat > v16-customer-ready-final/RELEASE.txt <<EOF
          version=V16
          source_artifact_id=${SOURCE_ARTIFACT_ID}
          source_artifact_sha256=${SOURCE_ARTIFACT_SHA256}
          control_plane_url=${EXPECTED_CONTROL_PLANE_URL}
          signing_public_key_fingerprint=${EXPECTED_PUBLIC_KEY_SHA256}
          migration_ceiling=0007_add_license_state.sql
          customer_ready=success
          EOF
          touch /tmp/v16-v18-freeze.ok
      - uses: actions/upload-artifact@v4
        with: { name: v16-customer-ready-final, path: 'v16-customer-ready-final/**', if-no-files-found: error, retention-days: 14 }
      - name: Persist final evidence and retain stable resources only on success
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          val(){ [ -f "/tmp/v16-v18-$1.ok" ] && printf success || printf failure; }
          stable_uuid=unavailable; [ -f /tmp/owned-stable-d1.json ] && stable_uuid="$(python3 -c "import json;print(json.load(open('/tmp/owned-stable-d1.json'))['uuid'])")"
          cat > v16-production-evidence/customer-ready-v18-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          prior_gates=$(val prior)
          exact_artifact=$(val artifact)
          stable_worker_absent_before_deploy=$(val stable-absent)
          stable_control_plane_deployed=$(val stable-deployed)
          stable_smoke_license_seed=$(val seed)
          final_customer_deployed=$(val customer-deployed)
          final_customer_activation_smoke=$(val final-smoke)
          final_artifact_freeze=$(val freeze)
          source_artifact_id=${SOURCE_ARTIFACT_ID}
          source_artifact_sha256=${SOURCE_ARTIFACT_SHA256}
          stable_control_plane_url=${EXPECTED_CONTROL_PLANE_URL}
          stable_d1_uuid=${stable_uuid}
          existing_d1_touched=false
          customer_ready=$([ "${JOB_STATUS}" = success ] && printf success || printf false)
          EOF
          if [ "${JOB_STATUS}" = success ]; then touch /tmp/v16-v18-keep-stable; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/customer-ready-v18-latest.txt
          git commit -m 'ci(v16): record customer ready finalizer v18' || exit 0
          git push origin HEAD:agent/v16-production-gate
      - name: Cleanup disposable resources and rollback stable resources on failure
        if: always()
        shell: bash
        run: |
          set +e
          verify(){ python3 - "$1" "$2" "$3" <<'PY'
          import json,os,sys,re
          p,name,kind=sys.argv[1:]; x=json.load(open(p)); assert x['run_id']==os.environ['GITHUB_RUN_ID']; assert x['attempt']==os.environ['GITHUB_RUN_ATTEMPT']; assert x['name']==name
          if kind=='d1': assert re.fullmatch(r'[0-9a-fA-F-]{36}',x['uuid'])
          PY
          }
          if [ -f /tmp/owned-pages.json ] && verify /tmp/owned-pages.json "$PRO_PAGES" pages; then timeout 120s bash -lc 'cd /tmp/pro && npx wrangler pages project delete "$PRO_PAGES" --yes' || true; fi
          if [ -f /tmp/owned-pro-d1.json ] && verify /tmp/owned-pro-d1.json "$PRO_D1" d1; then timeout 60s bash -lc 'cd /tmp/pro && npx wrangler d1 info "$PRO_D1" --json >/tmp/pro-current.json' || true; python3 - <<'PY' && timeout 120s bash -lc 'cd /tmp/pro && npx wrangler d1 delete "$PRO_D1" --skip-confirmation' || true
          import json
          old=json.load(open('/tmp/owned-pro-d1.json')); assert old['uuid'] in json.dumps(json.load(open('/tmp/pro-current.json')))
          PY
          fi
          if [ ! -f /tmp/v16-v18-keep-stable ]; then
            if [ -f /tmp/owned-stable-worker.json ] && verify /tmp/owned-stable-worker.json "$STABLE_WORKER" worker; then timeout 120s bash -lc 'cd /tmp/cp && npx wrangler delete --name "$STABLE_WORKER" --config wrangler.jsonc' || true; fi
            if [ -f /tmp/owned-stable-d1.json ] && verify /tmp/owned-stable-d1.json "$STABLE_D1" d1; then timeout 60s bash -lc 'cd /tmp/cp && npx wrangler d1 info "$STABLE_D1" --json >/tmp/stable-current.json' || true; python3 - <<'PY' && timeout 120s bash -lc 'cd /tmp/cp && npx wrangler d1 delete "$STABLE_D1" --skip-confirmation' || true
          import json
          old=json.load(open('/tmp/owned-stable-d1.json')); assert old['uuid'] in json.dumps(json.load(open('/tmp/stable-current.json')))
          PY
            fi
          fi
          exit 0
