name: V17 Vendor Admin MVP Production Gate Bridge V3
on:
  push:
    branches: [agent/v16-production-gate]
    paths:
      - .github/workflows/v17-control-plane-diagnostic-v15.yml
      - v17-vendor-admin-mvp/V17_VENDOR_ADMIN_MVP_CUSTOMER_READY_WORKFLOW.yml.gz.b64
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v16-production-gate
          fetch-depth: 0
      - name: Materialize verified CUSTOMER-READY gate on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/v17-vendor-admin-mvp-customer-ready
          git worktree add -B agent/v17-vendor-admin-mvp-customer-ready /tmp/feature origin/agent/v17-vendor-admin-mvp-customer-ready
          cd /tmp/feature
          base64 -d v17-vendor-admin-mvp/V17_VENDOR_ADMIN_MVP_CUSTOMER_READY_WORKFLOW.yml.gz.b64 > /tmp/gate.yml.gz
          echo 'fd97ce18d871bc84b382c09e21d197b5db99d7ceb83e8abfddb4308de052a93e  /tmp/gate.yml.gz' | sha256sum -c -
          gunzip -c /tmp/gate.yml.gz > /tmp/gate.yml
          echo '2fbc9cec64b0548ff794065e4009b9caa5e3ab2a3bab1346224e494266770e77  /tmp/gate.yml' | sha256sum -c -
          grep -Fxq 'name: V17 Vendor Admin MVP Customer Ready Gate V1' /tmp/gate.yml
          grep -Fq 'branches: [agent/v17-vendor-admin-mvp-customer-ready]' /tmp/gate.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/gate.yml')
          s=p.read_text()
          old=".github/workflows/v17-vendor-admin-mvp-customer-ready-v1.yml"
          new=".github/v17-vendor-admin-customer-ready-trigger.txt"
          if old not in s:
              raise SystemExit('expected workflow path not found in verified gate')
          p.write_text(s.replace(old,new))
          PY
          grep -Fq "paths: ['.github/v17-vendor-admin-customer-ready-trigger.txt']" /tmp/gate.yml
          mkdir -p .github/workflows
          cp /tmp/gate.yml .github/workflows/v17-vendor-admin-mvp-customer-ready-v1.yml
          git show 269b3801ca7fa94a6dddb0f12aa1e036e08407df:.github/workflows/v17-control-plane-diagnostic-v15.yml > .github/workflows/v17-control-plane-diagnostic-v15.yml
          cat > v17-vendor-admin-mvp/GATE_MATERIALIZATION.txt <<'EOF'
          original_gate_gzip_sha256=fd97ce18d871bc84b382c09e21d197b5db99d7ceb83e8abfddb4308de052a93e
          original_gate_yaml_sha256=2fbc9cec64b0548ff794065e4009b9caa5e3ab2a3bab1346224e494266770e77
          trigger_only_modification=workflow_paths_to_marker
          trigger_marker=.github/v17-vendor-admin-customer-ready-trigger.txt
          frozen_customer_packages_touched=false
          EOF
          git add -- .github/workflows/v17-vendor-admin-mvp-customer-ready-v1.yml .github/workflows/v17-control-plane-diagnostic-v15.yml v17-vendor-admin-mvp/GATE_MATERIALIZATION.txt
          git commit -m 'ci(v17): materialize vendor admin MVP customer-ready gate' || true
          git push origin HEAD:agent/v17-vendor-admin-mvp-customer-ready
      - name: Restore production branch tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git show 269b3801ca7fa94a6dddb0f12aa1e036e08407df:.github/workflows/v17-control-plane-diagnostic-v15.yml > .github/workflows/v17-control-plane-diagnostic-v15.yml
          git add -- .github/workflows/v17-control-plane-diagnostic-v15.yml
          git rm -f --ignore-unmatch -- .github/workflows/v17-vendor-admin-mvp-bootstrap-v0.yml
          git rm -r --ignore-unmatch -- v17-vendor-admin-mvp
          if ! git diff --cached --quiet; then
            git commit -m 'ci(v17): restore production branch tree [skip ci]'
            git push origin HEAD:agent/v16-production-gate
          fi
