name: V16 Task 2 License State Closure V2

on:
  workflow_dispatch:
  push:
    branches: [agent/v16-task2-license-state-bootstrap]
    paths:
      - '.github/workflows/v16-task2-license-state-closure-v2.yml'
      - 'v16-task2-patches/001-tests.patch'
      - 'v16-task2-patches/002-implementation.patch'
      - 'v16-task2-patches/003-packaging-leak-tests.patch'

permissions:
  contents: write
  actions: read

concurrency:
  group: v16-task2-license-state-closure-v2
  cancel-in-progress: true

env:
  BASE_ARTIFACT_ID: '9345425396'
  BASE_ARTIFACT_SHA256: '56f5be6a25f0d831d3ac611d4cce531213a6704da772ad28ee3bccc0a7654001'
  BASE_MASTER_SHA256: '6551a8778f39e5f1a3dd7c2cbc18655a316c29906d02d0df428dd00d6ac522eb'
  TEST_PATCH_SHA256: 'd5810541a15ddb150431a06a96fe2fe5f790ab73340d98ed030fe7485d70e075'
  PACKAGING_LEAK_TEST_PATCH_SHA256: 'db3fd20eff769a9c0abe5b34422f86f7f0e1bbf0af22779b1e2aa41942ae8010'
  IMPLEMENTATION_PATCH_SHA256: '21aa90651b442db59c63e39057b9c3b71db031ddfcef1a37b5ddebaa988c548f'
  PRE_MIGRATION_CEILING: '0006_add_white_label_settings.sql'
  POST_MIGRATION_CEILING: '0007_add_license_state.sql'
  EXPECTED_CUSTOMER_ENTRY_COUNT: '205'
  BLOCKED_RUN_ID: '32200435545'
  BLOCKED_ARTIFACT_ID: '9347320043'

jobs:
  closure-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Task 2 lineage
        uses: actions/checkout@v4
        with:
          ref: agent/v16-task2-license-state-bootstrap

      - name: Verify exact patch bytes
        shell: bash
        run: |
          set -euo pipefail
          echo "$TEST_PATCH_SHA256  v16-task2-patches/001-tests.patch" | sha256sum --check --strict
          echo "$PACKAGING_LEAK_TEST_PATCH_SHA256  v16-task2-patches/003-packaging-leak-tests.patch" | sha256sum --check --strict
          echo "$IMPLEMENTATION_PATCH_SHA256  v16-task2-patches/002-implementation.patch" | sha256sum --check --strict

      - name: Download immutable Task 1 REVIEW artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" \
            -o task1-review.zip
          echo "$BASE_ARTIFACT_SHA256  task1-review.zip" | sha256sum --check --strict
          rm -rf candidate && mkdir candidate
          unzip -q task1-review.zip -d candidate

      - name: Verify and extract exact Task 1 Master
        shell: bash
        run: |
          set -euo pipefail
          MASTER_ZIP="$(find candidate -type f -name 'dorm-management-system-master-v16-task1-REVIEW-CI.zip' -print -quit)"
          test -n "$MASTER_ZIP"
          echo "$BASE_MASTER_SHA256  $MASTER_ZIP" | sha256sum --check --strict
          rm -rf work && mkdir work
          unzip -q "$MASTER_ZIP" -d work
          latest="$(find work/d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)"
          test "$latest" = "$PRE_MIGRATION_CEILING"
          test ! -e work/d1-migrations/0007_add_license_state.sql
          test ! -e work/src/server/services/license.service.ts
          test ! -e work/control-plane

      - name: Apply tests first and prove intended RED
        shell: bash
        run: |
          set -euo pipefail
          cd work
          patch --dry-run -p1 < ../v16-task2-patches/001-tests.patch
          patch -p1 < ../v16-task2-patches/001-tests.patch
          patch --dry-run -p1 < ../v16-task2-patches/003-packaging-leak-tests.patch
          patch -p1 < ../v16-task2-patches/003-packaging-leak-tests.patch
          set +e
          node --test \
            tests/license-state-migration.test.mjs \
            tests/license-state-backup-boundary.test.mjs \
            tests/package-builder.test.mjs \
            tests/package-parity.test.mjs \
            tests/package-audit.test.mjs \
            tests/package-release.test.mjs > ../v16-task2-v2-red-portable.log 2>&1
          portable_status=$?
          node --experimental-strip-types --test tests/license-state-service.test.ts > ../v16-task2-v2-red-service.log 2>&1
          service_status=$?
          set -e
          cat ../v16-task2-v2-red-portable.log
          cat ../v16-task2-v2-red-service.log
          test "$portable_status" -ne 0
          test "$service_status" -ne 0
          grep -Fq '# fail 7' ../v16-task2-v2-red-portable.log
          grep -Fq 'customer package leaked tests/license-state-migration.test.mjs' ../v16-task2-v2-red-portable.log
          grep -Fq 'audit did not reject tests/license-state-migration.test.mjs' ../v16-task2-v2-red-portable.log
          grep -Fq 'ERR_MODULE_NOT_FOUND' ../v16-task2-v2-red-service.log

      - name: Apply implementation and prove focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd work
          patch --dry-run -p1 < ../v16-task2-patches/002-implementation.patch
          patch -p1 < ../v16-task2-patches/002-implementation.patch
          latest="$(find d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)"
          test "$latest" = "$POST_MIGRATION_CEILING"
          node --test \
            tests/license-state-migration.test.mjs \
            tests/license-state-backup-boundary.test.mjs \
            tests/package-builder.test.mjs \
            tests/package-parity.test.mjs \
            tests/package-audit.test.mjs \
            tests/package-release.test.mjs | tee ../v16-task2-v2-focused-portable-green.log
          node --experimental-strip-types --test tests/license-state-service.test.ts | tee ../v16-task2-v2-focused-service-green.log

      - name: Create immutable Task 2 Master REVIEW candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f dorm-management-system-master-v16-task2-REVIEW-V2.zip
          (cd work && zip -qr ../dorm-management-system-master-v16-task2-REVIEW-V2.zip .)
          unzip -t dorm-management-system-master-v16-task2-REVIEW-V2.zip >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Fresh dependency install
        working-directory: work
        run: npm ci

      - name: Runtime Task 2 tests
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test tests/license-state-service.test.ts tests/backup-export.test.ts tests/backup-restore.test.ts
          node --test tests/license-state-migration.test.mjs tests/license-state-backup-boundary.test.mjs tests/package-builder.test.mjs tests/package-audit.test.mjs

      - name: Fresh and upgrade local D1 smoke
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../.task2-d1-fresh-v2 ../.task2-d1-upgrade-v2 d1-migrations-through-0006 wrangler.task2-*.jsonc
          mkdir d1-migrations-through-0006
          find d1-migrations -maxdepth 1 -type f -name '*.sql' ! -name '0007_add_license_state.sql' -exec cp {} d1-migrations-through-0006/ \;
          cat > wrangler.task2-fresh.jsonc <<'EOF'
          {
            "name": "dorm-v16-task2-fresh-v2",
            "compatibility_date": "2026-08-05",
            "d1_databases": [{"binding":"DB","database_name":"dorm-v16-task2-fresh-v2-db","database_id":"22222222-2222-2222-2222-222222222222","migrations_dir":"./d1-migrations"}]
          }
          EOF
          cat > wrangler.task2-upgrade-0006.jsonc <<'EOF'
          {
            "name": "dorm-v16-task2-upgrade-v2",
            "compatibility_date": "2026-08-05",
            "d1_databases": [{"binding":"DB","database_name":"dorm-v16-task2-upgrade-v2-db","database_id":"33333333-3333-3333-3333-333333333333","migrations_dir":"./d1-migrations-through-0006"}]
          }
          EOF
          cat > wrangler.task2-upgrade-full.jsonc <<'EOF'
          {
            "name": "dorm-v16-task2-upgrade-v2",
            "compatibility_date": "2026-08-05",
            "d1_databases": [{"binding":"DB","database_name":"dorm-v16-task2-upgrade-v2-db","database_id":"33333333-3333-3333-3333-333333333333","migrations_dir":"./d1-migrations"}]
          }
          EOF

          printf 'y\n' | npx wrangler d1 migrations apply DB --local --persist-to ../.task2-d1-fresh-v2 --config wrangler.task2-fresh.jsonc
          npx wrangler d1 execute DB --local --persist-to ../.task2-d1-fresh-v2 --config wrangler.task2-fresh.jsonc --command "PRAGMA table_info(license_state)" --json > ../task2-v2-fresh-schema.json
          npx wrangler d1 execute DB --local --persist-to ../.task2-d1-fresh-v2 --config wrangler.task2-fresh.jsonc --command "SELECT COUNT(*) AS license_count FROM license_state" --json > ../task2-v2-fresh-count.json
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = (p) => {
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            return (Array.isArray(data) ? data : [data]).flatMap((x) => Array.isArray(x?.results) ? x.results : []);
          };
          const names = rows('../task2-v2-fresh-schema.json').map((x) => x.name);
          const expected = ['id','installation_id','signed_token','status','effective_plan','last_checked_at','grace_until','expires_at','control_plane_url','updated_at'];
          if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error(`fresh schema mismatch ${JSON.stringify(names)}`);
          if (Number(rows('../task2-v2-fresh-count.json')[0]?.license_count) !== 0) throw new Error('fresh license_state is not empty');
          NODE
          set +e
          npx wrangler d1 execute DB --local --persist-to ../.task2-d1-fresh-v2 --config wrangler.task2-fresh.jsonc --command "INSERT INTO license_state (id, installation_id, status, control_plane_url, updated_at) VALUES (2, 'bad', 'unlicensed', 'https://invalid.test', '2026-08-19T00:00:00.000Z')" >/tmp/task2-v2-invalid-id.log 2>&1
          invalid_status=$?
          set -e
          test "$invalid_status" -ne 0

          printf 'y\n' | npx wrangler d1 migrations apply DB --local --persist-to ../.task2-d1-upgrade-v2 --config wrangler.task2-upgrade-0006.jsonc
          npx wrangler d1 execute DB --local --persist-to ../.task2-d1-upgrade-v2 --config wrangler.task2-upgrade-0006.jsonc --command "INSERT INTO users (id, uid, email, password) VALUES (1, 'task2-owner', 'owner@example.test', 'hash'); INSERT INTO settings (id, user_id, dorm_name, subscription_plan, subscription_status) VALUES (1, 1, 'Task2 Seed', 'pro', 'active'); INSERT INTO rooms (id, user_id, room_number, monthly_rent, status) VALUES (1, 1, '101', 3000, 'vacant');"
          printf 'y\n' | npx wrangler d1 migrations apply DB --local --persist-to ../.task2-d1-upgrade-v2 --config wrangler.task2-upgrade-full.jsonc
          printf 'y\n' | npx wrangler d1 migrations apply DB --local --persist-to ../.task2-d1-upgrade-v2 --config wrangler.task2-upgrade-full.jsonc
          npx wrangler d1 execute DB --local --persist-to ../.task2-d1-upgrade-v2 --config wrangler.task2-upgrade-full.jsonc --command "SELECT dorm_name, subscription_plan FROM settings WHERE id = 1" --json > ../task2-v2-upgrade-settings.json
          npx wrangler d1 execute DB --local --persist-to ../.task2-d1-upgrade-v2 --config wrangler.task2-upgrade-full.jsonc --command "SELECT room_number, monthly_rent FROM rooms WHERE id = 1" --json > ../task2-v2-upgrade-room.json
          npx wrangler d1 execute DB --local --persist-to ../.task2-d1-upgrade-v2 --config wrangler.task2-upgrade-full.jsonc --command "SELECT COUNT(*) AS license_count FROM license_state" --json > ../task2-v2-upgrade-count.json
          node - <<'NODE'
          const fs = require('node:fs');
          const first = (p) => {
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            return (Array.isArray(data) ? data : [data]).flatMap((x) => Array.isArray(x?.results) ? x.results : [])[0] || {};
          };
          const settings = first('../task2-v2-upgrade-settings.json');
          const room = first('../task2-v2-upgrade-room.json');
          const count = first('../task2-v2-upgrade-count.json');
          if (settings.dorm_name !== 'Task2 Seed' || settings.subscription_plan !== 'pro') throw new Error('settings changed across 0007');
          if (room.room_number !== '101' || Number(room.monthly_rent) !== 3000) throw new Error('room changed across 0007');
          if (Number(count.license_count) !== 0) throw new Error('upgrade license_state is not empty');
          NODE

          rm -rf d1-migrations-through-0006 wrangler.task2-fresh.jsonc wrangler.task2-upgrade-0006.jsonc wrangler.task2-upgrade-full.jsonc
          test ! -e d1-migrations-through-0006
          test ! -e wrangler.task2-fresh.jsonc
          test ! -e wrangler.task2-upgrade-0006.jsonc
          test ! -e wrangler.task2-upgrade-full.jsonc

      - name: Full regression suite
        working-directory: work
        run: npm test

      - name: TypeScript lint
        working-directory: work
        run: npm run lint

      - name: Cloudflare types
        working-directory: work
        run: npm run check:cloudflare-types:master

      - name: Pages production build
        working-directory: work
        run: npm run build:pages

      - name: VPS production build
        working-directory: work
        run: npm run build:vps

      - name: Generate PREVIEW packages only
        working-directory: work
        run: npm run packages:generate

      - name: Strict customer package closure audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v16-task2-review-v2 && mkdir v16-task2-review-v2
          expected_migration_sha=''
          expected_service_sha=''
          for plan in demo basic standard pro; do
            src="work/preview-v14/dorm-management-system-${plan}-v14-PREVIEW.zip"
            dst="v16-task2-review-v2/dorm-management-system-${plan}-v16-TASK2-PREVIEW-V2.zip"
            test -f "$src"
            unzip -t "$src" >/dev/null
            cp "$src" "$dst"
            names="$(unzip -Z1 "$dst")"
            entries="$(printf '%s\n' "$names" | sed '/^$/d' | wc -l | tr -d ' ')"
            test "$entries" = "$EXPECTED_CUSTOMER_ENTRY_COUNT"
            printf '%s\n' "$names" | grep -Fxq 'd1-migrations/0007_add_license_state.sql'
            printf '%s\n' "$names" | grep -Fxq 'src/server/services/license.service.ts'
            if printf '%s\n' "$names" | grep -Eq '^(control-plane/|package-plans/|docs/superpowers/|d1-migrations-through-0006/|wrangler\.task2-|\.env$|\.dev\.vars$|tests/license-state-migration\.test\.mjs$|tests/license-state-service\.test\.ts$|tests/license-state-backup-boundary\.test\.mjs$)'; then
              echo "Forbidden closure artifact in $dst" >&2
              printf '%s\n' "$names" | grep -E '^(control-plane/|package-plans/|docs/superpowers/|d1-migrations-through-0006/|wrangler\.task2-|\.env$|\.dev\.vars$|tests/license-state-)'
              exit 61
            fi
            if printf '%s\n' "$names" | grep -Eq '^d1-migrations/(000[8-9]|00[1-9][0-9])'; then
              echo "Migration after 0007 in $dst" >&2
              exit 62
            fi
            tmp="$(mktemp -d)"
            unzip -q "$dst" -d "$tmp"
            if grep -RIl --exclude='*.zip' 'LICENSE_SIGNING_PRIVATE_KEY' "$tmp" | grep -q .; then
              echo "Signing private secret identifier leaked in $dst" >&2
              rm -rf "$tmp"
              exit 63
            fi
            grep -Fq "'license_state'" "$tmp/src/server/services/backup.service.ts"
            migration_sha="$(sha256sum "$tmp/d1-migrations/0007_add_license_state.sql" | awk '{print $1}')"
            service_sha="$(sha256sum "$tmp/src/server/services/license.service.ts" | awk '{print $1}')"
            if [ -z "$expected_migration_sha" ]; then
              expected_migration_sha="$migration_sha"
              expected_service_sha="$service_sha"
            else
              test "$migration_sha" = "$expected_migration_sha"
              test "$service_sha" = "$expected_service_sha"
            fi
            rm -rf "$tmp"
          done
          cp dorm-management-system-master-v16-task2-REVIEW-V2.zip v16-task2-review-v2/
          sha256sum v16-task2-review-v2/*.zip | tee V16_TASK2_REVIEW_V2_SHA256.txt
          cat > V16_TASK2_CLOSURE_V2_EVIDENCE.txt <<EOF
          base_artifact_id=${BASE_ARTIFACT_ID}
          base_artifact_sha256=${BASE_ARTIFACT_SHA256}
          base_master_sha256=${BASE_MASTER_SHA256}
          blocked_run_id=${BLOCKED_RUN_ID}
          blocked_artifact_id=${BLOCKED_ARTIFACT_ID}
          source_sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          migration_ceiling=${POST_MIGRATION_CEILING}
          migration_sha256=${expected_migration_sha}
          license_service_sha256=${expected_service_sha}
          package_entry_count=${EXPECTED_CUSTOMER_ENTRY_COUNT}
          customer_ready=false
          release_status=REVIEW
          closure_version=2
          EOF

      - name: Upload clean V16 Task 2 REVIEW V2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v16-task2-license-state-review-v2
          path: |
            v16-task2-review-v2/**
            V16_TASK2_REVIEW_V2_SHA256.txt
            V16_TASK2_CLOSURE_V2_EVIDENCE.txt
            v16-task2-v2-red-portable.log
            v16-task2-v2-red-service.log
            v16-task2-v2-focused-portable-green.log
            v16-task2-v2-focused-service-green.log
            task2-v2-fresh-schema.json
            task2-v2-fresh-count.json
            task2-v2-upgrade-settings.json
            task2-v2-upgrade-room.json
            task2-v2-upgrade-count.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist Task 2 closure V2 evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-task2-evidence
          cat > v16-task2-evidence/task2-closure-v2-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          base_artifact_id=${BASE_ARTIFACT_ID}
          base_artifact_sha256=${BASE_ARTIFACT_SHA256}
          base_master_sha256=${BASE_MASTER_SHA256}
          blocked_run_id=${BLOCKED_RUN_ID}
          blocked_artifact_id=${BLOCKED_ARTIFACT_ID}
          migration_ceiling=${POST_MIGRATION_CEILING}
          expected_customer_entry_count=${EXPECTED_CUSTOMER_ENTRY_COUNT}
          customer_ready=false
          closure_version=2
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-task2-evidence/task2-closure-v2-latest.txt
          git commit -m 'ci(v16-task2): record closure v2 evidence' || exit 0
          git push origin HEAD:agent/v16-task2-license-state-bootstrap
