name: V15 Task 6 Cloudflare Browser Export Smoke

on:
  workflow_dispatch:
  push:
    branches: [agent/v15-task1-white-label-contract]
    paths: ['.github/workflows/v15-task6-cloudflare-browser-export-smoke.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: v15-task6-cloudflare-browser-export-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ARTIFACT_ID: '9315194299'
  SOURCE_ARTIFACT_SHA256: 'f0bec7ca2f263938df722e9eca3d0fa7a649beee09191dc14dea15bc6d11447c'
  SOURCE_ARTIFACT_DIGEST: 'sha256:f0bec7ca2f263938df722e9eca3d0fa7a649beee09191dc14dea15bc6d11447c'
  PRO_ZIP_SHA256: '6b37ff8db9ba2cf501723ec9543c951f9def366fae9cb339c260b41fa692f121'
  DEMO_ZIP_SHA256: '4dac28793ad338c8cfe16c9adeb240cda7d928c1627b1bd092c7957840dacd2c'
  BROWSER_HARNESS_BLOB: 'c4455a9d1f765c9198958a1820d358c130e8f7d4'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-task1-white-label-contract

      - name: Verify harness and Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(git hash-object v15-task6/browser-export-smoke.mjs)" = "$BROWSER_HARNESS_BLOB"
          node --check v15-task6/browser-export-smoke.mjs

      - name: Download and verify immutable Task 6 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o candidate.zip
          echo "$SOURCE_ARTIFACT_SHA256  candidate.zip" | sha256sum --check --strict
          rm -rf candidate-artifact pro-work demo-work
          mkdir candidate-artifact
          unzip -q candidate.zip -d candidate-artifact
          (cd candidate-artifact && sha256sum --check --strict MASTER_V15_TASK6_CI_SHA256.txt)
          (cd candidate-artifact && sha256sum --check --strict work/V15_TASK6_CANDIDATE_SHA256.txt)
          PRO_ZIP="candidate-artifact/work/release-v15-task6/dorm-management-system-pro-v15-TASK6-CANDIDATE.zip"
          DEMO_ZIP="candidate-artifact/work/release-v15-task6/dorm-management-system-demo-v15-TASK6-CANDIDATE.zip"
          echo "$PRO_ZIP_SHA256  $PRO_ZIP" | sha256sum --check --strict
          echo "$DEMO_ZIP_SHA256  $DEMO_ZIP" | sha256sum --check --strict
          mkdir pro-work demo-work
          unzip -q "$PRO_ZIP" -d pro-work
          unzip -q "$DEMO_ZIP" -d demo-work
          for d in pro-work demo-work; do
            grep -Fq 'resolveBillBrandingSnapshot' "$d/src/components/BillInvoice.tsx"
            grep -Fq 'toJpeg(printAreaRef.current' "$d/src/components/BillInvoice.tsx"
            grep -Fq 'border: 2.5px solid ${branding.brandColor}' "$d/src/components/BillInvoice.tsx"
            grep -Fq 'whiteLabelEnabled ? cleanOptional' "$d/src/utils/billBranding.ts"
            ! grep -Eiq '#166534|#DCFCE7|#bbf7d0|#86efac|#22c55e|#16a34a|#15803d|#dcfce7|#f0fdf4' "$d/src/components/BillInvoice.tsx"
            test "$(find "$d/d1-migrations" -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = '0006_add_white_label_settings.sql'
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install candidate dependencies
        run: |
          (cd pro-work && npm ci)
          (cd demo-work && npm ci)

      - name: Allocate temporary Cloudflare resources
        shell: bash
        run: |
          set -euo pipefail
          P="$(printf '%s' "$GITHUB_RUN_ID" | tr -cd '0-9' | tail -c 10)-${GITHUB_RUN_ATTEMPT}"
          echo "RUN_MARKER=$P" >> "$GITHUB_ENV"
          echo "PRO_PAGES=v15-t6-pro-${P}" >> "$GITHUB_ENV"
          echo "PRO_D1=v15-t6-pro-${P}-db" >> "$GITHUB_ENV"
          echo "DEMO_PAGES=v15-t6-demo-${P}" >> "$GITHUB_ENV"
          echo "DEMO_D1=v15-t6-demo-${P}-db" >> "$GITHUB_ENV"

      - name: Create D1 and render configs
        shell: bash
        run: |
          set -euo pipefail
          (cd pro-work && npx wrangler d1 create "$PRO_D1" --location apac && npx wrangler d1 info "$PRO_D1" --json > ../pro-d1.json)
          (cd demo-work && npx wrangler d1 create "$DEMO_D1" --location apac && npx wrangler d1 info "$DEMO_D1" --json > ../demo-d1.json)
          python3 - <<'PY'
          import importlib.util, os, sys
          from pathlib import Path
          def load(path,name):
              s=importlib.util.spec_from_file_location(name,Path(path)); m=importlib.util.module_from_spec(s); sys.modules[name]=m; s.loader.exec_module(m); return m
          h=load('.github/scripts/v14_task12_d1_smoke.py','h6'); c=load('.github/scripts/v14_task12_wrangler_config.py','c6')
          for p,d,i in [('PRO',Path('pro-work'),Path('pro-d1.json')),('DEMO',Path('demo-work'),Path('demo-d1.json'))]:
              x=h.parse_wrangler_json(i.read_text()); x=x[0] if isinstance(x,list) else x
              uid=x.get('uuid') or x.get('id') or x.get('database_id'); assert uid
              text=c.build_wrangler_config((d/'wrangler.template.jsonc').read_text(),os.environ[p+'_PAGES'],os.environ[p+'_D1'],str(uid))
              (d/'wrangler.jsonc').write_text(text)
          PY

      - name: Create Pages secrets and migrate
        shell: bash
        run: |
          set -euo pipefail
          (cd pro-work && npx wrangler pages project create "$PRO_PAGES" --production-branch main)
          (cd demo-work && npx wrangler pages project create "$DEMO_PAGES" --production-branch main)
          S1="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"; S2="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"
          printf '%s\n' "$S1" | (cd pro-work && npx wrangler pages secret put JWT_SECRET --project-name "$PRO_PAGES")
          printf '%s\n' "$S2" | (cd demo-work && npx wrangler pages secret put JWT_SECRET --project-name "$DEMO_PAGES")
          unset S1 S2
          (cd pro-work && npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd demo-work && npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)

      - name: Build and deploy candidates
        shell: bash
        run: |
          set -euo pipefail
          (cd pro-work && npm run build:pages)
          (cd pro-work && npx wrangler pages deploy dist --project-name "$PRO_PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true) | tee pro-deploy.log
          (cd demo-work && npm run build:pages)
          (cd demo-work && npx wrangler pages deploy dist --project-name "$DEMO_PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true) | tee demo-deploy.log
          PRO_DEPLOY_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' pro-deploy.log | tail -n1)"
          DEMO_DEPLOY_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' demo-deploy.log | tail -n1)"
          test -n "$PRO_DEPLOY_URL" && test -n "$DEMO_DEPLOY_URL"
          case "$PRO_DEPLOY_URL" in https://*.$PRO_PAGES.pages.dev) ;; *) echo "unexpected Pro deployment URL: $PRO_DEPLOY_URL" >&2; exit 1;; esac
          case "$DEMO_DEPLOY_URL" in https://*.$DEMO_PAGES.pages.dev) ;; *) echo "unexpected Demo deployment URL: $DEMO_DEPLOY_URL" >&2; exit 1;; esac
          echo "PRO_URL=$PRO_DEPLOY_URL" >> "$GITHUB_ENV"
          echo "DEMO_URL=$DEMO_DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Wait for Pages edge readiness
        shell: bash
        run: |
          set -euo pipefail
          wait_ready() {
            local label="$1" url="$2"
            for attempt in $(seq 1 70); do
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$url/" -o /dev/null; then
                echo "$label deployment ready on attempt $attempt: $url"
                return 0
              fi
              sleep 2
            done
            echo "$label deployment never became TLS/HTTP ready: $url" >&2
            return 1
          }
          wait_ready Pro "$PRO_URL"
          wait_ready Demo "$DEMO_URL"

      - name: Create real Pro and Demo owners and verify login
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p=os.environ['RUN_MARKER']
          cases={
            'pro': {'email':f'v15-task6-pro-{p}@example.invalid','password':f'V15T6!ProAa12345{p[-2:]}','displayName':'V15 Task 6 Pro Smoke','dormName':'Task 6 Pro Dorm'},
            'demo':{'email':f'v15-task6-demo-{p}@example.invalid','password':f'V15T6!DemoAa12345{p[-2:]}','displayName':'V15 Task 6 Demo Smoke','dormName':'Task 6 Demo Dorm'},
          }
          for name,data in cases.items():
            open(f'{name}-setup-request.json','w').write(json.dumps(data))
            open(f'{name}-login-request.json','w').write(json.dumps({'username':data['email'],'password':data['password']}))
          PY
          for kind in pro demo; do
            urlvar="${kind^^}_URL"; url="${!urlvar}"
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 -H 'Content-Type: application/json' --data "@$kind-setup-request.json" "$url/api/setup/init" > "$kind-setup.json"
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 -H 'Content-Type: application/json' --data "@$kind-login-request.json" "$url/api/auth/login" > "$kind-login.json"
          done
          python3 - <<'PY'
          import json
          for kind in ('pro','demo'):
            setup=json.load(open(f'{kind}-setup.json')); login=json.load(open(f'{kind}-login.json'))
            sd=setup.get('data',setup); ld=login.get('data',login)
            assert isinstance(sd.get('user'),dict) and sd.get('token')
            assert isinstance(ld.get('user'),dict) and ld.get('token')
            assert int(sd['user']['id']) == int(ld['user']['id'])
            open(f'{kind}-owner.txt','w').write(str(sd['user']['id']))
            open(f'{kind}-user.json','w').write(json.dumps(ld['user']))
            open(f'{kind}-token.txt','w').write(str(ld['token']))
          PY

      - name: Set deterministic effective and dormant bill branding
        shell: bash
        run: |
          set -euo pipefail
          PRO_OWNER="$(cat pro-owner.txt)"; DEMO_OWNER="$(cat demo-owner.txt)"
          (cd pro-work && npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE settings SET subscription_plan='pro', dorm_name='Task 6 Pro Dorm', brand_color='#6D28D9', contact_phone='0812345678', bill_footer='Task 6 Pro Footer' WHERE user_id=${PRO_OWNER};")
          (cd demo-work && npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE settings SET dorm_name='Task 6 Demo Dorm', brand_color='#DC2626', contact_phone='0899999999', bill_footer='Task 6 Hidden Demo Footer' WHERE user_id=${DEMO_OWNER};")
          python3 - <<'PY'
          import json
          logo='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z0XcAAAAASUVORK5CYII='
          open('pro-logo.json','w').write(json.dumps({'logoDataUri':logo}))
          PY
          PRO_TOKEN="$(cat pro-token.txt)"
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $PRO_TOKEN" -H 'Content-Type: application/json' --data @pro-logo.json "$PRO_URL/api/settings/logo" > /dev/null
          curl --fail --silent --show-error "$PRO_URL/api/public/branding" > pro-branding.json
          curl --fail --silent --show-error "$DEMO_URL/api/public/branding" > demo-branding.json
          python3 - <<'PY'
          import json
          p=json.load(open('pro-branding.json')); d=json.load(open('demo-branding.json'))
          assert p['dormName']=='Task 6 Pro Dorm'
          assert p['brandColor']=='#6D28D9' and p['contactPhone']=='0812345678' and p['whiteLabelEnabled'] is True and str(p.get('logoDataUri','')).startswith('data:image/png;base64,')
          assert d['dormName']=='Task 6 Demo Dorm'
          assert d['brandColor'] is None and d['contactPhone'] is None and d['logoDataUri'] is None and d['whiteLabelEnabled'] is False
          PY

      - name: Create real rooms and bills through API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for kind, room in [('pro','T6-PRO-101'),('demo','T6-DEMO-101')]:
            open(f'{kind}-room-request.json','w').write(json.dumps({'roomNumber':room,'monthlyRent':4500,'status':'occupied','tenantName':'Task 6 Tenant','tenantPhone':'0800000000'}))
          PY
          for kind in pro demo; do
            urlvar="${kind^^}_URL"; url="${!urlvar}"; token="$(cat $kind-token.txt)"
            curl --fail --silent --show-error -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data "@$kind-room-request.json" "$url/api/rooms" > "$kind-room.json"
          done
          python3 - <<'PY'
          import json
          for kind in ('pro','demo'):
            room=json.load(open(f'{kind}-room.json')); rd=room.get('data',room); rid=int(rd['id'])
            bill={'roomId':rid,'billMonth':'2026-08','priorElec':100,'currentElec':110,'elecDeduct':0,'elecUnitCost':7,'priorWater':50,'currentWater':55,'waterUnitCost':13,'rentCost':4500,'depositCost':0,'otherCost':200,'otherDescription':'ค่าบริการ Task 6','dueDate':'2026-08-25','status':'unpaid'}
            open(f'{kind}-bill-request.json','w').write(json.dumps(bill,ensure_ascii=False))
          PY
          for kind in pro demo; do
            urlvar="${kind^^}_URL"; url="${!urlvar}"; token="$(cat $kind-token.txt)"
            curl --fail --silent --show-error -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data "@$kind-bill-request.json" "$url/api/bills" > "$kind-bill.json"
            curl --fail --silent --show-error -H "Authorization: Bearer $token" "$url/api/bills" > "$kind-bills.json"
          done
          python3 - <<'PY'
          import json
          for kind in ('pro','demo'):
            created=json.load(open(f'{kind}-bill.json')); cd=created.get('data',created); assert int(cd['id'])>0
            bills=json.load(open(f'{kind}-bills.json')); bd=bills.get('data',bills); assert isinstance(bd,list) and len(bd)==1
            assert bd[0]['billMonth']=='2026-08' and bd[0]['otherCost']==200
          PY

      - name: Browser and export smoke Pro bill
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ env.PRO_URL }}
          SMOKE_EXPECTED_DORM: Task 6 Pro Dorm
          SMOKE_EXPECTED_COLOR: '#6D28D9'
          SMOKE_EXPECTED_FOOTER: Task 6 Pro Footer
          SMOKE_EXPECTED_PHONE: '0812345678'
          SMOKE_EXPECT_PAID_IDENTITY: 'true'
          SMOKE_USER_JSON: ${{ github.workspace }}/pro-user.json
          SMOKE_TOKEN_FILE: ${{ github.workspace }}/pro-token.txt
          SMOKE_OUTPUT: ${{ github.workspace }}/pro-browser-export.json
        run: |
          set -euo pipefail
          C="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$C"
          CHROME_BIN="$C" node v15-task6/browser-export-smoke.mjs

      - name: Browser and export smoke Demo masking
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ env.DEMO_URL }}
          SMOKE_EXPECTED_DORM: Task 6 Demo Dorm
          SMOKE_EXPECTED_COLOR: '#1DB954'
          SMOKE_EXPECT_PAID_IDENTITY: 'false'
          SMOKE_HIDDEN_FOOTER: Task 6 Hidden Demo Footer
          SMOKE_HIDDEN_PHONE: '0899999999'
          SMOKE_USER_JSON: ${{ github.workspace }}/demo-user.json
          SMOKE_TOKEN_FILE: ${{ github.workspace }}/demo-token.txt
          SMOKE_OUTPUT: ${{ github.workspace }}/demo-browser-export.json
        run: |
          set -euo pipefail
          C="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$C"
          CHROME_BIN="$C" node v15-task6/browser-export-smoke.mjs

      - name: Cleanup temporary Cloudflare resources
        if: always()
        shell: bash
        run: |
          set +e
          A=99;B=99;C=99;D=99
          [ -d pro-work ] && [ -n "${PRO_PAGES:-}" ] && (cd pro-work && npx wrangler pages project delete "$PRO_PAGES" --yes); A=$?
          [ -d pro-work ] && [ -n "${PRO_D1:-}" ] && (cd pro-work && npx wrangler d1 delete "$PRO_D1" --skip-confirmation); B=$?
          [ -d demo-work ] && [ -n "${DEMO_PAGES:-}" ] && (cd demo-work && npx wrangler pages project delete "$DEMO_PAGES" --yes); C=$?
          [ -d demo-work ] && [ -n "${DEMO_D1:-}" ] && (cd demo-work && npx wrangler d1 delete "$DEMO_D1" --skip-confirmation); D=$?
          printf '{"proPagesExit":%s,"proD1Exit":%s,"demoPagesExit":%s,"demoD1Exit":%s}\n' "$A" "$B" "$C" "$D" > cleanup-evidence.json
          rm -f pro-token.txt demo-token.txt pro-user.json demo-user.json pro-logo.json *-setup-request.json *-login-request.json *-setup.json *-login.json *-owner.txt *-room-request.json *-room.json *-bill-request.json *-bill.json *-bills.json

      - name: Upload Task 6 browser export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-task6-cloudflare-browser-export-evidence
          path: |
            pro-branding.json
            demo-branding.json
            pro-browser-export.json
            demo-browser-export.json
            cleanup-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Assert Task 6 browser export smoke and cleanup
        id: assert_smoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('pro-browser-export.json')); d=json.load(open('demo-browser-export.json'))
          for name,x in [('pro',p),('demo',d)]:
              assert x.get('overallPass') is True, (name,x)
              assert x['jpg']['mimeOk'] and x['jpg']['length'] > 1000 and x['jpg']['buttonRecovered'], name
              assert x['print']['called'] and x['print']['containsExpectedColor'] and x['print']['exactColorAdjust'], name
              assert x['invoice']['semanticAmber'] and x['invoice']['semanticBlue'] and x['invoice']['semanticPurple'], name
          assert p['invoice']['logoVisible'] and p['invoice']['hasFooter'] and p['invoice']['hasPhone']
          assert p['logoFallback']['exercised'] and p['logoFallback']['fallbackVisible']
          assert not d['invoice']['logoVisible'] and not d['invoice']['leakedFooter'] and not d['invoice']['leakedPhone']
          c=json.load(open('cleanup-evidence.json')); assert all(c[k]==0 for k in c), c
          PY

      - name: Persist Task 6 Cloudflare browser export evidence pointer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v15-task6-evidence
          cat > v15-task6-evidence/cloudflare-browser-export-latest.txt <<EOF
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          source_sha=$GITHUB_SHA
          source_artifact_id=$SOURCE_ARTIFACT_ID
          source_artifact_digest=$SOURCE_ARTIFACT_DIGEST
          assert_smoke=${{ steps.assert_smoke.outcome }}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v15-task6-evidence/cloudflare-browser-export-latest.txt
          git commit -m 'ci(v15-task6): record Cloudflare browser export evidence' || exit 0
          git push origin HEAD:agent/v15-task1-white-label-contract
