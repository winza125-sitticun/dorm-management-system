name: V16 Production Source Package Closure V22
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-source-package-closure-v22.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-source-package-closure-v22, cancel-in-progress: true }
env:
  V13_ARTIFACT_ID: '9391068149'
  V13_ARTIFACT_SHA256: '14e094a00c75bf0b538df4b0d396264c3af28f53b96a95d379e01390005e72ff'
  FIX8_SHA256: '18a99d7c8a276a533dce552720ab787713bc9384cb4d6b378e877168784d411d'
  SIGNING_PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  SIGNING_PUBLIC_KEY_FINGERPRINT: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  CONTROL_PLANE_URL: 'https://dorm-control-plane.winza125.workers.dev'
  MIGRATION_CEILING: '0007_add_license_state.sql'
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Reconstruct exact V13 and apply Fix 8
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/v16-v22-*.ok
          echo "$FIX8_SHA256  v16-production-input/V16_PRODUCTION_FIX_8_EXPLICIT_REFRESH_FAIL_CLOSED.patch" | sha256sum -c -
          rm -rf /tmp/v13 /tmp/work /tmp/control-plane; mkdir -p /tmp/v13 /tmp/work /tmp/control-plane
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V13_ARTIFACT_ID}/zip" -o /tmp/v13.zip
          echo "$V13_ARTIFACT_SHA256  /tmp/v13.zip" | sha256sum -c -
          unzip -q /tmp/v13.zip -d /tmp/v13
          (cd /tmp/v13 && sha256sum -c SHA256SUMS.txt)
          unzip -q /tmp/v13/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED-V13.zip -d /tmp/work
          unzip -q /tmp/v13/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip -d /tmp/control-plane
          (cd /tmp/work && patch --dry-run -p1 < "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_8_EXPLICIT_REFRESH_FAIL_CLOSED.patch" && patch -p1 < "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_8_EXPLICIT_REFRESH_FAIL_CLOSED.patch")
          test "$(find /tmp/work/d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
          test ! -e /tmp/work/control-plane
          touch /tmp/v16-v22-reconstruct.ok
      - name: Regression proof
        working-directory: /tmp/work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/server/services/license.service.ts').read_text(); a=s.index('export async function refreshCustomerLicense'); b=s.index('export async function deactivateCustomerLicense',a); r=s[a:b]
          definitive="['INVALID_TOKEN', 'LICENSE_INVALID', 'LICENSE_INACTIVE', 'LICENSE_EXPIRED', 'ACTIVATION_REVOKED']"
          assert definitive in r
          assert "UPDATE license_state SET status = ?, effective_plan = NULL" in r
          assert "const nextStatus = error.code === 'LICENSE_EXPIRED' ? 'expired' : 'revoked';" in r
          assert r.index(definitive) < r.index("error.code !== 'CONTROL_PLANE_UNAVAILABLE'")
          assert 'throw error;' in r
          route=Path('functions/api/[[path]].ts').read_text()
          assert "path === '/api/license/refresh'" in route and 'refreshCustomerLicense(env' in route
          assert 'if (e instanceof PlanAccessError || e instanceof LicenseOperationError) throw e;' in route
          PY
          touch /tmp/v16-v22-regression.ok
      - name: Customer audit tests types builds
        working-directory: /tmp/work
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --json > /tmp/v22-audit.json 2>/tmp/v22-audit.err || true
          node - <<'NODE'
          const a=require('/tmp/v22-audit.json'),v=a.metadata?.vulnerabilities||{}; console.log(`audit low=${v.low||0} moderate=${v.moderate||0} high=${v.high||0} critical=${v.critical||0} total=${v.total||0}`); if((v.high||0)!==0||(v.critical||0)!==0) process.exit(1);
          NODE
          touch /tmp/v16-v22-audit.ok
          npm test
          npm run lint
          npm run check:cloudflare-types:master
          npm run build:pages
          npm run build:vps
          touch /tmp/v16-v22-customer.ok
      - name: Generate and verify customer packages
        working-directory: /tmp/work
        env:
          V16_LICENSE_SIGNING_PUBLIC_KEY: '${{ env.SIGNING_PUBLIC_KEY_B64 }}'
          V16_LICENSE_CONTROL_PLANE_URL: '${{ env.CONTROL_PLANE_URL }}'
        shell: bash
        run: |
          set -euo pipefail
          npm run packages:generate
          for plan in demo basic standard pro; do
            z="preview-v14/dorm-management-system-${plan}-v14-PREVIEW.zip"; test -f "$z"; unzip -t "$z" >/dev/null
            tmp="$(mktemp -d)"; unzip -q "$z" -d "$tmp"
            test "$(find "$tmp/d1-migrations" -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
            test ! -e "$tmp/control-plane"
            ! grep -RIl --exclude='*.zip' 'LICENSE_SIGNING_PRIVATE_KEY' "$tmp" | grep -q .
            grep -Fq "UPDATE license_state SET status = ?, effective_plan = NULL" "$tmp/src/server/services/license.service.ts"
            grep -Fq "['INVALID_TOKEN', 'LICENSE_INVALID', 'LICENSE_INACTIVE', 'LICENSE_EXPIRED', 'ACTIVATION_REVOKED']" "$tmp/src/server/services/license.service.ts"
            rm -rf "$tmp"
          done
          touch /tmp/v16-v22-packages.ok
      - name: Control Plane tests and typecheck
        working-directory: /tmp/control-plane
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run typecheck
          touch /tmp/v16-v22-control-plane.ok
      - name: Private material scans
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist-server 'LICENSE_SIGNING_PRIVATE_KEY' /tmp/work | grep -q .
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist-server 'BEGIN PRIVATE KEY' /tmp/work | grep -q .
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules 'BEGIN PRIVATE KEY' /tmp/control-plane | grep -q .
          touch /tmp/v16-v22-private.ok
      - name: Freeze V22 candidate
        shell: bash
        run: |
          set -euo pipefail
          for m in reconstruct regression audit customer packages control-plane private; do test -f "/tmp/v16-v22-${m}.ok"; done
          rm -rf v16-production-source-package-v22; mkdir -p v16-production-source-package-v22/customer-previews
          (cd /tmp/work && zip -qr "$GITHUB_WORKSPACE/v16-production-source-package-v22/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED-V22.zip" . -x 'node_modules/*' 'dist/*' 'dist-server/*' 'preview-v14/*' 'release-v14/*')
          (cd /tmp/control-plane && zip -qr "$GITHUB_WORKSPACE/v16-production-source-package-v22/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" . -x 'node_modules/*')
          for p in demo basic standard pro; do cp "/tmp/work/preview-v14/dorm-management-system-${p}-v14-PREVIEW.zip" "v16-production-source-package-v22/customer-previews/dorm-management-system-${p}-v16-SOURCE-GATE-V22.zip"; done
          cp v16-production-input/V16_PRODUCTION_FIX_8_EXPLICIT_REFRESH_FAIL_CLOSED.patch v16-production-source-package-v22/
          find /tmp/work -type f ! -path '/tmp/work/node_modules/*' ! -path '/tmp/work/dist/*' ! -path '/tmp/work/dist-server/*' ! -path '/tmp/work/preview-v14/*' ! -path '/tmp/work/release-v14/*' -print0 | sort -z | xargs -0 sha256sum > v16-production-source-package-v22/V16_FINAL_CUSTOMER_SOURCE_TREE_SHA256.txt
          find /tmp/control-plane -type f ! -path '/tmp/control-plane/node_modules/*' -print0 | sort -z | xargs -0 sha256sum > v16-production-source-package-v22/V16_FINAL_CONTROL_PLANE_TREE_SHA256.txt
          (cd v16-production-source-package-v22 && sha256sum *.zip customer-previews/*.zip > SHA256SUMS.txt)
          touch /tmp/v16-v22-freeze.ok
      - uses: actions/upload-artifact@v4
        with: { name: v16-production-source-package-v22, path: 'v16-production-source-package-v22/**', if-no-files-found: error, retention-days: 14 }
      - name: Persist fail-safe evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          val(){ if [ -f "/tmp/v16-v22-$1.ok" ]; then printf success; else printf failure; fi; }
          audit=unavailable; if [ -s /tmp/v22-audit.json ]; then audit="$(node -e "const a=require('/tmp/v22-audit.json'),v=a.metadata?.vulnerabilities||{};process.stdout.write('low='+(v.low||0)+' moderate='+(v.moderate||0)+' high='+(v.high||0)+' critical='+(v.critical||0)+' total='+(v.total||0))")"; fi
          cat > v16-production-evidence/source-package-v22-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          reconstruct=$(val reconstruct)
          explicit_refresh_failclosed_regression=$(val regression)
          dependency_audit=$(val audit)
          audit_counts=${audit}
          customer_tests_types_builds=$(val customer)
          four_packages=$(val packages)
          control_plane_tests_typecheck=$(val control-plane)
          private_material_scan=$(val private)
          artifact_freeze=$(val freeze)
          source_v13_artifact_id=${V13_ARTIFACT_ID}
          source_v13_artifact_sha256=${V13_ARTIFACT_SHA256}
          fix8_sha256=${FIX8_SHA256}
          signing_public_key_fingerprint=${SIGNING_PUBLIC_KEY_FINGERPRINT}
          control_plane_url=${CONTROL_PLANE_URL}
          migration_ceiling=${MIGRATION_CEILING}
          cloudflare_touched=false
          existing_d1_touched=false
          customer_ready=false
          deployed=false
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/source-package-v22-latest.txt
          git commit -m 'ci(v16): record source package closure v22' || exit 0
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate
