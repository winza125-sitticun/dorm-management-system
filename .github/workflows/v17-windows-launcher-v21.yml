name: V17 Windows Setup Update Launcher Gate V21
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v17-windows-launcher-v21.yml']
permissions: { contents: write, actions: read }
env:
  V17_ARTIFACT_ID: '9394092671'
  V17_ARTIFACT_SHA256: '0503ec400e7e52e7e9a23723155aa2eebbc3e64f8ead898cc49b9a9968f63ad3'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Download and verify exact V17 artifact on Windows
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Headers @{Authorization="Bearer $env:GH_TOKEN"} -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:V17_ARTIFACT_ID/zip" -OutFile "$env:RUNNER_TEMP\v17.zip"
          $h=(Get-FileHash "$env:RUNNER_TEMP\v17.zip" -Algorithm SHA256).Hash.ToLower()
          if($h -ne $env:V17_ARTIFACT_SHA256){ throw "outer sha mismatch $h" }
          $root="$env:RUNNER_TEMP\v17";New-Item -ItemType Directory -Force $root|Out-Null;Expand-Archive "$env:RUNNER_TEMP\v17.zip" $root
          $sum=Get-ChildItem $root -Recurse -Filter SHA256SUMS.txt|Select-Object -First 1;if(-not $sum){throw 'SHA256SUMS missing'}
          $base=$sum.Directory.FullName
          foreach($line in Get-Content $sum.FullName){if($line -match '^([0-9a-f]{64})\s+(.+)$'){$expect=$matches[1];$rel=$matches[2].Replace('/','\');$f=Join-Path $base $rel;$got=(Get-FileHash $f -Algorithm SHA256).Hash.ToLower();if($got -ne $expect){throw "inner sha mismatch $rel"}}}
          $pro=Join-Path $base 'customer-packages\dorm-management-system-pro-v17-CUSTOMER-READY-CANDIDATE.zip';$proDir="$env:RUNNER_TEMP\pro";Expand-Archive $pro $proDir
          Copy-Item (Join-Path $base 'BOOTSTRAP-V16-TO-V17.mjs') $proDir -Force
          Copy-Item (Join-Path $base 'BOOTSTRAP-V16-TO-V17-WINDOWS.cmd') $proDir -Force
          "V17_BASE=$base"|Out-File -Append $env:GITHUB_ENV
          "PRO_DIR=$proDir"|Out-File -Append $env:GITHUB_ENV
          New-Item "$env:RUNNER_TEMP\v21-exact.ok" -ItemType File|Out-Null
      - name: Execute Windows launchers with controlled node shim
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $shim="$env:RUNNER_TEMP\shim";New-Item -ItemType Directory -Force $shim|Out-Null
          @'
          @echo off
          echo %*>>"%RUNNER_TEMP%\node-calls.txt"
          exit /b 37
          '@ | Set-Content -Encoding ascii "$shim\node.cmd"
          $old=$env:PATH;$env:PATH="$shim;$old"
          $boot=Join-Path $env:PRO_DIR 'BOOTSTRAP-V16-TO-V17-WINDOWS.cmd'
          $update=Join-Path $env:PRO_DIR 'UPDATE-WINDOWS.cmd'
          if(-not (Test-Path $boot)){throw 'bootstrap launcher missing'};if(-not (Test-Path $update)){throw 'update launcher missing'}
          cmd /d /c "echo.|`"$boot`""; $b=$LASTEXITCODE
          cmd /d /c "echo.|`"$update`""; $u=$LASTEXITCODE
          if($b -ne 37){throw "bootstrap did not propagate node exit: $b"};if($u -ne 37){throw "update did not propagate node exit: $u"}
          $calls=Get-Content "$env:RUNNER_TEMP\node-calls.txt" -Raw
          if($calls -notmatch 'BOOTSTRAP-V16-TO-V17\.mjs'){throw 'bootstrap did not invoke mjs'}
          if($calls -notmatch 'UPDATE-PACKAGE\.mjs'){throw 'update did not invoke mjs'}
          $bootText=Get-Content $boot -Raw;$updateText=Get-Content $update -Raw
          foreach($t in @($bootText,$updateText)){if($t -notmatch 'cd /d "%~dp0"'){throw 'launcher does not pin working directory'};if($t -notmatch 'exit /b %EXIT_CODE%'){throw 'launcher does not propagate exit'} }
          New-Item "$env:RUNNER_TEMP\v21-runtime.ok" -ItemType File|Out-Null
      - name: Persist Windows evidence
        if: always()
        shell: pwsh
        env: { JOB_STATUS: '${{ job.status }}' }
        run: |
          $exact=if(Test-Path "$env:RUNNER_TEMP\v21-exact.ok"){'success'}else{'failure'}
          $runtime=if(Test-Path "$env:RUNNER_TEMP\v21-runtime.ok"){'success'}else{'failure'}
          New-Item -ItemType Directory -Force 'v17-production-evidence'|Out-Null
          @"
          run_id=$env:GITHUB_RUN_ID
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          source_sha=$env:GITHUB_SHA
          job_status=$env:JOB_STATUS
          v17_artifact_id=$env:V17_ARTIFACT_ID
          v17_artifact_sha256=$env:V17_ARTIFACT_SHA256
          exact_artifact_windows=$exact
          bootstrap_windows_runtime=$runtime
          update_windows_runtime=$runtime
          working_directory_guard=$runtime
          exit_code_propagation=$runtime
          cloudflare_touched=false
          existing_customer_d1_touched=false
          v17_customer_ready=false
          "@.Trim() | Set-Content 'v17-production-evidence/windows-launcher-v21-latest.txt'
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add v17-production-evidence/windows-launcher-v21-latest.txt;git commit -m 'ci(v17): record Windows launcher v21 evidence';if($LASTEXITCODE -eq 0){git fetch origin agent/v16-production-gate;git rebase origin/agent/v16-production-gate;git push origin HEAD:agent/v16-production-gate}