name: V16 Production Source Package Closure V29
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-source-package-closure-v29.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-source-package-closure-v29, cancel-in-progress: true }
env:
  V23_ARTIFACT_ID: '9391746526'
  V23_ARTIFACT_SHA256: 'b42d10b2adf546eb2b9f44648ce6216c24551f9067d18b4e9586c0b150bb7d92'
  FIX9_SHA256: '3e85f7a683f9de66112f1652e52c979d85a4a3ad8431c531b86a550c2458cc7f'
  SIGNING_PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  SIGNING_PUBLIC_KEY_FINGERPRINT: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  CONTROL_PLANE_URL: 'https://dorm-control-plane.winza125.workers.dev'
  MIGRATION_CEILING: '0007_add_license_state.sql'
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Reconstruct exact V23 and apply Fix 9
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/v16-v29-*.ok
          echo "$FIX9_SHA256  v16-production-input/V16_PRODUCTION_FIX_9_TERMINAL_LICENSE_STATE_PRIORITY.patch" | sha256sum -c -
          rm -rf /tmp/v23 /tmp/work /tmp/control-plane; mkdir -p /tmp/v23 /tmp/work /tmp/control-plane
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V23_ARTIFACT_ID}/zip" -o /tmp/v23.zip
          echo "$V23_ARTIFACT_SHA256  /tmp/v23.zip" | sha256sum -c -
          unzip -q /tmp/v23.zip -d /tmp/v23
          (cd /tmp/v23 && sha256sum -c SHA256SUMS.txt)
          unzip -q /tmp/v23/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED-V23.zip -d /tmp/work
          unzip -q /tmp/v23/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip -d /tmp/control-plane
          (cd /tmp/work && patch --dry-run -p1 < "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_9_TERMINAL_LICENSE_STATE_PRIORITY.patch" && patch -p1 < "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_9_TERMINAL_LICENSE_STATE_PRIORITY.patch")
          test "$(find /tmp/work/d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
          touch /tmp/v16-v29-reconstruct.ok
      - name: Regression proof terminal-state priority and offline grace
        working-directory: /tmp/work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/server/services/license.service.ts').read_text()
          a=s.index('export async function resolveLicenseState'); b=s.index('export async function maybeRefreshCustomerLicense',a); r=s[a:b]
          guard="if (['revoked', 'expired', 'suspended'].includes(storedStatus))"
          verify='const payload = await verifySignedLicenseToken'
          assert guard in r and verify in r and r.index(guard) < r.index(verify)
          assert "storedStatus === 'offline'" in r
          assert "nowMs > graceUntilMs" in r
          a=s.index('export async function refreshCustomerLicense'); b=s.index('export async function deactivateCustomerLicense',a); rr=s[a:b]
          assert "['INVALID_TOKEN', 'LICENSE_INVALID', 'LICENSE_INACTIVE', 'LICENSE_EXPIRED', 'ACTIVATION_REVOKED']" in rr
          assert 'UPDATE license_state SET status = ?, effective_plan = NULL' in rr
          PY
          touch /tmp/v16-v29-regression.ok
      - name: Customer audit tests types builds
        working-directory: /tmp/work
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --json > /tmp/v29-audit.json 2>/tmp/v29-audit.err || true
          node - <<'NODE'
          const a=require('/tmp/v29-audit.json'),v=a.metadata?.vulnerabilities||{}; console.log(`audit low=${v.low||0} moderate=${v.moderate||0} high=${v.high||0} critical=${v.critical||0} total=${v.total||0}`); if((v.high||0)!==0||(v.critical||0)!==0) process.exit(1);
          NODE
          touch /tmp/v16-v29-audit.ok
          npm test
          npm run lint
          npm run check:cloudflare-types:master
          npm run build:pages
          npm run build:vps
          touch /tmp/v16-v29-customer.ok
      - name: Generate and verify four customer packages
        working-directory: /tmp/work
        env:
          V16_LICENSE_SIGNING_PUBLIC_KEY: '${{ env.SIGNING_PUBLIC_KEY_B64 }}'
          V16_LICENSE_CONTROL_PLANE_URL: '${{ env.CONTROL_PLANE_URL }}'
        shell: bash
        run: |
          set -euo pipefail
          npm run packages:generate
          for p in demo basic standard pro; do
            z="preview-v14/dorm-management-system-${p}-v14-PREVIEW.zip"; test -f "$z"; unzip -t "$z" >/dev/null
            d="$(mktemp -d)"; unzip -q "$z" -d "$d"
            test "$(find "$d/d1-migrations" -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
            grep -Fq "if (['revoked', 'expired', 'suspended'].includes(storedStatus))" "$d/src/server/services/license.service.ts"
            ! grep -RIl --exclude='*.zip' 'BEGIN PRIVATE KEY' "$d" | grep -q .
            rm -rf "$d"
          done
          touch /tmp/v16-v29-packages.ok
      - name: Control Plane tests and typecheck
        working-directory: /tmp/control-plane
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run typecheck
          touch /tmp/v16-v29-control-plane.ok
      - name: Private material scans
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist-server 'BEGIN PRIVATE KEY' /tmp/work | grep -q .
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules 'BEGIN PRIVATE KEY' /tmp/control-plane | grep -q .
          touch /tmp/v16-v29-private.ok
      - name: Freeze V29 candidate
        shell: bash
        run: |
          set -euo pipefail
          for x in reconstruct regression audit customer packages control-plane private; do test -f "/tmp/v16-v29-${x}.ok"; done
          rm -rf v16-production-source-package-v29; mkdir -p v16-production-source-package-v29/customer-previews
          (cd /tmp/work && zip -qr "$GITHUB_WORKSPACE/v16-production-source-package-v29/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED-V29.zip" . -x 'node_modules/*' 'dist/*' 'dist-server/*' 'preview-v14/*' 'release-v14/*')
          (cd /tmp/control-plane && zip -qr "$GITHUB_WORKSPACE/v16-production-source-package-v29/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" . -x 'node_modules/*')
          for p in demo basic standard pro; do cp "/tmp/work/preview-v14/dorm-management-system-${p}-v14-PREVIEW.zip" "v16-production-source-package-v29/customer-previews/dorm-management-system-${p}-v16-SOURCE-GATE-V29.zip"; done
          cp v16-production-input/V16_PRODUCTION_FIX_9_TERMINAL_LICENSE_STATE_PRIORITY.patch v16-production-source-package-v29/
          find /tmp/work -type f ! -path '/tmp/work/node_modules/*' ! -path '/tmp/work/dist/*' ! -path '/tmp/work/dist-server/*' ! -path '/tmp/work/preview-v14/*' ! -path '/tmp/work/release-v14/*' -print0 | sort -z | xargs -0 sha256sum > v16-production-source-package-v29/V16_FINAL_CUSTOMER_SOURCE_TREE_SHA256.txt
          find /tmp/control-plane -type f ! -path '/tmp/control-plane/node_modules/*' -print0 | sort -z | xargs -0 sha256sum > v16-production-source-package-v29/V16_FINAL_CONTROL_PLANE_TREE_SHA256.txt
          (cd v16-production-source-package-v29 && sha256sum *.zip customer-previews/*.zip > SHA256SUMS.txt)
          touch /tmp/v16-v29-freeze.ok
      - uses: actions/upload-artifact@v4
        with: { name: v16-production-source-package-v29, path: 'v16-production-source-package-v29/**', if-no-files-found: error, retention-days: 14 }
      - name: Persist V29 evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          val(){ [ -f "/tmp/v16-v29-$1.ok" ] && printf success || printf failure; }
          audit=unavailable; [ -s /tmp/v29-audit.json ] && audit="$(node -e "const a=require('/tmp/v29-audit.json'),v=a.metadata?.vulnerabilities||{};process.stdout.write('low='+(v.low||0)+' moderate='+(v.moderate||0)+' high='+(v.high||0)+' critical='+(v.critical||0)+' total='+(v.total||0))")"
          cat > v16-production-evidence/source-package-v29-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          reconstruct=$(val reconstruct)
          terminal_state_priority_regression=$(val regression)
          dependency_audit=$(val audit)
          audit_counts=${audit}
          customer_tests_types_builds=$(val customer)
          four_packages=$(val packages)
          control_plane_tests_typecheck=$(val control-plane)
          private_material_scan=$(val private)
          artifact_freeze=$(val freeze)
          source_v23_artifact_id=${V23_ARTIFACT_ID}
          source_v23_artifact_sha256=${V23_ARTIFACT_SHA256}
          fix9_sha256=${FIX9_SHA256}
          signing_public_key_fingerprint=${SIGNING_PUBLIC_KEY_FINGERPRINT}
          migration_ceiling=${MIGRATION_CEILING}
          cloudflare_touched=false
          existing_d1_touched=false
          customer_ready=false
          deployed=false
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/source-package-v29-latest.txt
          git commit -m 'ci(v16): record source package closure v29' || exit 0
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate
