name: V17 Rollback API Readiness Recovery V28
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v17-rollback-api-readiness-recovery-v28.yml']
permissions: { contents: write }
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Add bounded Pages Functions readiness to V24
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v17-failed-migration-rollback-v24.yml');s=p.read_text()
          old="          curl --fail -s -H 'content-type: application/json' --data @/tmp/setup \"$URL/api/setup/init\">/tmp/setupout\n          curl --fail -s -H 'content-type: application/json' --data @/tmp/login \"$URL/api/auth/login\">/tmp/loginout"
          new="""          api_post(){ local data=\"$1\" path=\"$2\" out=\"$3\" code=; for i in $(seq 1 45); do code=\"$(curl -sS -o \"$out\" -w '%{http_code}' --max-time 15 -H 'content-type: application/json' --data @\"$data\" \"$URL$path\" || true)\"; [[ \"$code\" =~ ^2 ]] && return 0; sleep 2; done; echo \"$path HTTP $code\" >&2; cat \"$out\" >&2 || true; return 1; }
          api_get(){ local token=\"$1\" path=\"$2\" out=\"$3\" code=; for i in $(seq 1 45); do code=\"$(curl -sS -o \"$out\" -w '%{http_code}' --max-time 15 -H \"authorization: Bearer $token\" \"$URL$path\" || true)\"; [[ \"$code\" =~ ^2 ]] && return 0; sleep 2; done; echo \"$path HTTP $code\" >&2; cat \"$out\" >&2 || true; return 1; }
          api_post /tmp/setup /api/setup/init /tmp/setupout
          api_post /tmp/login /api/auth/login /tmp/loginout"""
          if s.count(old)!=1: raise SystemExit(f'baseline anchor={s.count(old)}')
          s=s.replace(old,new,1)
          old2='          T="$(cat /tmp/auth)";curl --fail -s -H "authorization: Bearer $T" "$URL/api/admin/backup/export">/tmp/before'
          new2='          T="$(cat /tmp/auth)";api_get "$T" /api/admin/backup/export /tmp/before'
          if s.count(old2)!=1: raise SystemExit(f'backup anchor={s.count(old2)}')
          p.write_text(s.replace(old2,new2,1))
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v17-failed-migration-rollback-v24.yml
          git commit -m 'ci(v17): wait for rollback Pages Functions routes'
          git fetch origin agent/v16-production-gate;git rebase origin/agent/v16-production-gate;git push origin HEAD:agent/v16-production-gate