name: V16 Production Source Package Gate V6
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-source-package-gate-v6.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-source-package-gate-v6, cancel-in-progress: true }
env:
  V15_ARTIFACT_ID: '9330679827'
  V15_ARTIFACT_SHA256: '5f6e65ae856c1196fcd3a2e3dd7bcffb4da863ab212d3595839e921f0a96e1cf'
  V15_MASTER_SHA256: 'd05ee110815a29b74498e17adac1b8355dec40d5a705dd016f5ad5f849caa9e9'
  INPUT_ARCHIVE_SHA256: '43b2d44d508a02a431f2a405b5e95f8fbf850cca17b522446d1d6e0630d4d0f7'
  TASK8_TREE_SHA256: '1b7c4e8179be6f397061d7999ade081f1bb0791f5ac10a2b5490dbec1d3d7b6c'
  FIX1_SHA256: '0bd14b991e38e86b0b8a742a17d56a6dde837f32f248663335fc8e59e3e4eb30'
  FIX2_SHA256: 'e86a42d82a8b9c5ce7c78015e91d94b63f7ef35848316a27e645f9a6fca8828d'
  FIX3_SHA256: 'bb2c8fee9301fadb15427020ecbe838cc1111d4deecd16c8b8f9aeb368118753'
  FIX4_SHA256: 'b095ee7a1c5f091543c413e9f24ec410f62a61c612f17b379f770cb1016b1e2b'
  SIGNING_PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  SIGNING_PUBLIC_KEY_FINGERPRINT: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  CONTROL_PLANE_URL: 'https://dorm-control-plane.winza125.workers.dev'
  MIGRATION_CEILING: '0007_add_license_state.sql'
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Reconstruct immutable candidate and fixes 1-3
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          echo "$FIX1_SHA256  v16-production-input/V16_PRODUCTION_FIX.patch" | sha256sum -c -
          echo "$FIX2_SHA256  v16-production-input/V16_PRODUCTION_FIX_2.patch" | sha256sum -c -
          echo "$FIX3_SHA256  v16-production-input/V16_PRODUCTION_FIX_3.patch" | sha256sum -c -
          cat v16-production-inputs/input-00a.b64 v16-production-inputs/input-00b.b64 v16-production-inputs/input-01.b64 v16-production-inputs/input-02.b64 v16-production-inputs/input-03.b64 v16-production-inputs/input-04.b64 v16-production-inputs/input-05.b64 | base64 -d > /tmp/inputs.tar.xz
          echo "$INPUT_ARCHIVE_SHA256  /tmp/inputs.tar.xz" | sha256sum -c -
          rm -rf /tmp/v16-inputs /tmp/v15 /tmp/work /tmp/cp-review /tmp/control-plane /tmp/before
          tar -xJf /tmp/inputs.tar.xz -C /tmp
          (cd /tmp/v16-inputs && sha256sum -c SHA256SUMS.txt)
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V15_ARTIFACT_ID}/zip" -o /tmp/v15.zip
          echo "$V15_ARTIFACT_SHA256  /tmp/v15.zip" | sha256sum -c -
          mkdir -p /tmp/v15 /tmp/work /tmp/cp-review /tmp/before
          unzip -q /tmp/v15.zip -d /tmp/v15
          echo "$V15_MASTER_SHA256  /tmp/v15/dorm-management-system-master-v15-CUSTOMER-READY.zip" | sha256sum -c -
          unzip -q /tmp/v15/dorm-management-system-master-v15-CUSTOMER-READY.zip -d /tmp/work
          cd /tmp/work
          for p in /tmp/v16-inputs/V16_TASK6_EXACT_V15.patch /tmp/v16-inputs/V16_TASK7.patch /tmp/v16-inputs/V16_TASK8_PRODUCTION.patch; do patch -p1 < "$p"; done
          find . -type f ! -path './node_modules/*' ! -path './dist/*' ! -path './dist-server/*' ! -path './preview-v14/*' ! -path './release-v14/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/task8.sha
          echo "$TASK8_TREE_SHA256  /tmp/task8.sha" | sha256sum -c -
          for p in "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX.patch" "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_2.patch" "$GITHUB_WORKSPACE/v16-production-input/V16_PRODUCTION_FIX_3.patch"; do patch -p1 < "$p"; done
          cp package.json /tmp/before/package.json
          cp package-lock.json /tmp/before/package-lock.json
          unzip -q /tmp/v16-inputs/V16_TASK5_CONTROL_PLANE_REVIEW.zip -d /tmp/cp-review
          cp -a /tmp/cp-review/V16_TASK5_CONTROL_PLANE /tmp/control-plane
          test ! -e control-plane

      - name: Regenerate and lock audited dependency Fix 4
        working-directory: /tmp/work
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit fix --package-lock-only >/tmp/audit-fix.log 2>&1 || true
          cmp package.json /tmp/before/package.json
          { diff -u --label a/package-lock.json --label b/package-lock.json /tmp/before/package-lock.json package-lock.json || true; } > "$GITHUB_WORKSPACE/V16_PRODUCTION_FIX_4_DEPENDENCIES.patch"
          echo "$FIX4_SHA256  $GITHUB_WORKSPACE/V16_PRODUCTION_FIX_4_DEPENDENCIES.patch" | sha256sum -c -
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Full customer tests types and builds after Fix 4
        working-directory: /tmp/work
        run: |
          npm test
          npm run lint
          npm run check:cloudflare-types:master
          npm run build:pages
          npm run build:vps

      - name: Generate and semantically verify four packages
        working-directory: /tmp/work
        env:
          V16_LICENSE_SIGNING_PUBLIC_KEY: '${{ env.SIGNING_PUBLIC_KEY_B64 }}'
          V16_LICENSE_CONTROL_PLANE_URL: '${{ env.CONTROL_PLANE_URL }}'
        shell: bash
        run: |
          set -euo pipefail
          npm run packages:generate
          for plan in demo basic standard pro; do
            z="preview-v14/dorm-management-system-${plan}-v14-PREVIEW.zip"
            test -f "$z"; unzip -t "$z" >/dev/null
            tmp="$(mktemp -d)"; unzip -q "$z" -d "$tmp"
            cfg="$tmp/src/generated/licenseConfig.ts"; test -f "$cfg"
            test "$(find "$tmp/d1-migrations" -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
            test ! -e "$tmp/control-plane"
            ! grep -RIl --exclude='*.zip' 'LICENSE_SIGNING_PRIVATE_KEY' "$tmp" | grep -q .
            PUBLIC_KEY="$SIGNING_PUBLIC_KEY_B64" CONTROL_URL="$CONTROL_PLANE_URL" PLAN="$plan" CFG="$cfg" node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync(process.env.CFG,'utf8');
          const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          const checks=[
            new RegExp(`publicKeyBase64:\\s*["']${esc(process.env.PUBLIC_KEY)}["']`),
            new RegExp(`controlPlaneUrl:\\s*["']${esc(process.env.CONTROL_URL)}["']`),
            new RegExp(`packagePlan:\\s*["']${esc(process.env.PLAN)}["']`),
            new RegExp(`requiresLicense:\\s*${process.env.PLAN==='demo'?'false':'true'}`),
          ];
          if(checks.some(r=>!r.test(s))) process.exit(1);
          NODE
            rm -rf "$tmp"
          done

      - name: Control Plane tests and typecheck
        working-directory: /tmp/control-plane
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run typecheck

      - name: Private material and migration ceiling audit
        working-directory: /tmp/work
        shell: bash
        run: |
          set -euo pipefail
          test "$(find d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = "$MIGRATION_CEILING"
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist-server 'LICENSE_SIGNING_PRIVATE_KEY' . | grep -q .
          ! grep -RIl --exclude='*.zip' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist-server 'BEGIN PRIVATE KEY' . | grep -q .

      - name: Freeze source-package artifact and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v16-production-source-package-v6
          mkdir -p v16-production-source-package-v6/customer-previews v16-production-input v16-production-evidence
          cp V16_PRODUCTION_FIX_4_DEPENDENCIES.patch v16-production-input/
          (cd /tmp/work && zip -qr "$GITHUB_WORKSPACE/v16-production-source-package-v6/dorm-management-system-master-v16-PRODUCTION-SOURCE-GATED.zip" . -x 'node_modules/*' 'dist/*' 'dist-server/*' 'preview-v14/*' 'release-v14/*')
          (cd /tmp/control-plane && zip -qr "$GITHUB_WORKSPACE/v16-production-source-package-v6/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" . -x 'node_modules/*')
          for p in demo basic standard pro; do cp "/tmp/work/preview-v14/dorm-management-system-${p}-v14-PREVIEW.zip" "v16-production-source-package-v6/customer-previews/dorm-management-system-${p}-v16-SOURCE-GATE-PREVIEW.zip"; done
          cp V16_PRODUCTION_FIX_4_DEPENDENCIES.patch v16-production-source-package-v6/
          cp v16-production-input/V16_PRODUCTION_FIX.patch v16-production-input/V16_PRODUCTION_FIX_2.patch v16-production-input/V16_PRODUCTION_FIX_3.patch v16-production-source-package-v6/
          find /tmp/work -type f ! -path '/tmp/work/node_modules/*' ! -path '/tmp/work/dist/*' ! -path '/tmp/work/dist-server/*' ! -path '/tmp/work/preview-v14/*' ! -path '/tmp/work/release-v14/*' -print0 | sort -z | xargs -0 sha256sum > v16-production-source-package-v6/V16_FINAL_SOURCE_TREE_SHA256.txt
          sha256sum v16-production-source-package-v6/*.zip v16-production-source-package-v6/customer-previews/*.zip > v16-production-source-package-v6/SHA256SUMS.txt
          final_tree_manifest="$(sha256sum v16-production-source-package-v6/V16_FINAL_SOURCE_TREE_SHA256.txt | cut -d' ' -f1)"
          cat > v16-production-evidence/source-package-v6-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          job_status=success
          exact_task8_tree_manifest_sha256=${TASK8_TREE_SHA256}
          fix1_sha256=${FIX1_SHA256}
          fix2_sha256=${FIX2_SHA256}
          fix3_sha256=${FIX3_SHA256}
          fix4_sha256=${FIX4_SHA256}
          final_source_tree_manifest_sha256=${final_tree_manifest}
          production_audit_high=0
          production_audit_critical=0
          tests_types_builds=success
          four_packages=success
          control_plane_tests_typecheck=success
          signing_public_key_fingerprint=${SIGNING_PUBLIC_KEY_FINGERPRINT}
          control_plane_url=${CONTROL_PLANE_URL}
          migration_ceiling=${MIGRATION_CEILING}
          customer_ready=false
          deployed=false
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-input/V16_PRODUCTION_FIX_4_DEPENDENCIES.patch v16-production-evidence/source-package-v6-latest.txt
          git commit -m 'fix(v16): accept audited dependency lock repair and source gate evidence'
          git push origin HEAD:agent/v16-production-gate

      - uses: actions/upload-artifact@v4
        with: { name: v16-production-source-package-v6, path: 'v16-production-source-package-v6/**', if-no-files-found: error, retention-days: 14 }
