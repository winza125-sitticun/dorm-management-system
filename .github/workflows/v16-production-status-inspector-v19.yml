name: V16 Production Status Inspector V19
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-status-inspector-v19.yml']
permissions: { contents: write, actions: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Inspect V15 and V18 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflows={
            'v15': 'v16-production-live-license-smoke-v15.yml',
            'v18': 'v16-production-customer-ready-finalizer-v18.yml',
          }
          out={}
          for key,wf in workflows.items():
            url=f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?branch=agent%2Fv16-production-gate&per_page=5'
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              runs=data.get('workflow_runs',[])
              if runs:
                x=runs[0]
                out[key]={k:x.get(k) for k in ('id','run_attempt','status','conclusion','head_sha','event','created_at','updated_at')}
              else: out[key]={'status':'missing'}
            except Exception as e:
              out[key]={'status':'inspect_error','error':str(e)}
          os.makedirs('v16-production-evidence',exist_ok=True)
          with open('v16-production-evidence/status-inspector-v19-latest.json','w') as f: json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist inspector evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/status-inspector-v19-latest.json
          git commit -m 'ci(v16): record production workflow status v19' || exit 0
          git push origin HEAD:agent/v16-production-gate
