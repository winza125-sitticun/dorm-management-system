name: V17 Pro Network Retry Gate V30
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v17-pro-network-retry-v30.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v17-pro-network-retry-v30, cancel-in-progress: false }
env:
  V16_FINAL_ARTIFACT_ID: '9393238249'
  V16_FINAL_ARTIFACT_SHA256: 'fe17d6426d66722068fd2d003590ca3d0ef188d19dca33c58ed6200ed2de85f1'
  V16_PRO_SHA256: 'c2f46f8e6ca251b7476a8e1bc510e9fedd1f17e516c9ad5a17338f8504933e04'
  V17_ARTIFACT_ID: '9394092671'
  V17_ARTIFACT_SHA256: '0503ec400e7e52e7e9a23723155aa2eebbc3e64f8ead898cc49b9a9968f63ad3'
  STABLE_CP_D1: 'dorm-license-control-plane-v16-db'
  STABLE_CP_D1_UUID: '68695864-48de-4d8a-932b-9d11cd4d6b4d'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify exact artifacts
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'job_status=success' v17-production-evidence/live-upgrade-v20-latest.txt
          rm -rf /tmp/v16a /tmp/v17a /tmp/v16 /tmp/cp;mkdir -p /tmp/v16a /tmp/v17a /tmp/v16 /tmp/cp
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V16_FINAL_ARTIFACT_ID}/zip" -o /tmp/v16a.zip
          echo "$V16_FINAL_ARTIFACT_SHA256  /tmp/v16a.zip"|sha256sum -c -;unzip -q /tmp/v16a.zip -d /tmp/v16a
          R16=/tmp/v16a;[ -f "$R16/CUSTOMER-READY-SHA256SUMS.txt" ]||R16="$(dirname "$(find /tmp/v16a -name CUSTOMER-READY-SHA256SUMS.txt -print -quit)")";(cd "$R16"&&sha256sum -c CUSTOMER-READY-SHA256SUMS.txt)
          P16="$R16/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V29.zip";echo "$V16_PRO_SHA256  $P16"|sha256sum -c -;unzip -q "$P16" -d /tmp/v16
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V17_ARTIFACT_ID}/zip" -o /tmp/v17a.zip
          echo "$V17_ARTIFACT_SHA256  /tmp/v17a.zip"|sha256sum -c -;unzip -q /tmp/v17a.zip -d /tmp/v17a
          R17=/tmp/v17a;[ -f "$R17/SHA256SUMS.txt" ]||R17="$(dirname "$(find /tmp/v17a -name SHA256SUMS.txt -print -quit)")";(cd "$R17"&&sha256sum -c SHA256SUMS.txt)
          cp "$R17/BOOTSTRAP-V16-TO-V17.mjs" /tmp/v16/;unzip -q "$R17/dorm-control-plane-v17-SOURCE-GATE-V11.zip" -d /tmp/cp
          touch /tmp/v30-exact.ok
      - name: Seed run-scoped Pro license
        working-directory: /tmp/cp
        shell: bash
        run: |
          set -euo pipefail;npm ci;npx wrangler d1 list --json >/tmp/cpd1
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/cpd1'));r=x if isinstance(x,list) else x.get('result',x.get('databases',[]));m=[q for q in r if q.get('name')==os.environ['STABLE_CP_D1']];assert len(m)==1;u=m[0].get('uuid') or m[0].get('id');assert u==os.environ['STABLE_CP_D1_UUID'];json.dump({'name':'dorm-control-plane','main':'src/index.ts','compatibility_date':'2026-08-05','d1_databases':[{'binding':'DB','database_name':os.environ['STABLE_CP_D1'],'database_id':u,'migrations_dir':'migrations'}]},open('wrangler.v30.jsonc','w'))
          PY
          LIC="lic-v17-v30-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}";KEY="V30-$(node -e "process.stdout.write(require('node:crypto').randomBytes(18).toString('hex').toUpperCase())")";HASH="$(printf '%s' "$KEY"|sha256sum|awk '{print $1}')";NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)";printf '%s' "$LIC">/tmp/lic;printf '%s' "$KEY">/tmp/key
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.v30.jsonc --command "INSERT INTO licenses(id,key_hash,customer_label,plan,status,max_activations,expires_at,created_at,updated_at) VALUES('${LIC}','${HASH}','V17 V30 network','pro','active',1,NULL,'${NOW}','${NOW}');" >/dev/null
          touch /tmp/v30-license.ok
      - name: Deploy and activate disposable exact V16 Pro
        working-directory: /tmp/v16
        shell: bash
        run: |
          set -euo pipefail;npm ci
          M="$(printf '%s' "$GITHUB_RUN_ID"|tail -c 9)-${GITHUB_RUN_ATTEMPT}-$(python3 -c 'import secrets;print(secrets.token_hex(3))')";D1="v17-v30-${M}-db";PAGES="v17-v30-${M}";printf 'D1=%q\nPAGES=%q\n' "$D1" "$PAGES">/tmp/v30.env
          timeout 120s npx wrangler d1 create "$D1" --location apac;timeout 60s npx wrangler d1 info "$D1" --json >/tmp/d1info
          python3 - "$D1" "$PAGES" <<'PY'
          import json,re,sys
          s=json.dumps(json.load(open('/tmp/d1info')));m=re.search(r'[0-9a-fA-F-]{36}',s);assert m
          json.dump({'name':sys.argv[2],'compatibility_date':'2026-08-05','compatibility_flags':['nodejs_compat'],'pages_build_output_dir':'./dist','upload_source_maps':True,'d1_databases':[{'binding':'DB','database_name':sys.argv[1],'database_id':m.group(0),'migrations_dir':'./d1-migrations'}]},open('wrangler.jsonc','w'))
          PY
          timeout 120s npx wrangler pages project create "$PAGES" --production-branch main
          JWT="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')";printf '%s\n' "$JWT"|timeout 90s npx wrangler pages secret put JWT_SECRET --project-name "$PAGES";unset JWT
          timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc;npm run build:pages
          timeout 240s npx wrangler pages deploy dist --project-name "$PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false >/tmp/pages
          URL="https://${PAGES}.pages.dev";printf 'URL=%q\n' "$URL">>/tmp/v30.env
          EMAIL="v30-${GITHUB_RUN_ID}@example.invalid";PASS="V30!ReadyAa$(python3 -c 'import secrets;print(secrets.token_hex(10))')";printf '%s' "$EMAIL">/tmp/email;printf '%s' "$PASS">/tmp/pass
          python3 - <<'PY'
          import json
          e=open('/tmp/email').read();p=open('/tmp/pass').read();json.dump({'email':e,'password':p,'displayName':'V30','dormName':'V30'},open('/tmp/setup','w'));json.dump({'username':e,'password':p},open('/tmp/login','w'));json.dump({'licenseKey':open('/tmp/key').read()},open('/tmp/activate','w'))
          PY
          post(){ local data="$1" path="$2" out="$3" c=;for i in $(seq 1 45);do c="$(curl -sS -o "$out" -w '%{http_code}' --max-time 15 -H 'content-type: application/json' --data @"$data" "$URL$path"||true)";[[ "$c" =~ ^2 ]]&&return 0;sleep 2;done;return 1; }
          post /tmp/setup /api/setup/init /tmp/setupout;post /tmp/login /api/auth/login /tmp/loginout
          node -e "const fs=require('node:fs'),x=JSON.parse(fs.readFileSync('/tmp/loginout')),d=x.data||x;fs.writeFileSync('/tmp/auth',d.token)"
          T="$(cat /tmp/auth)";for i in $(seq 1 30);do c="$(curl -sS -o /tmp/act -w '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate "$URL/api/license/activate"||true)";[ "$c" = 200 ]&&break;sleep 2;done;test "$c" = 200
          npx wrangler pages deployment list --project-name "$PAGES" --json >/tmp/deploy-before
          touch /tmp/v30-activated.ok
      - name: Permanent package failure is non-mutating
        working-directory: /tmp/v16
        shell: bash
        run: |
          set -euo pipefail;set -a;. /tmp/v30.env;set +a;export DORM_UPDATE_ADMIN_USERNAME="$(cat /tmp/email)" DORM_UPDATE_ADMIN_PASSWORD="$(cat /tmp/pass)"
          cat >/tmp/v30-all.mjs <<'NODE'
          import fs from 'node:fs';const real=globalThis.fetch;let n=0;globalThis.fetch=async(input,init)=>{const u=String(input?.url||input);if(u.includes('dorm-management-updates.pages.dev/')){n++;fs.writeFileSync('/tmp/v30-all-count',String(n));throw new TypeError('V30 simulated package network failure')}return real(input,init)};
          NODE
          set +e;NODE_OPTIONS='--import /tmp/v30-all.mjs' timeout 600s node BOOTSTRAP-V16-TO-V17.mjs >/tmp/all.log 2>&1;RC=$?;set -e;cat /tmp/all.log
          test "$RC" -ne 0;test "$(cat /tmp/v30-all-count)" = 5;test "$(node -p "require('./package.json').version")" = 1.1.0;test ! -f .dorm-update-state.json;test ! -d backups
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='update_state';" >/tmp/state1;! grep -q update_state /tmp/state1
          touch /tmp/v30-permanent.ok
      - name: Transient package retry then login failure remains idempotent
        working-directory: /tmp/v16
        shell: bash
        run: |
          set -euo pipefail;set -a;. /tmp/v30.env;set +a;export DORM_UPDATE_ADMIN_USERNAME="$(cat /tmp/email)" DORM_UPDATE_ADMIN_PASSWORD="$(cat /tmp/pass)"
          cat >/tmp/v30-transient.mjs <<'NODE'
          import fs from 'node:fs';const real=globalThis.fetch;let pkg=0,login=0;globalThis.fetch=async(input,init)=>{const u=String(input?.url||input);if(u.includes('dorm-management-updates.pages.dev/')){pkg++;fs.writeFileSync('/tmp/v30-pkg-count',String(pkg));if(pkg<5)throw new TypeError('V30 transient package failure');return real(input,init)}if(u.includes('.pages.dev/api/auth/login')){login++;fs.writeFileSync('/tmp/v30-login-count',String(login));throw new TypeError('V30 controlled login failure')}return real(input,init)};
          NODE
          for n in 1 2;do rm -f /tmp/v30-pkg-count /tmp/v30-login-count;set +e;NODE_OPTIONS='--import /tmp/v30-transient.mjs' timeout 900s node BOOTSTRAP-V16-TO-V17.mjs >"/tmp/t${n}.log" 2>&1;RC=$?;set -e;cat "/tmp/t${n}.log";test "$RC" -ne 0;test "$(cat /tmp/v30-pkg-count)" = 5;test "$(cat /tmp/v30-login-count)" = 5;test "$(node -p "require('./package.json').version")" = 1.1.0;test ! -f .dorm-update-state.json;test ! -d backups;done
          npx wrangler pages deployment list --project-name "$PAGES" --json >/tmp/deploy-after
          python3 - <<'PY'
          import json
          def canonical(p):
            return json.dumps(json.load(open(p)),sort_keys=True,separators=(',',':'))
          a=canonical('/tmp/deploy-before');b=canonical('/tmp/deploy-after');assert a==b,(a,b)
          PY
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='update_state';" >/tmp/state2;! grep -q update_state /tmp/state2
          touch /tmp/v30-transient.ok
      - name: Guarded cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/lic ]&&[ -f /tmp/cp/wrangler.v30.jsonc ];then LIC="$(cat /tmp/lic)";[[ "$LIC" == lic-v17-v30-* ]]&&cd /tmp/cp&&timeout 90s npx wrangler d1 execute DB --remote --config wrangler.v30.jsonc --command "DELETE FROM license_events WHERE license_id='${LIC}';DELETE FROM activations WHERE license_id='${LIC}';DELETE FROM licenses WHERE id='${LIC}';" >/dev/null;fi
          if [ -f /tmp/v30.env ];then set -a;. /tmp/v30.env;set +a;[[ "$PAGES" == v17-v30-* ]]&&[[ "$D1" == v17-v30-*-db ]]&&cd /tmp/v16&&timeout 120s npx wrangler pages project delete "$PAGES" --yes&&timeout 120s npx wrangler d1 delete "$D1" --skip-confirmation;fi
          touch /tmp/v30-cleanup.ok;exit 0
      - name: Persist V30 evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail;mkdir -p v17-production-evidence;v(){ [ -f "/tmp/v30-$1.ok" ]&&printf success||printf failure;};cat >v17-production-evidence/pro-network-retry-v30-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          exact_artifacts=$(v exact)
          licensed_disposable_v16_pro=$(v activated)
          permanent_package_failure_non_mutating=$(v permanent)
          transient_package_retry_fifth_attempt=$(v transient)
          repeated_failure_idempotent=$(v transient)
          package_attempts=5
          login_attempts=5
          backup_created=false
          update_state_created=false
          pages_redeployed=false
          cleanup=$(v cleanup)
          v16_rebuilt=false
          v16_modified=false
          existing_customer_d1_touched=false
          v17_customer_ready=false
          EOF
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add v17-production-evidence/pro-network-retry-v30-latest.txt;git commit -m 'ci(v17): record Pro network retry v30' || exit 0;git fetch origin agent/v16-production-gate;git rebase origin/agent/v16-production-gate;git push origin HEAD:agent/v16-production-gate