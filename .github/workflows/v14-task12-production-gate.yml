name: V17 Vendor Admin Gate Materializer via Registered Runner

on:
  push:
    branches:
      - agent/v14-task12-production-gate
    paths:
      - .github/workflows/v14-task12-production-gate.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-task12-production-gate
          fetch-depth: 0
      - name: Materialize verified V17 Vendor Admin gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/v17-vendor-admin-mvp-customer-ready:refs/remotes/origin/agent/v17-vendor-admin-mvp-customer-ready
          rm -rf v17-vendor-admin-mvp
          git archive origin/agent/v17-vendor-admin-mvp-customer-ready v17-vendor-admin-mvp | tar -x
          base64 -d v17-vendor-admin-mvp/V17_VENDOR_ADMIN_MVP_CUSTOMER_READY_WORKFLOW.yml.gz.b64 > /tmp/gate.yml.gz
          echo 'fd97ce18d871bc84b382c09e21d197b5db99d7ceb83e8abfddb4308de052a93e  /tmp/gate.yml.gz' | sha256sum -c -
          gunzip -c /tmp/gate.yml.gz > /tmp/gate.original.yml
          echo '2fbc9cec64b0548ff794065e4009b9caa5e3ab2a3bab1346224e494266770e77  /tmp/gate.original.yml' | sha256sum -c -
          grep -Fxq 'name: V17 Vendor Admin MVP Customer Ready Gate V1' /tmp/gate.original.yml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/gate.original.yml').read_text()
          s=s.replace('agent/v17-vendor-admin-mvp-customer-ready','agent/v14-task12-production-gate')
          s=s.replace(".github/workflows/v17-vendor-admin-mvp-customer-ready-v1.yml",".github/v17-vendor-admin-customer-ready-trigger.txt")
          Path('.github/workflows/v14-task12-production-gate.yml').write_text(s)
          PY
          grep -Fq 'branches: [agent/v14-task12-production-gate]' .github/workflows/v14-task12-production-gate.yml
          grep -Fq ".github/v17-vendor-admin-customer-ready-trigger.txt" .github/workflows/v14-task12-production-gate.yml
          cat > v17-vendor-admin-mvp/GATE_MATERIALIZATION.txt <<'EOF'
          original_gate_gzip_sha256=fd97ce18d871bc84b382c09e21d197b5db99d7ceb83e8abfddb4308de052a93e
          original_gate_yaml_sha256=2fbc9cec64b0548ff794065e4009b9caa5e3ab2a3bab1346224e494266770e77
          execution_branch=agent/v14-task12-production-gate
          registered_workflow_path=.github/workflows/v14-task12-production-gate.yml
          trigger_marker=.github/v17-vendor-admin-customer-ready-trigger.txt
          frozen_customer_packages_touched=false
          EOF
          git add .github/workflows/v14-task12-production-gate.yml v17-vendor-admin-mvp
          git commit -m 'ci(v17): materialize vendor admin customer-ready gate [skip ci]'
          git push origin HEAD:agent/v14-task12-production-gate
