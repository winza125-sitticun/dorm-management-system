name: V15 Task 4 TDD Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/v15-task1-white-label-contract]
    paths:
      - 'v15-task4-patches/**'
      - '.github/workflows/v15-task4-tdd.yml'

permissions:
  contents: write
  actions: read

jobs:
  task1-task2-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Task 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v15-task1-white-label-contract

      - name: Download immutable Task 3 candidate by artifact ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/winza125-sitticun/dorm-management-system/actions/artifacts/9295620943/zip" \
            -o candidate.zip
          unzip -q candidate.zip -d candidate

      - name: Extract exact Task 3 Master
        shell: bash
        run: |
          set -euo pipefail
          MASTER_ZIP="candidate/dorm-management-system-master-v15-task3-REVIEW-CI.zip"
          test -f "$MASTER_ZIP"
          echo 'ea70213d83f87eaacfb9002beee1bc5b46bdc3aea158d3bf94d626ab5c0d53c2  '"$MASTER_ZIP" | sha256sum --check --strict
          mkdir source
          unzip -q "$MASTER_ZIP" -d source

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install exact dependencies
        working-directory: source
        run: npm ci

      - name: Apply Task 1 verified patches
        id: task1
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ../v15-task4-patches/001-task1-tests.patch.b64 > ../task1-tests.patch
          patch -p1 < ../task1-tests.patch
          base64 -d ../v15-task4-patches/002-task1-impl.patch.b64 > ../task1-impl.patch
          patch -p1 < ../task1-impl.patch
          npx tsx --test tests/white-label-settings-ui-utils.test.ts

      - name: Apply Task 2 tests and contract evolution
        id: task2tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ../v15-task4-patches/003-task2-tests.patch.b64 > ../task2-tests.patch
          patch -p1 < ../task2-tests.patch
          base64 -d ../v15-task4-patches/005-task2-test-contract-fix.patch.b64 > ../task2-contract-fix.patch
          patch -p1 < ../task2-contract-fix.patch

      - name: Verify Task 2 RED
        id: red
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx tsx --test tests/theme-root-runtime.test.ts tests/theme-refresh-runtime.test.ts > ../task2-red.log 2>&1
          rc=$?
          set -e
          cat ../task2-red.log
          if [ "$rc" -eq 0 ]; then
            echo '::error::Task 2 RED unexpectedly passed before ThemeContext implementation'
            exit 1
          fi
          grep -Eq 'refreshBranding|manual branding refresh|missing refreshBranding' ../task2-red.log

      - name: Apply Task 2 implementation
        id: task2impl
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ../v15-task4-patches/004-task2-impl.patch.b64 > ../task2-impl.patch
          patch -p1 < ../task2-impl.patch

      - name: Verify Task 2 GREEN
        id: green
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test tests/brand-theme-runtime.test.ts tests/branding-client-runtime.test.ts tests/theme-root-runtime.test.ts tests/theme-refresh-runtime.test.ts tests/theme-css-contract.test.ts 2>&1 | tee ../task2-green.log

      - name: Lint
        id: lint
        working-directory: source
        run: npm run lint

      - name: Pages build
        id: pages
        working-directory: source
        run: npm run build:pages

      - name: VPS build
        id: vps
        working-directory: source
        run: npm run build:vps

      - name: Diff check
        id: diffcheck
        working-directory: source
        run: git diff --check

      - name: Persist Task 2 diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v15-task4-evidence
          cat > v15-task4-evidence/task2-latest.txt <<EOF
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          source_sha=$GITHUB_SHA
          task1=${{ steps.task1.outcome }}
          task2tests=${{ steps.task2tests.outcome }}
          red=${{ steps.red.outcome }}
          task2impl=${{ steps.task2impl.outcome }}
          green=${{ steps.green.outcome }}
          lint=${{ steps.lint.outcome }}
          pages=${{ steps.pages.outcome }}
          vps=${{ steps.vps.outcome }}
          diffcheck=${{ steps.diffcheck.outcome }}
          EOF
          if [ "${{ steps.green.outcome }}" = success ] && [ "${{ steps.lint.outcome }}" = success ] && [ "${{ steps.pages.outcome }}" = success ] && [ "${{ steps.vps.outcome }}" = success ] && [ "${{ steps.diffcheck.outcome }}" = success ]; then
            printf 'status=RED_VERIFIED_GREEN_PASS\nrun_id=%s\nrun_attempt=%s\nsource_sha=%s\nmaster_sha256=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
              'ea70213d83f87eaacfb9002beee1bc5b46bdc3aea158d3bf94d626ab5c0d53c2' \
              > v15-task4-evidence/task2-green.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v15-task4-evidence/task2-latest.txt v15-task4-evidence/task2-green.txt 2>/dev/null || git add v15-task4-evidence/task2-latest.txt
          git commit -m 'ci(v15-task4): record Task 2 diagnostic evidence' || exit 0
          git push origin HEAD:agent/v15-task1-white-label-contract
