name: V15 Task 4 TDD Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/v15-task1-white-label-contract]
    paths:
      - 'v15-task4-patches/001-task4-tests.patch.gz.b64'
      - 'v15-task4-patches/002a-App.patch'
      - 'v15-task4-patches/002b-SettingsView.patch'
      - 'v15-task4-patches/002c-WhiteLabelSettingsSection.patch'
      - 'v15-task4-patches/002d-ThemeContext.patch'
      - 'v15-task4-patches/002e-whiteLabelSettings.patch'
      - '.github/workflows/v15-task4-tdd.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: v15-task4-tdd
  cancel-in-progress: true

env:
  TASK3_ARTIFACT_ID: 9295620943
  TASK3_MASTER_SHA256: ea70213d83f87eaacfb9002beee1bc5b46bdc3aea158d3bf94d626ab5c0d53c2
  TEST_PATCH_BLOB: 530ce99976dd7e23d7aa42692ef65b88acc5fd45
  APP_PATCH_BLOB: fba1edcfbb33cd61bd5ac5f3bbdcf731f0626db8
  APP_PATCH_SHA256: 7b319867a4244ca4c9f0c219d486cd3077d419e40444d022720dab5ef87b4bcc
  SETTINGS_PATCH_BLOB: 7f014e5aee21f7bd9b2fda58676ae743bb23b788
  SETTINGS_PATCH_SHA256: 5dff662790a4bf69365cec79c875b4053dd3c792a621b7f29457ae7d64e04c56
  SECTION_PATCH_BLOB: bbbd66cc6100df5c067f87caa6e9a899ddc7fe1b
  SECTION_PATCH_SHA256: 6e5b435109f5a4a6719bf62370bcde93e8edfd2c202d2d106420268651652d2e
  THEME_PATCH_BLOB: 63809b5a53a6321b40dd59b81ea8515c5a28ebb7
  THEME_PATCH_SHA256: db1b0e08e6453567bf145e25258ab97691bea91dc628d5120d64e69867d491ed
  UTILS_PATCH_BLOB: bbb9b7705f4bad62987467147b29c764ae6310ca
  UTILS_PATCH_SHA256: 42a2fe0960a066655583d1336f74d0c324f82a6bbdf1a9221402ddbe5d901092

jobs:
  red-green:
    name: immutable Task 3 -> RED -> GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Task 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v15-task1-white-label-contract

      - name: Download immutable V15 Task 3 candidate
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/winza125-sitticun/dorm-management-system/actions/artifacts/${TASK3_ARTIFACT_ID}/zip" \
            -o task3-artifact.zip
          unzip -q task3-artifact.zip -d candidate

      - name: Verify and extract exact Task 3 master
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          MASTER_ZIP="$(find candidate -type f -name 'dorm-management-system-master-v15-task3-REVIEW-CI.zip' -print -quit)"
          test -n "$MASTER_ZIP"
          echo "$TASK3_MASTER_SHA256  $MASTER_ZIP" | sha256sum --check --strict
          rm -rf source
          mkdir source
          unzip -q "$MASTER_ZIP" -d source
          test -f source/src/context/ThemeContext.tsx
          test -f source/src/theme/brandTheme.ts
          test -f source/src/components/SettingsView.tsx
          test ! -e source/src/components/WhiteLabelSettingsSection.tsx
          test ! -e source/src/utils/whiteLabelSettings.ts
          (
            cd source
            git init -q
            git config user.email 'ci@example.invalid'
            git config user.name 'V15 Task 4 CI'
            git add -A
            git commit -qm 'immutable Task 3 baseline'
          )

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Fresh dependency install
        id: install
        working-directory: source
        run: npm ci

      - name: Verify and apply tests-only patch
        id: tests_patch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ../v15-task4-patches/001-task4-tests.patch.gz.b64)" = "$TEST_PATCH_BLOB"
          base64 -d ../v15-task4-patches/001-task4-tests.patch.gz.b64 | gzip -d > ../task4-tests.patch
          patch -p1 < ../task4-tests.patch

      - name: Prove RED against immutable Task 3 source
        id: red
        working-directory: source
        shell: bash
        run: |
          set +e
          node --experimental-transform-types --test \
            tests/white-label-settings-ui-utils.test.ts \
            tests/theme-root-runtime.test.ts \
            tests/theme-refresh-runtime.test.ts \
            tests/white-label-settings-section.test.ts \
            tests/white-label-settings-view-integration.test.ts \
            > ../task4-red.log 2>&1
          status=$?
          set -e
          cat ../task4-red.log
          if [ "$status" -eq 0 ]; then
            echo '::error::Task 4 tests-only state unexpectedly passed; RED gate is invalid.'
            exit 1
          fi
          grep -Eq 'ERR_MODULE_NOT_FOUND|Cannot find module|ENOENT' ../task4-red.log
          echo 'Expected RED confirmed.'

      - name: Verify raw implementation patch integrity
        id: impl_integrity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ../v15-task4-patches/002a-App.patch)" = "$APP_PATCH_BLOB"
          echo "$APP_PATCH_SHA256  ../v15-task4-patches/002a-App.patch" | sha256sum --check --strict
          test "$(git hash-object ../v15-task4-patches/002b-SettingsView.patch)" = "$SETTINGS_PATCH_BLOB"
          echo "$SETTINGS_PATCH_SHA256  ../v15-task4-patches/002b-SettingsView.patch" | sha256sum --check --strict
          test "$(git hash-object ../v15-task4-patches/002c-WhiteLabelSettingsSection.patch)" = "$SECTION_PATCH_BLOB"
          echo "$SECTION_PATCH_SHA256  ../v15-task4-patches/002c-WhiteLabelSettingsSection.patch" | sha256sum --check --strict
          test "$(git hash-object ../v15-task4-patches/002d-ThemeContext.patch)" = "$THEME_PATCH_BLOB"
          echo "$THEME_PATCH_SHA256  ../v15-task4-patches/002d-ThemeContext.patch" | sha256sum --check --strict
          test "$(git hash-object ../v15-task4-patches/002e-whiteLabelSettings.patch)" = "$UTILS_PATCH_BLOB"
          echo "$UTILS_PATCH_SHA256  ../v15-task4-patches/002e-whiteLabelSettings.patch" | sha256sum --check --strict

      - name: Dry-run raw implementation patches
        id: impl_dry_run
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for patch_file in \
            ../v15-task4-patches/002a-App.patch \
            ../v15-task4-patches/002b-SettingsView.patch \
            ../v15-task4-patches/002c-WhiteLabelSettingsSection.patch \
            ../v15-task4-patches/002d-ThemeContext.patch \
            ../v15-task4-patches/002e-whiteLabelSettings.patch; do
            patch --dry-run -p1 < "$patch_file"
          done

      - name: Apply raw implementation patches
        id: impl_apply
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for patch_file in \
            ../v15-task4-patches/002a-App.patch \
            ../v15-task4-patches/002b-SettingsView.patch \
            ../v15-task4-patches/002c-WhiteLabelSettingsSection.patch \
            ../v15-task4-patches/002d-ThemeContext.patch \
            ../v15-task4-patches/002e-whiteLabelSettings.patch; do
            patch -p1 < "$patch_file"
          done

      - name: Implementation diff integrity
        id: impl_diff
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- src/App.tsx src/components/SettingsView.tsx src/components/WhiteLabelSettingsSection.tsx src/context/ThemeContext.tsx src/utils/whiteLabelSettings.ts tests

      - name: Prove GREEN focused Task 4 contracts
        id: green
        working-directory: source
        run: |
          node --experimental-transform-types --test \
            tests/white-label-settings-ui-utils.test.ts \
            tests/theme-root-runtime.test.ts \
            tests/theme-refresh-runtime.test.ts \
            tests/white-label-settings-section.test.ts \
            tests/white-label-settings-view-integration.test.ts

      - name: Task 3 theme regressions
        id: theme_regression
        working-directory: source
        run: npx tsx --test tests/brand-theme-runtime.test.ts tests/branding-client-runtime.test.ts tests/theme-root-runtime.test.ts tests/theme-css-contract.test.ts

      - name: Static scope guard
        id: scope
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e d1-migrations/0007_add_task4_white_label_ui.sql
          ! grep -q "brandLogoUrl:" src/components/SettingsView.tsx
          grep -q "hasPlanFeature(subscriptionPlan, 'promptPay')" src/components/SettingsView.tsx
          grep -q "hasPlanFeature(subscriptionPlan, 'whiteLabel')" src/components/SettingsView.tsx
          grep -q "DEFAULT_BRAND_COLOR = '#1DB954'" src/theme/brandTheme.ts
          grep -q "source !== 'public'" src/context/ThemeContext.tsx
          ! grep -q 'document.documentElement' src/components/WhiteLabelSettingsSection.tsx

      - name: TypeScript lint gate
        id: lint
        working-directory: source
        run: npm run lint

      - name: Pages production build
        id: pages
        working-directory: source
        run: npm run build:pages

      - name: VPS production build
        id: vps
        working-directory: source
        run: npm run build:vps

      - name: Persist Task 4 TDD evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v15-task4-evidence
          cat > v15-task4-evidence/tdd-latest.txt <<EOF
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          source_sha=$GITHUB_SHA
          download=${{ steps.download.outcome }}
          extract=${{ steps.extract.outcome }}
          install=${{ steps.install.outcome }}
          tests_patch=${{ steps.tests_patch.outcome }}
          red=${{ steps.red.outcome }}
          impl_integrity=${{ steps.impl_integrity.outcome }}
          impl_dry_run=${{ steps.impl_dry_run.outcome }}
          impl_apply=${{ steps.impl_apply.outcome }}
          impl_diff=${{ steps.impl_diff.outcome }}
          green=${{ steps.green.outcome }}
          theme_regression=${{ steps.theme_regression.outcome }}
          scope=${{ steps.scope.outcome }}
          lint=${{ steps.lint.outcome }}
          pages=${{ steps.pages.outcome }}
          vps=${{ steps.vps.outcome }}
          task3_artifact_id=$TASK3_ARTIFACT_ID
          task3_master_sha256=$TASK3_MASTER_SHA256
          test_patch_blob=$TEST_PATCH_BLOB
          app_patch_blob=$APP_PATCH_BLOB
          app_patch_sha256=$APP_PATCH_SHA256
          settings_patch_blob=$SETTINGS_PATCH_BLOB
          settings_patch_sha256=$SETTINGS_PATCH_SHA256
          section_patch_blob=$SECTION_PATCH_BLOB
          section_patch_sha256=$SECTION_PATCH_SHA256
          theme_patch_blob=$THEME_PATCH_BLOB
          theme_patch_sha256=$THEME_PATCH_SHA256
          utils_patch_blob=$UTILS_PATCH_BLOB
          utils_patch_sha256=$UTILS_PATCH_SHA256
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v15-task4-evidence/tdd-latest.txt
          git commit -m 'ci(v15-task4): record TDD evidence' || exit 0
          git push origin HEAD:agent/v15-task1-white-label-contract
