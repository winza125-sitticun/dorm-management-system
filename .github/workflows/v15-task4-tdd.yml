name: V15 Task 4 TDD Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/v15-task1-white-label-contract]
    paths:
      - 'v15-task4-patches/**'
      - '.github/workflows/v15-task4-tdd.yml'

permissions:
  contents: read
  actions: read

jobs:
  task1-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Task 4 branch
        uses: actions/checkout@v4

      - name: Download immutable Task 3 candidate by artifact ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/winza125-sitticun/dorm-management-system/actions/artifacts/9295620943/zip" \
            -o candidate.zip
          unzip -q candidate.zip -d candidate

      - name: Extract exact Task 3 Master
        shell: bash
        run: |
          set -euo pipefail
          MASTER_ZIP="candidate/dorm-management-system-master-v15-task3-REVIEW-CI.zip"
          test -f "$MASTER_ZIP"
          echo 'ea70213d83f87eaacfb9002beee1bc5b46bdc3aea158d3bf94d626ab5c0d53c2  '"$MASTER_ZIP" | sha256sum --check --strict
          mkdir source
          unzip -q "$MASTER_ZIP" -d source
          test -f source/package-lock.json
          test -f source/src/theme/brandTheme.ts

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install exact dependencies
        working-directory: source
        run: npm ci

      - name: Apply Task 1 tests only
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ../v15-task4-patches/001-task1-tests.patch.b64 > ../task1-tests.patch
          patch -p1 < ../task1-tests.patch
          test -f tests/white-label-settings-ui-utils.test.ts
          test ! -f src/utils/whiteLabelSettings.ts

      - name: Verify Task 1 RED
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx tsx --test tests/white-label-settings-ui-utils.test.ts > ../task1-red.log 2>&1
          rc=$?
          set -e
          cat ../task1-red.log
          if [ "$rc" -eq 0 ]; then
            echo '::error::Task 1 RED unexpectedly passed before production implementation'
            exit 1
          fi
          grep -Eq 'whiteLabelSettings|ERR_MODULE_NOT_FOUND|Cannot find module' ../task1-red.log
