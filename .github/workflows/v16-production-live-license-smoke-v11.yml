name: V16 Production Live License Smoke V11
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-live-license-smoke-v11.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-live-license-smoke-v11, cancel-in-progress: true }
env:
  SOURCE_ARTIFACT_ID: '9365183203'
  SOURCE_ARTIFACT_SHA256: '102f94d86cdde64819420afbe747ca1d8ef6764977562df846f2d823be71e47f'
  CP_ZIP_SHA256: '8895fe017e2ba5dd61bd559a5fe5892a2d1ba3b86ae41e538aa1bba2bbbbe484'
  PRO_ZIP_SHA256: 'c350d9ab87b1e379ec5fc37edb52ea4009d346d4f74ff62a62e164b7526c442b'
  EXPECTED_PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  EXPECTED_PUBLIC_KEY_SHA256: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.V16_LICENSE_SIGNING_PRIVATE_KEY }}
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Verify production prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${LICENSE_SIGNING_PRIVATE_KEY:-}"
          node - <<'NODE'
          const crypto=require('node:crypto');
          let input=(process.env.LICENSE_SIGNING_PRIVATE_KEY||'').trim();
          if((input.startsWith('"')&&input.endsWith('"'))||(input.startsWith("'")&&input.endsWith("'")))input=input.slice(1,-1).trim();
          if(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=/.test(input))input=input.replace(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=\s*/,'').trim();
          let privateKey;
          if(input.includes('BEGIN PRIVATE KEY')) privateKey=crypto.createPrivateKey(input);
          else privateKey=crypto.createPrivateKey({key:Buffer.from(input.replace(/\s+/g,''),'base64'),format:'der',type:'pkcs8'});
          const jwk=crypto.createPublicKey(privateKey).export({format:'jwk'});
          const raw=Buffer.from(jwk.x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-jwk.x.length%4)%4),'base64');
          const fp=crypto.createHash('sha256').update(raw).digest('hex');
          if(fp!==process.env.EXPECTED_PUBLIC_KEY_SHA256)throw new Error('signing key fingerprint mismatch');
          if(raw.toString('base64')!==process.env.EXPECTED_PUBLIC_KEY_B64)throw new Error('public key mismatch');
          NODE
          touch /tmp/v16-live-prereq.ok

      - name: Download exact V10 artifact
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o /tmp/source.zip
          echo "$SOURCE_ARTIFACT_SHA256  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/source /tmp/cp /tmp/pro; mkdir -p /tmp/source /tmp/cp /tmp/pro
          unzip -q /tmp/source.zip -d /tmp/source
          echo "$CP_ZIP_SHA256  /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" | sha256sum -c -
          echo "$PRO_ZIP_SHA256  /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-PREVIEW.zip" | sha256sum -c -
          unzip -q /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip -d /tmp/cp
          unzip -q /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-PREVIEW.zip -d /tmp/pro
          test "$(find /tmp/pro/d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = '0007_add_license_state.sql'
          grep -Fq "$EXPECTED_PUBLIC_KEY_B64" /tmp/pro/src/generated/licenseConfig.ts
          touch /tmp/v16-live-artifact.ok

      - name: Install exact candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && npm install --no-audit --no-fund)
          (cd /tmp/pro && npm ci)

      - name: Allocate isolated Cloudflare names
        shell: bash
        run: |
          set -euo pipefail
          M="$(printf '%s' "$GITHUB_RUN_ID" | tr -cd '0-9' | tail -c 9)-${GITHUB_RUN_ATTEMPT}"
          echo "RUN_MARKER=$M" >> "$GITHUB_ENV"
          echo "CP_WORKER=v16-lic-cp-${M}" >> "$GITHUB_ENV"
          echo "CP_D1=v16-lic-cp-${M}-db" >> "$GITHUB_ENV"
          echo "PRO_PAGES=v16-lic-pro-${M}" >> "$GITHUB_ENV"
          echo "PRO_D1=v16-lic-pro-${M}-db" >> "$GITHUB_ENV"

      - name: Create D1 resources and configs
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && npx wrangler d1 create "$CP_D1" --location apac && npx wrangler d1 info "$CP_D1" --json > /tmp/cp-d1.json)
          (cd /tmp/pro && npx wrangler d1 create "$PRO_D1" --location apac && npx wrangler d1 info "$PRO_D1" --json > /tmp/pro-d1.json)
          python3 - <<'PY'
          import json,os,re
          def uuid(path):
            x=json.load(open(path))
            def walk(v):
              if isinstance(v,dict):
                for k,val in v.items():
                  if k in ('uuid','id','database_id') and isinstance(val,str) and re.fullmatch(r'[0-9a-fA-F-]{36}',val): return val
                  r=walk(val)
                  if r:return r
              if isinstance(v,list):
                for val in v:
                  r=walk(val)
                  if r:return r
            r=walk(x); assert r, x; return r
          cp=uuid('/tmp/cp-d1.json'); pro=uuid('/tmp/pro-d1.json')
          json.dump({'name':os.environ['CP_WORKER'],'main':'src/index.ts','compatibility_date':'2026-08-05','d1_databases':[{'binding':'DB','database_name':os.environ['CP_D1'],'database_id':cp,'migrations_dir':'migrations'}]},open('/tmp/cp/wrangler.jsonc','w'),indent=2)
          json.dump({'name':os.environ['PRO_PAGES'],'compatibility_date':'2026-08-05','compatibility_flags':['nodejs_compat'],'pages_build_output_dir':'./dist','upload_source_maps':True,'d1_databases':[{'binding':'DB','database_name':os.environ['PRO_D1'],'database_id':pro,'migrations_dir':'./d1-migrations'}]},open('/tmp/pro/wrangler.jsonc','w'),indent=2)
          PY
          touch /tmp/v16-live-resources.ok

      - name: Migrate and deploy isolated Control Plane
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd /tmp/cp && npx wrangler deploy --config wrangler.jsonc) | tee /tmp/cp-deploy.log
          printf '%s\n' "$LICENSE_SIGNING_PRIVATE_KEY" | (cd /tmp/cp && npx wrangler secret put LICENSE_SIGNING_PRIVATE_KEY --config wrangler.jsonc)
          CP_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/cp-deploy.log | tail -n1)"
          test -n "$CP_URL"
          echo "CP_URL=$CP_URL" >> "$GITHUB_ENV"
          touch /tmp/v16-live-cp-deploy.ok

      - name: Seed one-seat Basic license without logging raw key
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const key='V16-'+crypto.randomBytes(18).toString('hex').toUpperCase();
          const hash=crypto.createHash('sha256').update(key.trim().toUpperCase()).digest('hex');
          fs.writeFileSync('/tmp/license-key',key);
          fs.writeFileSync('/tmp/license-hash',hash);
          NODE
          H="$(cat /tmp/license-hash)"; NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd /tmp/cp && npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "INSERT INTO licenses(id,key_hash,customer_label,plan,status,max_activations,expires_at,created_at,updated_at) VALUES('live-lic-1','${H}','V16 isolated smoke','basic','active',1,NULL,'${NOW}','${NOW}');")
          touch /tmp/v16-live-seed.ok

      - name: Create and configure isolated Pro customer Pages
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/pro && npx wrangler pages project create "$PRO_PAGES" --production-branch main)
          JWT="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '%s\n' "$JWT" | (cd /tmp/pro && npx wrangler pages secret put JWT_SECRET --project-name "$PRO_PAGES")
          printf '%s\n' "$CP_URL" | (cd /tmp/pro && npx wrangler pages secret put LICENSE_CONTROL_PLANE_URL --project-name "$PRO_PAGES")
          printf '%s\n' "$EXPECTED_PUBLIC_KEY_B64" | (cd /tmp/pro && npx wrangler pages secret put LICENSE_SIGNING_PUBLIC_KEY --project-name "$PRO_PAGES")
          unset JWT
          (cd /tmp/pro && npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd /tmp/pro && npm run build:pages)
          (cd /tmp/pro && npx wrangler pages deploy dist --project-name "$PRO_PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false) | tee /tmp/pro-deploy.log
          PRO_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/pro-deploy.log | tail -n1)"
          test -n "$PRO_URL"
          echo "PRO_URL=$PRO_URL" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do curl --fail --silent --show-error --max-time 10 "$PRO_URL/" -o /dev/null && break; [ "$i" -eq 90 ] && exit 1; sleep 2; done
          touch /tmp/v16-live-pro-deploy.ok

      - name: Bootstrap owner and prove paid package is read-only before activation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,secrets
          p=os.environ['RUN_MARKER']; email=f'v16-live-{p}@example.invalid'; pwd='V16!LiveAa'+secrets.token_hex(8)
          json.dump({'email':email,'password':pwd,'displayName':'V16 Live Smoke','dormName':'V16 Live Dorm'},open('/tmp/setup.json','w'))
          json.dump({'username':email,'password':pwd},open('/tmp/login.json','w'))
          PY
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/setup.json "$PRO_URL/api/setup/init" > /tmp/setup-response.json
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/login.json "$PRO_URL/api/auth/login" > /tmp/login-response.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/login-response.json')); d=x.get('data',x); assert d.get('token') and d.get('user')
          open('/tmp/auth-token','w').write(str(d['token'])); open('/tmp/owner-id','w').write(str(d['user']['id']))
          PY
          T="$(cat /tmp/auth-token)"
          code="$(curl --silent --output /tmp/pre-room.json --write-out '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data '{}' "$PRO_URL/api/rooms")"
          python3 - "$code" <<'PY'
          import json,sys
          x=json.load(open('/tmp/pre-room.json')); code=int(sys.argv[1]); e=x.get('error',x.get('data',{}).get('error',{}));
          assert code in (402,403,409), (code,x); assert e.get('code')=='LICENSE_REQUIRED', x
          PY
          touch /tmp/v16-live-preactivation.ok

      - name: Activate Basic, enforce one seat, and reject local Pro tamper
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat /tmp/auth-token)"
          python3 - <<'PY'
          import json
          json.dump({'licenseKey':open('/tmp/license-key').read()},open('/tmp/activate.json','w'))
          PY
          curl --fail --silent --show-error -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate.json "$PRO_URL/api/license/activate" > /tmp/activated.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" > /tmp/status-basic.json
          python3 - <<'PY'
          import json
          for f in ('/tmp/activated.json','/tmp/status-basic.json'):
            x=json.load(open(f)); d=x.get('data',x); assert d.get('effectivePlan')=='basic',x; assert d.get('status') in ('active','offline'),x; assert 'token' not in d,x; assert d.get('signedToken')=='[stored]',x
          d=json.load(open('/tmp/status-basic.json')); d=d.get('data',d); open('/tmp/customer-installation','w').write(d['installationId'])
          PY
          python3 - <<'PY'
          import json
          json.dump({'licenseKey':open('/tmp/license-key').read(),'installationId':'secondary-live-install','projectName':'secondary','hostname':'secondary.invalid','appVersion':'v16-smoke'},open('/tmp/seat2.json','w'))
          PY
          code="$(curl --silent --output /tmp/seat2-response.json --write-out '%{http_code}' -H 'content-type: application/json' --data @/tmp/seat2.json "$CP_URL/v1/licenses/activate")"
          python3 - "$code" <<'PY'
          import json,sys
          x=json.load(open('/tmp/seat2-response.json')); assert int(sys.argv[1])==409,(sys.argv[1],x); assert x.get('error',{}).get('code')=='ACTIVATION_LIMIT_REACHED',x
          PY
          O="$(cat /tmp/owner-id)"
          (cd /tmp/pro && npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE settings SET subscription_plan='pro' WHERE user_id=${O};")
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" > /tmp/status-after-tamper.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/status-after-tamper.json')); d=x.get('data',x); assert d.get('effectivePlan')=='basic',x
          PY
          touch /tmp/v16-live-basic-seat-tamper.ok

      - name: Prove deactivate frees seat and direct deactivate returns it
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat /tmp/auth-token)"
          curl --fail --silent --show-error -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/deactivate" > /tmp/customer-deactivate.json
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/seat2.json "$CP_URL/v1/licenses/activate" > /tmp/seat2-success.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/seat2-success.json')); assert x.get('token') and x.get('license',{}).get('plan')=='basic',x
          json.dump({'token':x['token'],'installationId':'secondary-live-install'},open('/tmp/seat2-deactivate.json','w'))
          PY
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/seat2-deactivate.json "$CP_URL/v1/licenses/deactivate" > /tmp/seat2-deactivated.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate.json "$PRO_URL/api/license/activate" > /tmp/reactivated.json
          touch /tmp/v16-live-seat-reuse.ok

      - name: Central upgrade Basic to Pro and refresh customer token
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd /tmp/cp && npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE licenses SET plan='pro',updated_at='${NOW}' WHERE id='live-lic-1';")
          T="$(cat /tmp/auth-token)"
          curl --fail --silent --show-error -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/refresh" > /tmp/refreshed-pro.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/refreshed-pro.json')); d=x.get('data',x); assert d.get('effectivePlan')=='pro',x; assert 'token' not in d,x
          PY
          touch /tmp/v16-live-upgrade.ok

      - name: Central suspension must fail closed immediately after explicit refresh
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd /tmp/cp && npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE licenses SET status='suspended',updated_at='${NOW}' WHERE id='live-lic-1';")
          T="$(cat /tmp/auth-token)"
          code="$(curl --silent --output /tmp/suspend-refresh.json --write-out '%{http_code}' -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/refresh")"
          test "$code" = '403'
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" > /tmp/status-suspended.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/status-suspended.json')); d=x.get('data',x); assert d.get('status') in ('suspended','revoked','expired','invalid','unlicensed'),x; assert d.get('effectivePlan') is None,x
          PY
          code2="$(curl --silent --output /tmp/suspended-room.json --write-out '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data '{}' "$PRO_URL/api/rooms")"
          python3 - "$code2" <<'PY'
          import json,sys
          x=json.load(open('/tmp/suspended-room.json')); e=x.get('error',x.get('data',{}).get('error',{})); assert int(sys.argv[1]) in (402,403,409),(sys.argv[1],x); assert e.get('code') in ('LICENSE_REQUIRED','LICENSE_READ_ONLY'),x
          PY
          touch /tmp/v16-live-suspension.ok

      - name: Persist live evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          val(){ if [ -f "/tmp/v16-live-$1.ok" ]; then printf success; else printf failure; fi; }
          cat > v16-production-evidence/live-license-smoke-v11-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          source_artifact_id=${SOURCE_ARTIFACT_ID}
          source_artifact_sha256=${SOURCE_ARTIFACT_SHA256}
          prerequisites=$(val prereq)
          artifact_exact=$(val artifact)
          resources_created=$(val resources)
          control_plane_deployed=$(val cp-deploy)
          license_seed=$(val seed)
          pro_pages_deployed=$(val pro-deploy)
          preactivation_readonly=$(val preactivation)
          activation_one_seat_local_tamper=$(val basic-seat-tamper)
          deactivate_seat_reuse=$(val seat-reuse)
          central_upgrade_refresh=$(val upgrade)
          central_suspension_fail_closed=$(val suspension)
          cleanup=pending
          customer_ready=false
          deployed=true
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/live-license-smoke-v11-latest.txt
          git commit -m 'ci(v16): record isolated live license smoke v11' || exit 0
          git push origin HEAD:agent/v16-production-gate

      - name: Cleanup isolated Cloudflare resources
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${PRO_PAGES:-}" ]; then (cd /tmp/pro 2>/dev/null && npx wrangler pages project delete "$PRO_PAGES" --yes) || true; fi
          if [ -n "${PRO_D1:-}" ]; then (cd /tmp/pro 2>/dev/null && npx wrangler d1 delete "$PRO_D1" --skip-confirmation) || true; fi
          if [ -n "${CP_WORKER:-}" ]; then (cd /tmp/cp 2>/dev/null && npx wrangler delete --name "$CP_WORKER" --config wrangler.jsonc) || true; fi
          if [ -n "${CP_D1:-}" ]; then (cd /tmp/cp 2>/dev/null && npx wrangler d1 delete "$CP_D1" --skip-confirmation) || true; fi
          exit 0
