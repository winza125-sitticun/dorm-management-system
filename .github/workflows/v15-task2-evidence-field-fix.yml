name: V15 Task 2 Evidence Field Fix

on:
  workflow_dispatch:
  push:
    branches: [agent/v15-task1-white-label-contract]
    paths:
      - '.github/workflows/v15-task2-evidence-field-fix.yml'

permissions:
  contents: read
  actions: write

jobs:
  rerun-enriched-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify branch script contains explicit secret leak evidence
        uses: actions/checkout@v4
        with:
          ref: agent/v15-task1-white-label-contract

      - name: Verify evidence field and dispatch full D1 smoke
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'secretLeakCheck': True" .github/scripts/v15_task2_d1_smoke.py
          python3 -m py_compile .github/scripts/v15_task2_d1_smoke.py
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/v15-task2-d1-smoke.yml/dispatches" \
            -d '{"ref":"agent/v15-task1-white-label-contract"}'
