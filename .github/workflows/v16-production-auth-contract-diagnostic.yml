name: V16 Production Auth Contract Diagnostic
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-auth-contract-diagnostic.yml']
permissions: { contents: write, actions: read }
env:
  SOURCE_ARTIFACT_ID: '9365183203'
  SOURCE_ARTIFACT_SHA256: '102f94d86cdde64819420afbe747ca1d8ef6764977562df846f2d823be71e47f'
  PRO_ZIP_SHA256: 'c350d9ab87b1e379ec5fc37edb52ea4009d346d4f74ff62a62e164b7526c442b'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Download exact V10 Pro package and inspect rooms route handling
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o /tmp/source.zip
          echo "$SOURCE_ARTIFACT_SHA256  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/source /tmp/pro; mkdir -p /tmp/source /tmp/pro
          unzip -q /tmp/source.zip -d /tmp/source
          echo "$PRO_ZIP_SHA256  /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-PREVIEW.zip" | sha256sum -c -
          unzip -q /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-PREVIEW.zip -d /tmp/pro
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pro/functions/api/[[path]].ts')
          lines=p.read_text(errors='ignore').splitlines()
          needles=[
            'path === "/api/rooms"', "path === '/api/rooms'",
            'path.startsWith("/api/rooms', "path.startsWith('/api/rooms",
            'getAuthUser()', 'PlanAccessError', 'UNAUTHORIZED',
            'export const onRequest', 'export async function onRequest',
            'catch (error', 'catch (e',
          ]
          hits=[]
          for i,line in enumerate(lines,1):
            if any(n in line for n in needles): hits.append(i)
          out=[]
          emitted=[]
          for i in hits:
            start=max(1,i-22); end=min(len(lines),i+35)
            if any(start <= x <= end for x in emitted):
              continue
            emitted.append(i)
            out.append(f'--- functions/api/[[path]].ts:{start}-{end} ---')
            for n in range(start,end+1):
              s=lines[n-1]
              if len(s)>460: s=s[:460]
              out.append(f'{n}:{s}')
          # Always include file tail where top-level exception handling usually lives.
          start=max(1,len(lines)-140)
          out.append(f'--- functions/api/[[path]].ts:{start}-{len(lines)} (tail) ---')
          for n in range(start,len(lines)+1):
            s=lines[n-1]
            if len(s)>460: s=s[:460]
            out.append(f'{n}:{s}')
          Path('/tmp/auth-contract-v6.txt').write_text('\n'.join(out)+'\n')
          PY
          mkdir -p v16-production-evidence
          {
            echo "source_artifact_id=${SOURCE_ARTIFACT_ID}"
            echo "source_artifact_sha256=${SOURCE_ARTIFACT_SHA256}"
            echo "pro_zip_sha256=${PRO_ZIP_SHA256}"
            echo "cloudflare_touched=false"
            echo "existing_d1_touched=false"
            cat /tmp/auth-contract-v6.txt
          } > v16-production-evidence/auth-contract-diagnostic-v6-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/auth-contract-diagnostic-v6-latest.txt
          git commit -m 'ci(v16): record rooms route and outer handler' || exit 0
          git push origin HEAD:agent/v16-production-gate
