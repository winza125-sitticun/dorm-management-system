name: V16 Production Auth Contract Diagnostic
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-auth-contract-diagnostic.yml']
permissions: { contents: write, actions: read }
env:
  SOURCE_ARTIFACT_ID: '9365183203'
  SOURCE_ARTIFACT_SHA256: '102f94d86cdde64819420afbe747ca1d8ef6764977562df846f2d823be71e47f'
  PRO_ZIP_SHA256: 'c350d9ab87b1e379ec5fc37edb52ea4009d346d4f74ff62a62e164b7526c442b'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Inspect exact V10 mutation license error contract
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o /tmp/source.zip
          echo "$SOURCE_ARTIFACT_SHA256  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/source /tmp/pro; mkdir -p /tmp/source /tmp/pro
          unzip -q /tmp/source.zip -d /tmp/source
          echo "$PRO_ZIP_SHA256  /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-PREVIEW.zip" | sha256sum -c -
          unzip -q /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-PREVIEW.zip -d /tmp/pro
          python3 - <<'PY'
          from pathlib import Path
          out=[]
          for rel in ['src/server/services/license.service.ts','functions/api/[[path]].ts']:
            p=Path('/tmp/pro')/rel
            lines=p.read_text(errors='ignore').splitlines()
            needles=['class LicenseOperationError','assertMutationAllowedByLicense','LICENSE_REQUIRED','LICENSE_READ_ONLY','instanceof LicenseOperationError','instanceof PlanAccessError']
            hits=[i for i,s in enumerate(lines,1) if any(n in s for n in needles)]
            out.append(f'FILE={rel}')
            seen=set()
            for i in hits:
              a=max(1,i-5); b=min(len(lines),i+12)
              key=(a,b)
              if key in seen: continue
              seen.add(key)
              out.append(f'-- {a}-{b} --')
              for n in range(a,b+1):
                s=lines[n-1]
                if len(s)>320: s=s[:320]
                out.append(f'{n}:{s}')
          Path('/tmp/v9.txt').write_text('\n'.join(out)+'\n')
          PY
          mkdir -p v16-production-evidence
          {
            echo "source_artifact_id=${SOURCE_ARTIFACT_ID}"
            echo "source_artifact_sha256=${SOURCE_ARTIFACT_SHA256}"
            echo "pro_zip_sha256=${PRO_ZIP_SHA256}"
            echo "cloudflare_touched=false"
            echo "existing_d1_touched=false"
            cat /tmp/v9.txt
          } > v16-production-evidence/auth-contract-diagnostic-v9-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/auth-contract-diagnostic-v9-latest.txt
          git commit -m 'ci(v16): record mutation license error contract v9' || exit 0
          git push origin HEAD:agent/v16-production-gate
