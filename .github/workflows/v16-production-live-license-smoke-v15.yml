name: V16 Production Live License Acceptance V15
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v16-production-live-license-smoke-v15.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v16-production-live-license-smoke-v15, cancel-in-progress: true }
env:
  SOURCE_ARTIFACT_ID: '9391068149'
  SOURCE_ARTIFACT_SHA256: '14e094a00c75bf0b538df4b0d396264c3af28f53b96a95d379e01390005e72ff'
  CP_ZIP_SHA256: 'c4d510dad09ccc9d237319236bba9e54a0ac1d9091a906dc3d9fe81475fa7abc'
  PRO_ZIP_SHA256: '75945096ec0346dc31ab0b3c20ca25ee0828e2c0f4efd1fe0150ab6dd91a5182'
  EXPECTED_PUBLIC_KEY_B64: 'fgdHGCi74MiMXHbI5+KVY6S9wnh/L369ekdI8NmrwdY='
  EXPECTED_PUBLIC_KEY_SHA256: '6c8a2c8fda3dbf224148ff77464fda9bc252c082e05755f211c52a232ae3db82'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.V16_LICENSE_SIGNING_PRIVATE_KEY }}
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Verify production prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${LICENSE_SIGNING_PRIVATE_KEY:-}"
          node - <<'NODE'
          const crypto=require('node:crypto');
          let input=(process.env.LICENSE_SIGNING_PRIVATE_KEY||'').trim();
          if((input.startsWith('"')&&input.endsWith('"'))||(input.startsWith("'")&&input.endsWith("'")))input=input.slice(1,-1).trim();
          if(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=/.test(input))input=input.replace(/^V16_LICENSE_SIGNING_PRIVATE_KEY\s*=\s*/,'').trim();
          let privateKey;
          if(input.includes('BEGIN PRIVATE KEY')) privateKey=crypto.createPrivateKey(input);
          else privateKey=crypto.createPrivateKey({key:Buffer.from(input.replace(/\s+/g,''),'base64'),format:'der',type:'pkcs8'});
          const jwk=crypto.createPublicKey(privateKey).export({format:'jwk'});
          const raw=Buffer.from(jwk.x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-jwk.x.length%4)%4),'base64');
          const fp=crypto.createHash('sha256').update(raw).digest('hex');
          if(fp!==process.env.EXPECTED_PUBLIC_KEY_SHA256)throw new Error('signing key fingerprint mismatch');
          if(raw.toString('base64')!==process.env.EXPECTED_PUBLIC_KEY_B64)throw new Error('public key mismatch');
          NODE
          touch /tmp/v16-v15-prereq.ok

      - name: Download exact V13 candidate
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o /tmp/source.zip
          echo "$SOURCE_ARTIFACT_SHA256  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/source /tmp/cp /tmp/pro; mkdir -p /tmp/source /tmp/cp /tmp/pro
          unzip -q /tmp/source.zip -d /tmp/source
          echo "$CP_ZIP_SHA256  /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip" | sha256sum -c -
          echo "$PRO_ZIP_SHA256  /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V13.zip" | sha256sum -c -
          unzip -q /tmp/source/dorm-control-plane-v16-PRODUCTION-SOURCE-GATED.zip -d /tmp/cp
          unzip -q /tmp/source/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V13.zip -d /tmp/pro
          test "$(find /tmp/pro/d1-migrations -maxdepth 1 -type f -printf '%f\n' | sort | tail -n1)" = '0007_add_license_state.sql'
          grep -Fq "$EXPECTED_PUBLIC_KEY_B64" /tmp/pro/src/generated/licenseConfig.ts
          grep -Fq 'if (e instanceof PlanAccessError || e instanceof LicenseOperationError) throw e;' /tmp/pro/functions/api/[[path]].ts
          grep -Fq 'if (error instanceof PlanAccessError || error instanceof LicenseOperationError) {' /tmp/pro/functions/api/[[path]].ts
          touch /tmp/v16-v15-artifact.ok

      - name: Install candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && npm install --no-audit --no-fund)
          (cd /tmp/pro && npm ci)

      - name: Allocate unique current-run names
        shell: bash
        run: |
          set -euo pipefail
          M="$(printf '%s' "$GITHUB_RUN_ID" | tr -cd '0-9' | tail -c 9)-${GITHUB_RUN_ATTEMPT}-$(python3 -c 'import secrets; print(secrets.token_hex(3))')"
          echo "RUN_MARKER=$M" >> "$GITHUB_ENV"
          echo "CP_WORKER=v16-full-cp-${M}" >> "$GITHUB_ENV"
          echo "CP_D1=v16-full-cp-${M}-db" >> "$GITHUB_ENV"
          echo "PRO_PAGES=v16-full-pro-${M}" >> "$GITHUB_ENV"
          echo "PRO_D1=v16-full-pro-${M}-db" >> "$GITHUB_ENV"

      - name: Create fresh D1 resources and record ownership
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && timeout 120s npx wrangler d1 create "$CP_D1" --location apac && timeout 60s npx wrangler d1 info "$CP_D1" --json > /tmp/cp-d1.json)
          (cd /tmp/pro && timeout 120s npx wrangler d1 create "$PRO_D1" --location apac && timeout 60s npx wrangler d1 info "$PRO_D1" --json > /tmp/pro-d1.json)
          python3 - <<'PY'
          import json,os,re
          def get_uuid(path):
            x=json.load(open(path))
            def walk(v):
              if isinstance(v,dict):
                for k,val in v.items():
                  if k in ('uuid','id','database_id') and isinstance(val,str) and re.fullmatch(r'[0-9a-fA-F-]{36}',val): return val
                  r=walk(val)
                  if r:return r
              if isinstance(v,list):
                for val in v:
                  r=walk(val)
                  if r:return r
            r=walk(x); assert r,x; return r
          cp=get_uuid('/tmp/cp-d1.json'); pro=get_uuid('/tmp/pro-d1.json')
          marker={'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']}
          json.dump({**marker,'name':os.environ['CP_D1'],'uuid':cp},open('/tmp/owned-cp-d1.json','w'))
          json.dump({**marker,'name':os.environ['PRO_D1'],'uuid':pro},open('/tmp/owned-pro-d1.json','w'))
          json.dump({'name':os.environ['CP_WORKER'],'main':'src/index.ts','compatibility_date':'2026-08-05','d1_databases':[{'binding':'DB','database_name':os.environ['CP_D1'],'database_id':cp,'migrations_dir':'migrations'}]},open('/tmp/cp/wrangler.jsonc','w'),indent=2)
          json.dump({'name':os.environ['PRO_PAGES'],'compatibility_date':'2026-08-05','compatibility_flags':['nodejs_compat'],'pages_build_output_dir':'./dist','upload_source_maps':True,'d1_databases':[{'binding':'DB','database_name':os.environ['PRO_D1'],'database_id':pro,'migrations_dir':'./d1-migrations'}]},open('/tmp/pro/wrangler.jsonc','w'),indent=2)
          PY
          touch /tmp/v16-v15-resources.ok

      - name: Migrate and deploy fresh Control Plane
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/cp && timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd /tmp/cp && timeout 240s npx wrangler deploy --config wrangler.jsonc) | tee /tmp/cp-deploy.log
          printf '%s\n' "$LICENSE_SIGNING_PRIVATE_KEY" | (cd /tmp/cp && timeout 90s npx wrangler secret put LICENSE_SIGNING_PRIVATE_KEY --config wrangler.jsonc)
          CP_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/cp-deploy.log | tail -n1)"; test -n "$CP_URL"
          echo "CP_URL=$CP_URL" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os
          json.dump({'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'name':os.environ['CP_WORKER']},open('/tmp/owned-worker.json','w'))
          PY
          touch /tmp/v16-v15-cp-deploy.ok

      - name: Seed one-seat Basic license
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const key='V16-'+crypto.randomBytes(18).toString('hex').toUpperCase();
          const hash=crypto.createHash('sha256').update(key.trim().toUpperCase()).digest('hex');
          fs.writeFileSync('/tmp/license-key',key); fs.writeFileSync('/tmp/license-hash',hash);
          NODE
          H="$(cat /tmp/license-hash)"; NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd /tmp/cp && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "INSERT INTO licenses(id,key_hash,customer_label,plan,status,max_activations,expires_at,created_at,updated_at) VALUES('live-lic-1','${H}','V16 isolated smoke','basic','active',1,NULL,'${NOW}','${NOW}');")
          touch /tmp/v16-v15-seed.ok

      - name: Create configure and deploy fresh Pro Pages
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/pro && timeout 120s npx wrangler pages project create "$PRO_PAGES" --production-branch main)
          python3 - <<'PY'
          import json,os
          json.dump({'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'name':os.environ['PRO_PAGES']},open('/tmp/owned-pages.json','w'))
          PY
          JWT="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '%s\n' "$JWT" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put JWT_SECRET --project-name "$PRO_PAGES")
          printf '%s\n' "$CP_URL" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put LICENSE_CONTROL_PLANE_URL --project-name "$PRO_PAGES")
          printf '%s\n' "$EXPECTED_PUBLIC_KEY_B64" | (cd /tmp/pro && timeout 90s npx wrangler pages secret put LICENSE_SIGNING_PUBLIC_KEY --project-name "$PRO_PAGES")
          unset JWT
          (cd /tmp/pro && timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc)
          (cd /tmp/pro && npm run build:pages)
          (cd /tmp/pro && timeout 240s npx wrangler pages deploy dist --project-name "$PRO_PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false) | tee /tmp/pro-deploy.log
          PRO_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/pro-deploy.log | tail -n1)"; test -n "$PRO_URL"
          echo "PRO_URL=$PRO_URL" >> "$GITHUB_ENV"
          ready=0; for i in $(seq 1 90); do if curl --fail --silent --show-error --max-time 10 "$PRO_URL/" -o /dev/null; then ready=1; break; fi; sleep 2; done; test "$ready" = 1
          touch /tmp/v16-v15-pro-deploy.ok

      - name: Bootstrap owner and prove preactivation read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,secrets
          email=f"v16-full-{os.environ['RUN_MARKER']}@example.invalid"; pwd='V16!FullAa'+secrets.token_hex(8)
          json.dump({'email':email,'password':pwd,'displayName':'V16 Full Smoke','dormName':'V16 Full Dorm'},open('/tmp/setup.json','w'))
          json.dump({'username':email,'password':pwd},open('/tmp/login.json','w'))
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors -H 'content-type: application/json' --data @/tmp/setup.json "$PRO_URL/api/setup/init" > /tmp/setup-response.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors -H 'content-type: application/json' --data @/tmp/login.json "$PRO_URL/api/auth/login" > /tmp/login-response.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/login-response.json')); d=x.get('data',x); assert d.get('token') and d.get('user'),x
          open('/tmp/auth-token','w').write(str(d['token'])); open('/tmp/owner-id','w').write(str(d['user']['id']))
          PY
          T="$(cat /tmp/auth-token)"
          code="$(curl --silent --output /tmp/pre-room.json --write-out '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data '{}' "$PRO_URL/api/rooms")"
          python3 - "$code" <<'PY'
          import json,sys
          x=json.load(open('/tmp/pre-room.json')); assert int(sys.argv[1])==403,(sys.argv[1],x); assert x.get('error',{}).get('code')=='LICENSE_READ_ONLY',x
          PY
          touch /tmp/v16-v15-preactivation.ok

      - name: Activate Basic enforce one seat and reject local Pro tamper
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat /tmp/auth-token)"
          python3 - <<'PY'
          import json
          json.dump({'licenseKey':open('/tmp/license-key').read()},open('/tmp/activate.json','w'))
          PY
          curl --fail --silent --show-error -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate.json "$PRO_URL/api/license/activate" > /tmp/activated.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" > /tmp/status-basic.json
          python3 - <<'PY'
          import json
          for f in ('/tmp/activated.json','/tmp/status-basic.json'):
            x=json.load(open(f)); d=x.get('data',x); assert d.get('effectivePlan')=='basic',x; assert d.get('status') in ('active','offline'),x; assert 'token' not in d,x
          PY
          python3 - <<'PY'
          import json
          json.dump({'licenseKey':open('/tmp/license-key').read(),'installationId':'secondary-live-install','projectName':'secondary','hostname':'secondary.invalid','appVersion':'v16-smoke'},open('/tmp/seat2.json','w'))
          PY
          code="$(curl --silent --output /tmp/seat2-response.json --write-out '%{http_code}' -H 'content-type: application/json' --data @/tmp/seat2.json "$CP_URL/v1/licenses/activate")"
          python3 - "$code" <<'PY'
          import json,sys
          x=json.load(open('/tmp/seat2-response.json')); assert int(sys.argv[1])==409,(sys.argv[1],x); assert x.get('error',{}).get('code')=='ACTIVATION_LIMIT_REACHED',x
          PY
          O="$(cat /tmp/owner-id)"
          (cd /tmp/pro && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE settings SET subscription_plan='pro' WHERE user_id=${O};")
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" > /tmp/status-after-tamper.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/status-after-tamper.json')); d=x.get('data',x); assert d.get('effectivePlan')=='basic',x
          PY
          touch /tmp/v16-v15-basic-seat-tamper.ok

      - name: Deactivate frees seat and reactivate customer
        shell: bash
        run: |
          set -euo pipefail
          T="$(cat /tmp/auth-token)"
          curl --fail --silent --show-error -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/deactivate" > /tmp/deactivated.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/deactivated.json')); d=x.get('data',x); assert d.get('effectivePlan') is None,x
          PY
          python3 - <<'PY'
          import json
          json.dump({'licenseKey':open('/tmp/license-key').read(),'installationId':'secondary-live-install','projectName':'secondary','hostname':'secondary.invalid','appVersion':'v16-smoke'},open('/tmp/seat2.json','w'))
          PY
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/seat2.json "$CP_URL/v1/licenses/activate" > /tmp/seat2-active.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/seat2-active.json')); assert x.get('license',{}).get('plan')=='basic' or x.get('data',{}).get('license',{}).get('plan')=='basic',x
          PY
          # release secondary directly, then reactivate primary
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/seat2-active.json')); token=x.get('token') or x.get('data',{}).get('token'); assert token; json.dump({'token':token,'installationId':'secondary-live-install'},open('/tmp/seat2-deactivate.json','w'))
          PY
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/seat2-deactivate.json "$CP_URL/v1/licenses/deactivate" > /tmp/seat2-deactivated.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate.json "$PRO_URL/api/license/activate" > /tmp/reactivated.json
          touch /tmp/v16-v15-seat-reuse.ok

      - name: Central Basic to Pro upgrade then refresh
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd /tmp/cp && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE licenses SET plan='pro',updated_at='${NOW}' WHERE id='live-lic-1';")
          T="$(cat /tmp/auth-token)"
          curl --fail --silent --show-error -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/refresh" > /tmp/refreshed-pro.json
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" > /tmp/status-pro.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/status-pro.json')); d=x.get('data',x); assert d.get('effectivePlan')=='pro',x
          PY
          touch /tmp/v16-v15-upgrade.ok

      - name: Central suspension fails closed after explicit refresh
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd /tmp/cp && timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "UPDATE licenses SET status='suspended',updated_at='${NOW}' WHERE id='live-lic-1';")
          T="$(cat /tmp/auth-token)"
          code="$(curl --silent --output /tmp/suspend-refresh.json --write-out '%{http_code}' -X POST -H "authorization: Bearer $T" "$PRO_URL/api/license/refresh")"
          test "$code" = '403'
          curl --fail --silent --show-error -H "authorization: Bearer $T" "$PRO_URL/api/license/status" > /tmp/status-suspended.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/status-suspended.json')); d=x.get('data',x); assert d.get('effectivePlan') is None,x
          PY
          code2="$(curl --silent --output /tmp/suspended-room.json --write-out '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data '{}' "$PRO_URL/api/rooms")"
          python3 - "$code2" <<'PY'
          import json,sys
          x=json.load(open('/tmp/suspended-room.json')); assert int(sys.argv[1])==403,(sys.argv[1],x); assert x.get('error',{}).get('code')=='LICENSE_READ_ONLY',x
          PY
          touch /tmp/v16-v15-suspension.ok

      - name: Persist live evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          val(){ if [ -f "/tmp/v16-v15-$1.ok" ]; then printf success; else printf failure; fi; }
          cat > v16-production-evidence/live-license-smoke-v15-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          source_artifact_id=${SOURCE_ARTIFACT_ID}
          source_artifact_sha256=${SOURCE_ARTIFACT_SHA256}
          cp_zip_sha256=${CP_ZIP_SHA256}
          pro_zip_sha256=${PRO_ZIP_SHA256}
          prerequisites=$(val prereq)
          exact_artifact=$(val artifact)
          resources_created=$(val resources)
          control_plane_deployed=$(val cp-deploy)
          license_seed=$(val seed)
          pro_pages_deployed=$(val pro-deploy)
          preactivation_readonly=$(val preactivation)
          activation_one_seat_local_tamper=$(val basic-seat-tamper)
          deactivate_seat_reuse=$(val seat-reuse)
          central_upgrade_refresh=$(val upgrade)
          central_suspension_fail_closed=$(val suspension)
          cleanup=guarded_pending
          existing_d1_touched=false
          customer_ready=false
          deployed=true
          EOF
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/live-license-smoke-v15-latest.txt
          git commit -m 'ci(v16): record full live license acceptance v15' || exit 0
          git push origin HEAD:agent/v16-production-gate

      - name: Cleanup only verified current-run resources
        if: always()
        shell: bash
        run: |
          set +e
          verify_marker(){ python3 - "$1" "$2" "$3" <<'PY'
          import json,os,sys,re
          p,name,kind=sys.argv[1:]
          x=json.load(open(p)); assert x['run_id']==os.environ['GITHUB_RUN_ID']; assert x['attempt']==os.environ['GITHUB_RUN_ATTEMPT']; assert x['name']==name
          assert name.startswith('v16-full-')
          if kind=='d1': assert re.fullmatch(r'[0-9a-fA-F-]{36}',x['uuid'])
          PY
          }
          if [ -f /tmp/owned-pages.json ] && verify_marker /tmp/owned-pages.json "$PRO_PAGES" pages; then timeout 120s bash -lc 'cd /tmp/pro && npx wrangler pages project delete "$PRO_PAGES" --yes' || true; fi
          if [ -f /tmp/owned-worker.json ] && verify_marker /tmp/owned-worker.json "$CP_WORKER" worker; then timeout 120s bash -lc 'cd /tmp/cp && npx wrangler delete --name "$CP_WORKER" --config wrangler.jsonc' || true; fi
          if [ -f /tmp/owned-pro-d1.json ] && verify_marker /tmp/owned-pro-d1.json "$PRO_D1" d1; then
            timeout 60s bash -lc 'cd /tmp/pro && npx wrangler d1 info "$PRO_D1" --json > /tmp/pro-d1-current.json' || true
            python3 - <<'PY' && timeout 120s bash -lc 'cd /tmp/pro && npx wrangler d1 delete "$PRO_D1" --skip-confirmation' || true
          import json,re
          old=json.load(open('/tmp/owned-pro-d1.json')); cur=json.load(open('/tmp/pro-d1-current.json'))
          s=json.dumps(cur); assert old['uuid'] in s
          PY
          fi
          if [ -f /tmp/owned-cp-d1.json ] && verify_marker /tmp/owned-cp-d1.json "$CP_D1" d1; then
            timeout 60s bash -lc 'cd /tmp/cp && npx wrangler d1 info "$CP_D1" --json > /tmp/cp-d1-current.json' || true
            python3 - <<'PY' && timeout 120s bash -lc 'cd /tmp/cp && npx wrangler d1 delete "$CP_D1" --skip-confirmation' || true
          import json
          old=json.load(open('/tmp/owned-cp-d1.json')); cur=json.load(open('/tmp/cp-d1-current.json')); assert old['uuid'] in json.dumps(cur)
          PY
          fi
          exit 0
