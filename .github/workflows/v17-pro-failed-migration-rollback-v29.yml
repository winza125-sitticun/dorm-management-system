name: V17 Pro Failed Migration Rollback Gate V29
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v17-pro-failed-migration-rollback-v29.yml']
permissions: { contents: write, actions: read }
concurrency: { group: v17-pro-failed-migration-rollback-v29, cancel-in-progress: false }
env:
  V16_FINAL_ARTIFACT_ID: '9393238249'
  V16_FINAL_ARTIFACT_SHA256: 'fe17d6426d66722068fd2d003590ca3d0ef188d19dca33c58ed6200ed2de85f1'
  V16_PRO_SHA256: 'c2f46f8e6ca251b7476a8e1bc510e9fedd1f17e516c9ad5a17338f8504933e04'
  V17_ARTIFACT_ID: '9394092671'
  V17_ARTIFACT_SHA256: '0503ec400e7e52e7e9a23723155aa2eebbc3e64f8ead898cc49b9a9968f63ad3'
  STABLE_CP_D1: 'dorm-license-control-plane-v16-db'
  STABLE_CP_D1_UUID: '68695864-48de-4d8a-932b-9d11cd4d6b4d'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: "fulfilling-communication / production"
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify exact V16 and V17 artifacts
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'job_status=success' v17-production-evidence/live-upgrade-v20-latest.txt
          rm -rf /tmp/v16a /tmp/v17a /tmp/v16 /tmp/cp;mkdir -p /tmp/v16a /tmp/v17a /tmp/v16 /tmp/cp
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V16_FINAL_ARTIFACT_ID}/zip" -o /tmp/v16a.zip
          echo "$V16_FINAL_ARTIFACT_SHA256  /tmp/v16a.zip"|sha256sum -c -;unzip -q /tmp/v16a.zip -d /tmp/v16a
          R16=/tmp/v16a;[ -f "$R16/CUSTOMER-READY-SHA256SUMS.txt" ]||R16="$(dirname "$(find /tmp/v16a -name CUSTOMER-READY-SHA256SUMS.txt -print -quit)")";(cd "$R16"&&sha256sum -c CUSTOMER-READY-SHA256SUMS.txt)
          P16="$R16/customer-previews/dorm-management-system-pro-v16-SOURCE-GATE-V29.zip";echo "$V16_PRO_SHA256  $P16"|sha256sum -c -;unzip -q "$P16" -d /tmp/v16
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V17_ARTIFACT_ID}/zip" -o /tmp/v17a.zip
          echo "$V17_ARTIFACT_SHA256  /tmp/v17a.zip"|sha256sum -c -;unzip -q /tmp/v17a.zip -d /tmp/v17a
          R17=/tmp/v17a;[ -f "$R17/SHA256SUMS.txt" ]||R17="$(dirname "$(find /tmp/v17a -name SHA256SUMS.txt -print -quit)")";(cd "$R17"&&sha256sum -c SHA256SUMS.txt)
          cp "$R17/BOOTSTRAP-V16-TO-V17.mjs" /tmp/v16/;unzip -q "$R17/dorm-control-plane-v17-SOURCE-GATE-V11.zip" -d /tmp/cp
          test "$(node -p "require('/tmp/v16/package.json').version")" = 1.1.0
          touch /tmp/v29-exact.ok
      - name: Seed run-scoped Pro license
        working-directory: /tmp/cp
        shell: bash
        run: |
          set -euo pipefail;npm ci;npx wrangler d1 list --json >/tmp/cpd1
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/cpd1'));r=x if isinstance(x,list) else x.get('result',x.get('databases',[]));m=[q for q in r if q.get('name')==os.environ['STABLE_CP_D1']];assert len(m)==1;u=m[0].get('uuid') or m[0].get('id');assert u==os.environ['STABLE_CP_D1_UUID'];json.dump({'name':'dorm-control-plane','main':'src/index.ts','compatibility_date':'2026-08-05','d1_databases':[{'binding':'DB','database_name':os.environ['STABLE_CP_D1'],'database_id':u,'migrations_dir':'migrations'}]},open('wrangler.v29.jsonc','w'))
          PY
          LIC="lic-v17-v29-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}";KEY="V29-$(node -e "process.stdout.write(require('node:crypto').randomBytes(18).toString('hex').toUpperCase())")";HASH="$(printf '%s' "$KEY"|sha256sum|awk '{print $1}')";NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)";printf '%s' "$LIC">/tmp/lic;printf '%s' "$KEY">/tmp/key
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.v29.jsonc --command "INSERT INTO licenses(id,key_hash,customer_label,plan,status,max_activations,expires_at,created_at,updated_at) VALUES('${LIC}','${HASH}','V17 V29 rollback','pro','active',1,NULL,'${NOW}','${NOW}');" >/dev/null
          touch /tmp/v29-license.ok
      - name: Deploy disposable exact V16 Pro
        working-directory: /tmp/v16
        shell: bash
        run: |
          set -euo pipefail;npm ci
          M="$(printf '%s' "$GITHUB_RUN_ID"|tail -c 9)-${GITHUB_RUN_ATTEMPT}-$(python3 -c 'import secrets;print(secrets.token_hex(3))')";D1="v17-v29-${M}-db";PAGES="v17-v29-${M}";printf 'D1=%q\nPAGES=%q\n' "$D1" "$PAGES">/tmp/v29.env
          timeout 120s npx wrangler d1 create "$D1" --location apac;timeout 60s npx wrangler d1 info "$D1" --json >/tmp/d1info
          python3 - "$D1" "$PAGES" <<'PY'
          import json,re,sys
          s=json.dumps(json.load(open('/tmp/d1info')));m=re.search(r'[0-9a-fA-F-]{36}',s);assert m
          json.dump({'name':sys.argv[2],'compatibility_date':'2026-08-05','compatibility_flags':['nodejs_compat'],'pages_build_output_dir':'./dist','upload_source_maps':True,'d1_databases':[{'binding':'DB','database_name':sys.argv[1],'database_id':m.group(0),'migrations_dir':'./d1-migrations'}]},open('wrangler.jsonc','w'))
          PY
          timeout 120s npx wrangler pages project create "$PAGES" --production-branch main
          JWT="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')";printf '%s\n' "$JWT"|timeout 90s npx wrangler pages secret put JWT_SECRET --project-name "$PAGES";unset JWT
          timeout 180s npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc;npm run build:pages
          timeout 240s npx wrangler pages deploy dist --project-name "$PAGES" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false >/tmp/pages
          URL="https://${PAGES}.pages.dev";printf 'URL=%q\n' "$URL">>/tmp/v29.env
          for i in $(seq 1 60);do curl --fail -s --max-time 10 "$URL/" -o /dev/null&&break;sleep 2;done
          npx wrangler pages deployment list --project-name "$PAGES" --json >/tmp/deploy-before
          touch /tmp/v29-deploy.ok
      - name: Activate and capture baseline
        shell: bash
        run: |
          set -euo pipefail;set -a;. /tmp/v29.env;set +a
          post(){ local data="$1" path="$2" out="$3" c=;for i in $(seq 1 45);do c="$(curl -sS -o "$out" -w '%{http_code}' --max-time 15 -H 'content-type: application/json' --data @"$data" "$URL$path"||true)";[[ "$c" =~ ^2 ]]&&return 0;sleep 2;done;cat "$out" >&2||true;return 1; }
          get(){ local t="$1" path="$2" out="$3" c=;for i in $(seq 1 45);do c="$(curl -sS -o "$out" -w '%{http_code}' --max-time 15 -H "authorization: Bearer $t" "$URL$path"||true)";[[ "$c" =~ ^2 ]]&&return 0;sleep 2;done;cat "$out" >&2||true;return 1; }
          EMAIL="v29-${GITHUB_RUN_ID}@example.invalid";PASS="V29!ReadyAa$(python3 -c 'import secrets;print(secrets.token_hex(10))')";printf '%s' "$EMAIL">/tmp/email;printf '%s' "$PASS">/tmp/pass
          python3 - <<'PY'
          import json
          e=open('/tmp/email').read();p=open('/tmp/pass').read();json.dump({'email':e,'password':p,'displayName':'V29','dormName':'V29'},open('/tmp/setup','w'));json.dump({'username':e,'password':p},open('/tmp/login','w'));json.dump({'licenseKey':open('/tmp/key').read()},open('/tmp/activate','w'))
          PY
          post /tmp/setup /api/setup/init /tmp/setupout;post /tmp/login /api/auth/login /tmp/loginout
          node -e "const fs=require('node:fs'),x=JSON.parse(fs.readFileSync('/tmp/loginout')),d=x.data||x;if(!d.token)process.exit(1);fs.writeFileSync('/tmp/auth',d.token)"
          T="$(cat /tmp/auth)";for i in $(seq 1 30);do c="$(curl -sS -o /tmp/act -w '%{http_code}' -H "authorization: Bearer $T" -H 'content-type: application/json' --data @/tmp/activate "$URL/api/license/activate"||true)";[ "$c" = 200 ]&&break;sleep 2;done;test "$c" = 200
          get "$T" /api/admin/backup/export /tmp/before
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),x=JSON.parse(fs.readFileSync('/tmp/before')),p=x.data||x,canon=v=>Array.isArray(v)?v.map(canon):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canon(v[k])])):v;fs.writeFileSync('/tmp/before.sha',crypto.createHash('sha256').update(JSON.stringify(canon(p.data))).digest('hex'));
          NODE
          touch /tmp/v29-baseline.ok
      - name: Inject migration failure and prove non-mutation
        working-directory: /tmp/v16
        shell: bash
        run: |
          set -euo pipefail;set -a;. /tmp/v29.env;set +a
          export DORM_UPDATE_ADMIN_USERNAME="$(cat /tmp/email)" DORM_UPDATE_ADMIN_PASSWORD="$(cat /tmp/pass)"
          REAL_NPM="$(command -v npm)";mkdir -p /tmp/v29-shim;cat >/tmp/v29-shim/npm <<EOF
          #!/usr/bin/env bash
          if [ "\$*" = "run d1:migrate:remote" ];then echo V29_INJECTED_MIGRATION_FAILURE >&2;exit 97;fi
          exec "$REAL_NPM" "\$@"
          EOF
          chmod +x /tmp/v29-shim/npm;export PATH="/tmp/v29-shim:$PATH"
          set +e;timeout 1200s node BOOTSTRAP-V16-TO-V17.mjs >/tmp/bootstrap 2>&1;RC=$?;set -e;cat /tmp/bootstrap
          test "$RC" -ne 0;grep -q V29_INJECTED_MIGRATION_FAILURE /tmp/bootstrap
          test "$(node -p "require('./package.json').version")" = 1.1.0;test ! -f .dorm-update-state.json
          find backups -maxdepth 1 -name 'pre-update-*.dormbackup' -print -quit|grep -q .
          timeout 90s npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='update_state';" >/tmp/state;! grep -q update_state /tmp/state
          npx wrangler pages deployment list --project-name "$PAGES" --json >/tmp/deploy-after
          python3 - <<'PY'
          import json
          def canonical(p):
            return json.dumps(json.load(open(p)),sort_keys=True,separators=(',',':'))
          a=canonical('/tmp/deploy-before');b=canonical('/tmp/deploy-after');assert a==b,(a,b)
          PY
          for i in $(seq 1 45);do c="$(curl -sS -o /tmp/login2 -w '%{http_code}' -H 'content-type: application/json' --data @/tmp/login "$URL/api/auth/login"||true)";[[ "$c" =~ ^2 ]]&&break;sleep 2;done;[[ "$c" =~ ^2 ]]
          node -e "const fs=require('node:fs'),x=JSON.parse(fs.readFileSync('/tmp/login2')),d=x.data||x;fs.writeFileSync('/tmp/auth2',d.token)"
          T="$(cat /tmp/auth2)";for i in $(seq 1 45);do c="$(curl -sS -o /tmp/after -w '%{http_code}' -H "authorization: Bearer $T" "$URL/api/admin/backup/export"||true)";[[ "$c" =~ ^2 ]]&&break;sleep 2;done;[[ "$c" =~ ^2 ]]
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),x=JSON.parse(fs.readFileSync('/tmp/after')),p=x.data||x,canon=v=>Array.isArray(v)?v.map(canon):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canon(v[k])])):v,h=crypto.createHash('sha256').update(JSON.stringify(canon(p.data))).digest('hex');if(h!==fs.readFileSync('/tmp/before.sha','utf8').trim())throw Error(h);fs.writeFileSync('/tmp/after.sha',h)
          NODE
          touch /tmp/v29-rollback.ok
      - name: Guarded cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/lic ]&&[ -f /tmp/cp/wrangler.v29.jsonc ];then LIC="$(cat /tmp/lic)";[[ "$LIC" == lic-v17-v29-* ]]&&cd /tmp/cp&&timeout 90s npx wrangler d1 execute DB --remote --config wrangler.v29.jsonc --command "DELETE FROM license_events WHERE license_id='${LIC}';DELETE FROM activations WHERE license_id='${LIC}';DELETE FROM licenses WHERE id='${LIC}';" >/dev/null;fi
          if [ -f /tmp/v29.env ];then set -a;. /tmp/v29.env;set +a;[[ "$PAGES" == v17-v29-* ]]&&[[ "$D1" == v17-v29-*-db ]]&&cd /tmp/v16&&timeout 120s npx wrangler pages project delete "$PAGES" --yes&&timeout 120s npx wrangler d1 delete "$D1" --skip-confirmation;fi
          touch /tmp/v29-cleanup.ok;exit 0
      - name: Persist V29 evidence
        if: always()
        env: { JOB_STATUS: '${{ job.status }}' }
        shell: bash
        run: |
          set -euo pipefail;mkdir -p v17-production-evidence;v(){ [ -f "/tmp/v29-$1.ok" ]&&printf success||printf failure;};cat >v17-production-evidence/pro-failed-migration-rollback-v29-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          exact_artifacts=$(v exact)
          run_scoped_license=$(v license)
          disposable_v16_pro=$(v deploy)
          licensed_baseline=$(v baseline)
          injected_migration_failure_rollback=$(v rollback)
          automatic_backup_created=$([ -d /tmp/v16/backups ]&&find /tmp/v16/backups -maxdepth 1 -name 'pre-update-*.dormbackup' -print -quit|grep -q .&&printf true||printf false)
          before_business_sha256=$(cat /tmp/before.sha 2>/dev/null||printf unavailable)
          after_business_sha256=$(cat /tmp/after.sha 2>/dev/null||printf unavailable)
          local_version_after_failure=1.1.0
          update_state_created=false
          pages_redeployed=false
          cleanup=$(v cleanup)
          v16_rebuilt=false
          v16_modified=false
          existing_customer_d1_touched=false
          v17_customer_ready=false
          EOF
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add v17-production-evidence/pro-failed-migration-rollback-v29-latest.txt;git commit -m 'ci(v17): record Pro failed migration rollback v29' || exit 0;git fetch origin agent/v16-production-gate;git rebase origin/agent/v16-production-gate;git push origin HEAD:agent/v16-production-gate