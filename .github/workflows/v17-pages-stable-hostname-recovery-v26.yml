name: V17 Pages Stable Hostname Recovery V26
on:
  push:
    branches: [agent/v16-production-gate]
    paths: ['.github/workflows/v17-pages-stable-hostname-recovery-v26.yml']
permissions: { contents: write }
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/v16-production-gate }
      - name: Normalize live gates to stable Pages hostname
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths=[
            Path('.github/workflows/v17-live-upgrade-v20.yml'),
            Path('.github/workflows/v17-failed-migration-rollback-v24.yml'),
            Path('.github/workflows/v17-network-retry-idempotency-v25.yml'),
          ]
          pat=re.compile(r'URL="\$\(grep -Eo .*? /tmp/pages\|tail -n1\)";test -n "\$URL";')
          for p in paths:
            s=p.read_text()
            s2,n=pat.subn('URL="https://${PAGES}.pages.dev";',s,count=1)
            if n != 1:
              raise SystemExit(f'hostname anchor count {n}: {p}')
            p.write_text(s2)
          PY
          grep -Fq 'URL="https://${PAGES}.pages.dev";' .github/workflows/v17-live-upgrade-v20.yml
          grep -Fq 'URL="https://${PAGES}.pages.dev";' .github/workflows/v17-failed-migration-rollback-v24.yml
          grep -Fq 'URL="https://${PAGES}.pages.dev";' .github/workflows/v17-network-retry-idempotency-v25.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v17-live-upgrade-v20.yml .github/workflows/v17-failed-migration-rollback-v24.yml .github/workflows/v17-network-retry-idempotency-v25.yml
          git commit -m 'ci(v17): use stable Pages hostnames in live gates'
          git fetch origin agent/v16-production-gate
          git rebase origin/agent/v16-production-gate
          git push origin HEAD:agent/v16-production-gate