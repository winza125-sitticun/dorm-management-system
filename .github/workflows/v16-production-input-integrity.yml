name: V16 Production Input Integrity

on:
  workflow_dispatch:
  push:
    branches: [agent/v16-production-gate]
    paths:
      - 'v16-production-inputs/**'
      - '.github/workflows/v16-production-input-integrity.yml'

permissions:
  contents: write

concurrency:
  group: v16-production-input-integrity
  cancel-in-progress: true

env:
  INPUT_ARCHIVE_SHA256: '43b2d44d508a02a431f2a405b5e95f8fbf850cca17b522446d1d6e0630d4d0f7'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v16-production-gate

      - name: Reconstruct frozen V16 production inputs
        shell: bash
        run: |
          set -euo pipefail
          cat v16-production-inputs/input-*.b64 | base64 --decode > /tmp/v16-production-inputs.tar.xz
          echo "$INPUT_ARCHIVE_SHA256  /tmp/v16-production-inputs.tar.xz" | sha256sum --check --strict
          rm -rf /tmp/v16-inputs
          tar -xJf /tmp/v16-production-inputs.tar.xz -C /tmp
          test -d /tmp/v16-inputs
          cd /tmp/v16-inputs
          sha256sum --check --strict SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt | tr -d ' ')" = '4'
          test -f V16_TASK5_CONTROL_PLANE_REVIEW.zip
          test -f V16_TASK6_EXACT_V15.patch
          test -f V16_TASK7.patch
          test -f V16_TASK8_PRODUCTION.patch
          unzip -t V16_TASK5_CONTROL_PLANE_REVIEW.zip >/dev/null

      - name: Persist integrity evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v16-production-evidence
          cat > v16-production-evidence/input-integrity-latest.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${GITHUB_SHA}
          job_status=${JOB_STATUS}
          input_archive_sha256=${INPUT_ARCHIVE_SHA256}
          task5_sha256=e6bd35095faf8a77cd0da540b276ae69a0c6449898207ff6ece8f4e9b9c54345
          task6_sha256=3d407226a0d67142c744b770e2cc20abc61493383b0da00ecf4d71cf32467dc4
          task7_sha256=1a02bdd67a1480a6136b80fd8fe127dc980d6d545b058198043d7db6de80a703
          task8_sha256=df3f5aae2e479a411a75408e88017ea9dc964088bd40bfe4b04846f9a769e4b2
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-production-evidence/input-integrity-latest.txt
          git commit -m 'ci(v16): record production input integrity' || exit 0
          git push origin HEAD:agent/v16-production-gate
